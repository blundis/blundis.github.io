<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drawthing — 2D Character Prototype</title>
<style>
  :root{
    --chrome:#23201e;
    --chrome-2:#2e2a27;
    --chrome-3:#3b3633;
    --ink:#efe9e0;
    --muted:#a49a8f;
    --accent:#6ea8ff;
    --paper:#F7F4EE;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:13px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--chrome);color:var(--ink);
    display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;
  }
  /* the editor row: toolbar | stage | palette. It is the whole of the body now
     that the animation bar floats inside the stage rather than sitting under it. */
  #main{flex:1;display:flex;min-height:0}

  /* ---------- left toolbar ---------- */
  #toolbar{
    width:74px;flex:0 0 74px;background:var(--chrome-2);
    border-right:1px solid #171513;
    display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;
  }
  #toolbar .logo{font-size:10px;letter-spacing:.14em;color:var(--muted);text-align:center;margin-bottom:4px}
  .tool{
    width:52px;height:52px;border-radius:12px;border:1px solid transparent;
    background:var(--chrome-3);color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;position:relative;
    transition:background .12s,border-color .12s,transform .08s;
  }
  .tool:hover{background:#4a4441}
  .tool:active{transform:scale(.95)}
  .tool.active{background:#514a45;border-color:var(--accent);box-shadow:0 0 0 2px rgba(110,168,255,.22)}
  .tool svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tool .kbd{position:absolute;right:4px;bottom:2px;font-size:9px;color:var(--muted)}
  .tip{
    position:absolute;left:62px;white-space:nowrap;background:#111;color:#fff;
    padding:5px 9px;border-radius:6px;font-size:11px;opacity:0;pointer-events:none;
    transition:opacity .12s;z-index:50;
  }
  .tool:hover .tip{opacity:.96}
  .sep{width:36px;height:1px;background:#4a4441;margin:4px 0}

  /* ---------- stage ---------- */
  #stage{flex:1;position:relative;min-width:0;overflow:hidden}
  canvas{display:block;position:absolute;inset:0;touch-action:none}
  #topbar{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;align-items:center;justify-content:center;z-index:10;
    flex-wrap:wrap;max-width:calc(100% - 24px);
    background:rgba(35,32,30,.86);backdrop-filter:blur(6px);
    border:1px solid #171513;border-radius:11px;padding:6px;
  }
  .seg{display:flex;background:#191716;border-radius:8px;padding:2px}
  .seg button{
    border:0;background:transparent;color:var(--muted);padding:6px 16px;
    border-radius:6px;cursor:pointer;font:inherit;font-weight:600;letter-spacing:.03em;
    position:relative;
  }
  .seg button .kbd{position:absolute;right:4px;bottom:1px;font-size:9px;font-weight:400;
    letter-spacing:0;color:var(--muted);opacity:.75;line-height:1}
  .seg button.on{background:var(--chrome-3);color:var(--ink)}
  /* the key badge names how to GET somewhere, so it belongs on the view you are
     NOT standing on - on the active button it is telling you nothing */
  .seg button.on .kbd{display:none}
  /* a sheet has up to six views and their names are long */
  .seg.compact button{padding:6px 9px;letter-spacing:0}
  .btn{
    border:1px solid #4a4441;background:var(--chrome-3);color:var(--ink);
    padding:6px 11px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap;
  }
  .btn:not(:disabled):hover{background:#4a4441}
  .btn:disabled{opacity:.35;cursor:default}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);padding:0 8px;cursor:pointer}

  /* ---------- the animation bar ----------
     One animation per document. A floating pill at the bottom of the stage,
     matching #topbar at the top of it: same chrome, same rounding, same blur.
     It sits INSIDE #stage, so it costs the canvas no height and resize(), the
     ResizeObserver and the self-heal at the top of render() are untouched. */
  /* Two rows: the frame chips on their own, everything else under them. The
     chips are the thing you aim at constantly and they were being pushed about
     by the buttons as soon as a drawing had a few frames. */
  #animbar{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:5px;align-items:center;z-index:10;
    max-width:calc(100% - 24px);
    background:rgba(35,32,30,.86);backdrop-filter:blur(6px);
    border:1px solid #171513;border-radius:11px;padding:6px;
  }
  .arow{display:flex;gap:6px;align-items:center;justify-content:center;
        flex-wrap:wrap;max-width:100%;min-width:0}
  #frames{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:2px;min-width:0;max-width:100%}
  /* the pill is only as wide as its contents, so there is nothing to push apart */
  .aspacer{flex:0 0 auto;width:2px}
  .chk.locked{opacity:.35;cursor:default}
  .fchip{
    flex:0 0 auto;position:relative;width:46px;height:34px;border-radius:7px;
    border:1px solid #4a4441;background:var(--chrome-3);color:var(--muted);
    font:inherit;font-size:11px;cursor:pointer;white-space:nowrap;overflow:hidden;
    padding:0 4px;
  }
  .fchip:hover{background:#4a4441}
  .fchip.on{border-color:var(--accent);color:var(--ink);background:#31405c;font-weight:700}
  /* a named frame an expression sheet never drew still gets its chip - the frame
     list has to read straight against the sheet it describes */
  .fchip.empty{border-style:dashed;opacity:.7}
  .fchip .fdel{
    position:absolute;top:0;right:2px;font-size:12px;line-height:1;color:var(--muted);
    opacity:0;padding:1px 2px;
  }
  .fchip:hover .fdel{opacity:.8}
  .fchip .fdel:hover{color:#f0938c}
  /* the greyed ghost frame with the + on it: the only way to add one */
  .fadd{
    flex:0 0 auto;width:46px;height:34px;border-radius:7px;cursor:pointer;
    border:1px dashed #4a4441;background:transparent;color:var(--muted);
    font:inherit;font-size:15px;line-height:1;
  }
  .fadd:hover{border-color:var(--accent);color:var(--ink)}
  #animbar .btn .kbd{font-size:9px;opacity:.7;margin-left:5px}
  /* An eye or mouth object borrows the bar: its frames are named expressions,
     so the chips grow to fit the caption and the bar says whose they are. */
  #frameOwner{flex:0 0 auto;font-size:11px;color:var(--muted);padding:0 2px;max-width:150px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fchip.named{width:auto;min-width:46px;padding:0 9px}

  /* ---------- right palette ---------- */
  #palette{
    width:300px;flex:0 0 300px;background:var(--chrome-2);border-left:1px solid #171513;
    position:relative;z-index:5;
    padding:14px 12px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;
  }
  #palette h3{margin:0;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;font-weight:700}
  .psec{display:flex;flex-direction:column;gap:6px}
  .toolname{font-size:14px;font-weight:700;letter-spacing:.01em}
  .hidden{display:none !important}
  .prow{display:flex;gap:6px}
  .pbtn{
    flex:1;padding:7px 6px;border-radius:8px;border:1px solid #4a4441;
    background:var(--chrome-3);color:var(--ink);font:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .pbtn:hover:not(:disabled){background:#4a4441}
  .pbtn:disabled{opacity:.32;cursor:default}
  .pbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .slider{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
  .slider input{flex:1;accent-color:var(--accent);min-width:0}
  .slider .val{width:26px;text-align:right;font-family:ui-monospace,Consolas,monospace;color:var(--ink)}
  .divider{height:1px;background:#3b3633}
  .swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
  .sw{
    aspect-ratio:1;border-radius:6px;cursor:grab;border:1px solid rgba(0,0,0,.35);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  }
  .sw:active{cursor:grabbing}
  /* the "none" colour - a white chip with a red X. Dropped in a slot it turns
     that part of the shape off entirely. */
  .xnone{background:#fff !important;position:relative;overflow:hidden}
  .xnone::before,.xnone::after{
    content:'';position:absolute;left:8%;right:8%;top:calc(50% - 1px);height:2px;
    background:#e0403a;border-radius:1px;
  }
  .xnone::before{transform:rotate(45deg)}
  .xnone::after{transform:rotate(-45deg)}
  /* ---------- eyes & mouths library ---------- */
  #paintPanel,#libPanel{display:flex;flex-direction:column;gap:11px;min-height:0}
  #libTabs button{flex:1}
  #libSearch{
    background:#191716;border:1px solid #4a4441;border-radius:8px;color:var(--ink);
    font:inherit;padding:7px 9px;outline:none;
  }
  #libSearch:focus{border-color:var(--accent)}
  #libGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
  #libGrid .gthumb{border-radius:9px}
  #libGrid .gcard.on .gthumb{border-color:var(--accent);box-shadow:0 0 0 2px rgba(110,168,255,.28)}
  #libNote{color:var(--muted);font-size:11px;line-height:1.5}
  /* the tag cloud: the five most used tags of whatever tab you are on */
  #libTags{display:flex;flex-wrap:wrap;gap:4px}
  .tagbtn{
    border:1px solid #4a4441;background:#191716;color:var(--muted);
    border-radius:999px;padding:3px 9px;font:inherit;font-size:11px;cursor:pointer;
  }
  .tagbtn:hover{background:#4a4441;color:var(--ink)}
  .tagbtn.on{background:var(--accent);border-color:var(--accent);color:#12100f;font-weight:600}
  .gtags{color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* the fold: what this drawing already references, and whether it has moved on */
  #usedList{display:flex;flex-direction:column;gap:6px}
  .urow{
    display:flex;gap:8px;align-items:flex-start;cursor:pointer;
    border:1px solid transparent;border-radius:9px;padding:4px;
  }
  .urow:hover{border-color:#4a4441;background:#191716}
  .urow .gthumb{flex:0 0 52px;width:52px;height:52px;border-radius:8px}
  .uinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .utitle{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .uby{color:var(--muted);font-size:10.5px}
  .ustale{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:11px;font-weight:600;margin-top:2px}
  .ustale .pbtn{flex:0 0 auto;padding:3px 9px;font-size:11px}
  /* the pose picker for a single selected reference */
  #poses{display:flex;flex-wrap:wrap;gap:5px}
  #poses .pbtn{flex:0 1 auto;padding:6px 9px;font-size:12px}
  #poses .pbtn.on{background:var(--accent);border-color:var(--accent);color:#12100f;font-weight:600}
  #poseTitle{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* an imported reference owns no colours - the sheet it came from does */
  .slots.locked{opacity:.3;pointer-events:none}
  .colhead{display:flex;align-items:center;gap:6px}
  .colhead h3{flex:1;min-width:0}
  .colhead h3.right{text-align:right}
  .slotcols{display:flex;gap:6px}
  .slots{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
  .slot{
    display:flex;align-items:center;gap:9px;padding:6px;border-radius:9px;cursor:grab;
    min-width:0;overflow:hidden;
    background:#191716;border:1px dashed #4a4441;transition:border-color .12s,background .12s;
  }
  .slot.hot{border-color:var(--accent);background:#20262f}
  .slot .chip{width:28px;height:28px;border-radius:7px;border:1px solid rgba(0,0,0,.4);flex:0 0 28px}
  .slot .lbl{font-weight:700;font-size:12px}
  .slot .hex{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
  /* ---------- modal ---------- */
  #modalWrap{
    /* ABOVE .screen (z-index 300): the gallery's delete prompt and the new-drawing
       kind picker are both opened from an overlay that would otherwise cover them. */
    position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;
    background:rgba(12,10,9,.55);backdrop-filter:blur(2px);
  }
  #modalCard{
    width:340px;background:var(--chrome-2);border:1px solid #171513;border-radius:14px;
    padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.55);
  }
  #modalCard h2{margin:0 0 8px;font-size:15px;font-weight:700;letter-spacing:.01em}
  #modalCard p{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.5}
  #modalInput{
    display:block;width:100%;box-sizing:border-box;margin:0 0 14px;
    background:#191716;border:1px solid #4a4441;border-radius:8px;color:var(--ink);
    font:inherit;padding:9px 10px;outline:none;
  }
  #modalInput:focus{border-color:var(--accent)}
  .mrow{display:flex;gap:7px}
  .mrow .btn{flex:1;padding:8px 6px;font-weight:600}
  .mrow .btn.primary{border-color:var(--accent);background:#31405c;color:#e7efff}
  .mrow .btn.primary:not(:disabled):hover{background:#3b4d70}
  .mrow .btn.danger{border-color:#a8443e;background:#5c3230;color:#ffe9e7}
  .mrow .btn.danger:hover{background:#70403c}

  /* ---------- login / gallery screens ----------
     Both sit OVER the editor rather than hiding it: #stage's ResizeObserver
     would otherwise measure a zero-width canvas and the drawing would be
     resized away while the gallery was up. */
  .screen{position:fixed;inset:0;z-index:300;background:var(--chrome);
    display:flex;flex-direction:column;overflow:hidden}
  #loginScreen{align-items:center;justify-content:center}
  #loginCard{width:320px;background:var(--chrome-2);border:1px solid #171513;border-radius:14px;
    padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px}
  #loginCard h1{margin:0;font-size:17px;letter-spacing:.02em}
  #loginCard p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
  #loginCard input{
    background:#191716;border:1px solid #4a4441;border-radius:8px;color:var(--ink);
    font:inherit;padding:9px 10px;outline:none;
  }
  #loginCard input:focus{border-color:var(--accent)}
  #loginCard input:disabled{opacity:.5}
  #loginErr{color:#f0938c;font-size:11.5px;min-height:14px}
  /* The name being signed in to, shown once the flow has moved past it. */
  #loginWho{margin:0;color:var(--ink);font-size:12.5px}
  #loginWho b{color:var(--accent);font-weight:600}
  #loginBack{background:none;border:0;color:var(--muted);font:inherit;font-size:11.5px;
    text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}
  #loginBack:hover{color:var(--ink)}

  #galleryBar{
    display:flex;align-items:center;gap:10px;padding:12px 16px;
    background:var(--chrome-2);border-bottom:1px solid #171513;flex:0 0 auto;
  }
  #galleryBar h1{margin:0;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  #galleryWho{flex:1;min-width:0;color:var(--ink);font-size:12px}
  #galleryGrid{
    flex:1;overflow-y:auto;padding:16px;display:grid;gap:14px;align-content:start;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  }
  .gnote{color:var(--muted);font-size:12px;grid-column:1/-1}
  .gcard{position:relative;cursor:pointer}
  .gthumb{
    aspect-ratio:1;border-radius:12px;background:var(--paper);border:1px solid #171513;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:border-color .12s,transform .08s;position:relative;
  }
  .gcard:hover .gthumb{border-color:var(--accent)}
  .gcard:active .gthumb{transform:scale(.985)}
  .gthumb img{max-width:88%;max-height:88%;display:block;image-rendering:auto}
  .gthumb .empty{color:#b6ad9e;font-size:11px}
  /* the new-canvas tile - first cell of the grid, always */
  .gcard.new .gthumb{background:#2a2724;border:1px dashed #4a4441;color:var(--muted)}
  .gcard.new svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
  .gmeta{margin-top:6px;font-size:11px;color:var(--muted);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* a soft-deleted drawing, admin view only: struck through, never removed */
  .gcard.deleted .gthumb{opacity:.45}
  .gcard.deleted .gthumb::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(to bottom right,transparent calc(50% - 1.5px),
      #e0403a calc(50% - 1.5px),#e0403a calc(50% + 1.5px),transparent calc(50% + 1.5px));
  }
  .gcard.deleted .gmeta{color:#b0736e}
  .gdel{
    position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:8px;
    border:1px solid #171513;background:rgba(24,21,19,.86);color:#f0d6d3;cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s,background .12s;
  }
  .gdel svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .gcard:hover .gdel{opacity:1}
  .gdel:hover{background:#7a3a35}
  /* the save button flashes green once the row has landed */
  #btnSave.ok{background:#2f5c3a;border-color:#4e9c62}
  /* ...and carries an amber dot for as long as there is work not in the gallery */
  #btnSave.dirty::after{
    content:'';position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;
    background:#e0a33a;box-shadow:0 0 0 2px var(--chrome-3);
  }
  /* published is a state of the drawing, not a tool, so it gets its own tint */
  #btnPublish.on{background:#2f4a5c;border-color:#4e88c9}

  /* ---------- editing an imported object in place ----------
     A third floating pill, between the top bar and the animation bar, up only
     while editStack has something on it. */
  #editbar{
    position:absolute;top:12px;left:12px;z-index:11;
    display:flex;gap:8px;align-items:center;
    background:rgba(60,44,30,.9);backdrop-filter:blur(6px);
    border:1px solid #7a5a32;border-radius:11px;padding:6px 6px 6px 11px;
  }
  #editWho{font-size:12px;color:var(--ink);white-space:nowrap}
  #editWho b{color:#e8b877}

  /* ---------- the mode switch ---------- */
  #modeWrap{position:relative}
  #modeMenu{
    position:absolute;left:calc(100% + 10px);top:0;z-index:60;
    display:flex;flex-direction:column;gap:4px;padding:5px;
    background:var(--chrome-2);border:1px solid #4a4441;border-radius:9px;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
  }
  #modeMenu .mopt{
    display:flex;align-items:center;gap:9px;white-space:nowrap;cursor:pointer;
    background:var(--chrome-3);border:1px solid transparent;border-radius:8px;
    color:var(--ink);font:inherit;font-size:12px;padding:7px 14px 7px 8px;
  }
  #modeMenu .mopt:hover{background:#4a4441}
  #modeMenu .mopt.on{background:#514a45;border-color:var(--accent)}
  #modeMenu .mopt svg{
    width:22px;height:22px;flex:0 0 22px;stroke:currentColor;fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  }

  /* ---------- the Make Object dropdown ---------- */
  #mkObjWrap{position:relative}
  #mkObjMenu{
    position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;
    display:flex;flex-direction:column;gap:4px;padding:5px;
    background:var(--chrome-2);border:1px solid #4a4441;border-radius:9px;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
  }

  /* ---------- the metadata box ---------- */
  #metaSec .mrow2,#bonePanel .mrow2{display:flex;flex-direction:column;gap:3px}
  #metaSec label.cap,#bonePanel label.cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  #metaSec input[type=text],#bonePanel input[type=text]{
    background:#191716;border:1px solid #4a4441;border-radius:7px;color:var(--ink);
    font:inherit;font-size:12px;padding:6px 8px;outline:none;min-width:0;
  }
  #metaSec input[type=text]:focus,#bonePanel input[type=text]:focus{border-color:var(--accent)}
  #metaSec input[type=text]:disabled,#bonePanel input[type=text]:disabled{opacity:.5;cursor:default}
  #metaFacts{font-size:11px;color:var(--muted);line-height:1.6}
  /* ---------- bone mode ---------- */
  #bonePanel{display:flex;flex-direction:column;gap:11px;min-height:0}
  #bonePanel .seg button{flex:1;padding:6px 8px;letter-spacing:0}
  #bonePanel .chk{padding:0}
  #boneFacts,#boneEmpty,#skinNote,#boneHint{font-size:11px;color:var(--muted);line-height:1.6}
  #optBSkin .mrow2{display:flex;flex-direction:column;gap:3px}
  #optBSkin label.cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  #skinBone{
    background:#191716;border:1px solid #4a4441;border-radius:7px;color:var(--ink);
    font:inherit;font-size:12px;padding:6px 8px;outline:none;min-width:0;
  }
  #skinBone:focus{border-color:var(--accent)}
  #skinBone:disabled{opacity:.5;cursor:default}

/* =========================================================================

const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');
const stage= document.getElementById('stage');

/* ---------------------------------------------------------------- state */
/* A document is one of four kinds. A character and an item have a front and a
   back; an eye sheet and a mouth sheet have a single view. EVERY kind has one
   animation - an ordered list of frames, shared across the views, so front and
   back always hold the same number of them. For eyes and mouths that frame list
   is fixed and named (it is what a game swaps at runtime); for a character or
   an item the user adds frames as they like.

   `ref:true` is what puts a kind in the Library. A character is deliberately
   left out: nothing stops a character being referenced technically, it is just
   not offered, to keep the model easy to reason about. */
const DOC_KINDS = {
  character:{ label:'Image',  views:[['front','Front'],['back','Back']], frames:'free', ref:false },
  item:     { label:'Item',   views:[['front','Front'],['back','Back']], frames:'free', ref:true  },
  eyes:     { label:'Eyes',   views:[['main','Main']], frames:'fixed', ref:true,
              frameNames:['Normal','Blink','Suspicious','Surprised','Angry','Sad'] },
  mouths:   { label:'Mouths', views:[['main','Main']], frames:'fixed', ref:true,
              frameNames:['Closed','Open','Happy','Sad','Screaming'] }
};
let   docKind   = 'character';
let   viewNames = ['front','back'];
const canImport = () => docKind==='character' || docKind==='item';
function viewLabel(k){
  const row=DOC_KINDS[docKind].views.find(v=>v[0]===k);
  return row ? row[1] : k;
}
/* Deliberately still a const, and MUTATED in place when the kind changes - the
   tests in CLAUDE.md reach top-level consts straight out of javascript_exec.

   views[key] is an ARRAY OF FRAMES, each frame a shape list drawn in array
   order. views.front[2] is the front view of frame 2. cur() is the current
   frame of the current view and is what almost everything wants. Indexing is
   explicit rather than aliased because copyViewTo and restore() both REASSIGN
   views[n] wholesale, and an alias would silently detach at that point. */
const views   = { front: [[]], back: [[]] };
let   view    = 'front';
let   frame   = 0;
const frameCount = () => ((views[viewNames[0]]||[]).length)||1;
const frameKind  = () => (DOC_KINDS[docKind]||DOC_KINDS.character).frames;
const cur     = () => (views[view]||[])[frame] || [];
let   playing = false, playTimer = 0;
const FPS     = 12;
let   tool    = 'brush';
let   selected= null;   // the anchor shape - gestures and the sidebar read this one
let   extra   = [];     // the rest of a multi-selection (box drag / shift-click)
let   onionOn = true;          // ghost the OTHER view (front under back)
let   onionFrame = true;       // ghost the PREVIOUS frame
let   shading = 'hatch';      // 'gradient' | 'hatch'
let   uid     = 1;

// A slot holding NONE means "do not render this part at all".
const NONE = 'none';
const paint = c => c===NONE ? 'rgba(0,0,0,0)' : c;   // for gradient stops

// persistent colour choice - new shapes inherit this
let current = { outline:'#2E2A28', fill:'#F7C59F', shadow:'#B9713F' };

/* ============================================================== the skeleton
   The hierarchy is one per DOCUMENT, shared across every view and every frame -
   front and back of frame 2 are the same moment, so they share one pose exactly
   as they share one frame index. The POSE is per frame.

   rig      structure only, ordered so a parent always precedes its children
   bindPose the REST skeleton - what the weights were measured against
   bonePose one entry per frame; bonePose.length === frameCount() ALWAYS

   A bone's origin is not stored: it is a point in its PARENT's frame - `att`
   along the parent (a fraction, so it tracks the parent's length) and `off`
   perpendicular to it (world units). A shoulder wants att 0.85; an ear wants an
   off. Only a ROOT carries a world x,y, and it carries it in the pose rather
   than in the structure, so the whole figure can be moved per frame. */
let rig      = [];    // { id, name, side:''|'L'|'R', parent, att, off, pinned, ikt }
let bindPose = {};    // boneId -> { len, rot }  (+ x,y on a root).  rot is LOCAL.
let bonePose = [];    // bonePose[frame][boneId] -> the same shape
let bid      = 1;     // bone ids are a SEPARATE namespace from the shape uid
let selBone  = null;
let boneMode = false;
let boneTool = 'bdraw';          // 'bdraw' | 'bhand' | 'bskin'
/* The animation bar's "skeleton" box. It floats the rig over the ORDINARY editor
   as a set of draggable handles, so posing never needs bone mode - which is only
   for building a skeleton and skinning to it. */
let poseOverlay = false;
/* The Skinning tool's SPLIT view: the artwork slides left and the skeleton
   right, about the union's own centre, so the two stop overlapping. A bone
   drawn over a small limb is otherwise both illegible and in the way - which is
   what boneHit's knobsOnly was working round - and with the columns apart a
   bone takes a click along its whole length again. It is the only place in this
   file where what is drawn is not where it lives, so every hit test in bone
   mode has to undo it; nothing else may. */
let skinSplit = false;
/* Hide everything that is already bound, so the shapes you have MISSED are all
   that is left on screen. Skinning only. */
let skinHideBound = false;
// whether the rig is on screen and grabbable at all, wherever that came from
// ...and while the FIRST bone is being dragged out there is no rig yet, so
// without the gesture arm the preview line has nothing to draw itself on.
const rigVisible = () => (boneMode && (rig.length>0 || !!boneGesture)) ||
                         (poseOverlay && rig.length>0);
/* Bumped by every rig, bind or pose edit. It is the cache key for skinMats and
   for the per-shape weights - see the skinning section. */
let rigRev   = 0;
/* Bumped only by a STRUCTURE or BIND change, never by a pose one. The per-shape
   weights are measured against the bind pose, so keying them on rigRev would
   throw the cache away sixty times a second during a drag. */
let bindRev  = 0;
const canRig = () => docKind==='character' || docKind==='item';

/* poseAt is to bonePose what cur() is to views: the render loop is always in
   flight and must never read undefined out of it. */
const poseAt   = f => bonePose[f] || {};
const boneById = id => { for(const b of rig) if(b.id===id) return b; return null; };
const boneKids = id => rig.filter(b=>b.parent===id);
function clonePose(p){ const o={}; for(const k of Object.keys(p||{})) o[k]={...p[k]}; return o; }
/* Every frame carries a pose for every bone, for the same reason every view
   carries the same number of frames. Called from setViewNames and the frame ops. */
function fitBonePose(n){
  const want=Math.max(1, n|0);
  while(bonePose.length>want) bonePose.pop();
  while(bonePose.length<want) bonePose.push(clonePose(bonePose[bonePose.length-1]||bindPose));
  for(const p of bonePose) for(const b of rig) if(!p[b.id]) p[b.id]={...(bindPose[b.id]||{len:1,rot:0})};
  rigRev++;
}

/* An imported eye or mouth sheet is an ordinary shape carrying a "ref" field.
   It can be moved, scaled and rotated, but its points, its colours and the
   carving tools are all off: the sheet it came from is the master copy. The
   frames themselves live once per document in refLib rather than inside each
   shape, because snapshot() stringifies every view on every gesture and keeps
   60 of them in each of two stacks. */
const editable = s => !s.ref;
const refLib   = new Map();   // ref.key -> {kind,title,drawingId,rev,tags,author,frameNames,frameCount,views}
/* An item may import another item, so a reference can nest. drawShape dispatches
   straight back into drawRefShape for a sub-shape carrying a ref, which is all
   the recursion needs - except a stop. A cycle IS reachable (item A saved
   referencing B, then B edited to reference A), so this is a guard, not an
   assertion. */
const REF_MAX_DEPTH = 4;

/* The whole selection, anchor first. Every group operation goes through this. */
const selGroup = () => selected ? [selected].concat(extra) : [];
const inSel    = s => s===selected || extra.indexOf(s)>=0;
function clearSel(){ selected=null; extra=[]; }
function dropFromSel(s){
  if(selected===s){ selected=extra.shift()||null; }
  else { const i=extra.indexOf(s); if(i>=0) extra.splice(i,1); }
}

// transient interaction state
let drawing = null;     // {pts:[]}
let carve   = null;     // {shapes}
let gesture = null;     // {mode, ...}
let boneGesture = null; // {mode, ...} - bone mode's own, dispatched before the above
let marquee = null;     // {x0,y0,x1,y1} - the drag box
let mouse   = {x:-999,y:-999,down:false};

let smearR  = 22;       // live, driven by the sidebar sliders
let eraserR = 18;
let brushW  = 4;
const WARP_R   = 90;    // falloff radius (arc-length, local units) for point drag
/* Snapping shut is judged against how much you have DRAWN, not a fixed
   distance - a 34px gap was nothing on a small shape (everything closed) and
   a hard target on a big one. The clamps stop it collapsing on scribbles or
   running away on huge strokes. */
const closeFrac = 0.13;   // not exposed - the default was never worth changing
const CLOSE_MIN = 9;
const CLOSE_MAX = 70;
const MIN_RUN   = 16;   // below this the stroke is a dab, not a loop
function closeThresholdFor(len){
  return Math.max(CLOSE_MIN, Math.min(CLOSE_MAX, len*closeFrac));
}
function pathLength(pts){
  let L=0; for(let i=1;i<pts.length;i++) L+=dist(pts[i-1],pts[i]);
  return L;
}

/* ------------------------------------------------------------- geometry */
const TAU = Math.PI*2;
const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);

function toWorld(s,p){
  const x=p.x*s.sx, y=p.y*s.sy, c=Math.cos(s.rot), n=Math.sin(s.rot);
  return { x: s.x + x*c - y*n, y: s.y + x*n + y*c };
}
function toLocal(s,w){
  const dx=w.x-s.x, dy=w.y-s.y, c=Math.cos(-s.rot), n=Math.sin(-s.rot);
  return { x:(dx*c - dy*n)/s.sx, y:(dx*n + dy*c)/s.sy };
}
/* worldPts is defined down in the skinning section: it is the one hook the
   whole bone deformation hangs off, and it needs boneWorld and the rig. */

function bbox(pts){
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(const p of pts){ if(p.x<a)a=p.x; if(p.y<b)b=p.y; if(p.x>c)c=p.x; if(p.y>d)d=p.y; }
  return {x0:a,y0:b,x1:c,y1:d,w:c-a,h:d-b,cx:(a+c)/2,cy:(b+d)/2};
}

const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

/* Smooth closed path through points (quadratics via segment midpoints).
   This is the single biggest "makes a wobbly hand look competent" trick.
   The FILL always uses this, closed or not - that is what lets an open
   stroke still hold colour. */
function buildPath(g,pts){
  const n=pts.length;
  g.beginPath();
  if(n<3){ if(n) g.moveTo(pts[0].x,pts[0].y); for(let i=1;i<n;i++) g.lineTo(pts[i].x,pts[i].y); return; }
  const m0=mid(pts[n-1],pts[0]);
  g.moveTo(m0.x,m0.y);
  for(let i=0;i<n;i++){
    const p=pts[i], q=pts[(i+1)%n], m=mid(p,q);
    g.quadraticCurveTo(p.x,p.y,m.x,m.y);
  }
  g.closePath();
}

/* The region a shape fills. For an open stroke the chord is a dead-straight
   line between the two endpoints, so the bare edge really is flat and the
   outline stops exactly on it instead of overshooting into whiskers. */
function buildFill(g,pts,closed){
  if(closed) buildPath(g,pts);
  else { buildOpenPath(g,pts); g.closePath(); }
}

/* Same curve, but only across the part the user actually drew - the closing
   chord is left bare so shapes can be layered against a clean edge. */
function buildOpenPath(g,pts){
  const n=pts.length;
  g.beginPath();
  if(n<3){ if(n) g.moveTo(pts[0].x,pts[0].y); for(let i=1;i<n;i++) g.lineTo(pts[i].x,pts[i].y); return; }
  g.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<n-1;i++){
    const m=mid(pts[i],pts[i+1]);
    g.quadraticCurveTo(pts[i].x,pts[i].y,m.x,m.y);
  }
  g.lineTo(pts[n-1].x,pts[n-1].y);
}

/* Ramer-Douglas-Peucker */
function rdp(pts,eps){
  if(pts.length<3) return pts.slice();
  const keep=new Array(pts.length).fill(false);
  keep[0]=keep[pts.length-1]=true;
  (function rec(a,b){
    let idx=-1,max=0;
    const A=pts[a],B=pts[b], dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1;
    for(let i=a+1;i<b;i++){
      const d=Math.abs((pts[i].x-A.x)*dy-(pts[i].y-A.y)*dx)/len;
      if(d>max){max=d;idx=i;}
    }
    if(max>eps && idx>0){ keep[idx]=true; rec(a,idx); rec(idx,b); }
  })(0,pts.length-1);
  return pts.filter((_,i)=>keep[i]);
}

/* RDP measures every point against the chord from the FIRST point to the LAST.
   On a CLOSED loop those two are neighbours, so that baseline is degenerate and
   what survives depends on where the stroke happened to start: the same thin
   sliver kept anywhere from 77% to 94% of its area depending only on the seam,
   which is what made thin shapes collapse unpredictably rather than always.
   So split the loop at its two most distant points and simplify the halves as
   open runs - the baseline is then the shape's own long axis every time. The
   pair is the usual two-pass approximation of the diameter (furthest from any
   point, then furthest from that), so it does not depend on the seam either. */
function rdpLoop(pts,eps){
  const n=pts.length; if(n<6) return rdp(pts,eps);
  const farFrom=i=>{ let k=i,best=-1;
    for(let j=0;j<n;j++){ const d=dist(pts[i],pts[j]); if(d>best){best=d;k=j;} } return k; };
  let a=farFrom(farFrom(0)), b=farFrom(a);
  if(a>b){ const t=a; a=b; b=t; }
  // Degenerate split (the two ends adjacent) leaves nothing to simplify.
  if(b-a<2 || n-(b-a)<2) return rdp(pts,eps);
  const A=rdp(pts.slice(a,b+1),eps);                    // a -> b
  const B=rdp(pts.slice(b).concat(pts.slice(0,a+1)),eps); // b -> a, round the seam
  return A.slice(0,-1).concat(B.slice(0,-1));           // drop the shared ends
}

/* Even spacing => predictable dots to drag and clean deformation.
   Open shapes are resampled along the drawn run only, keeping both
   endpoints exact - no points are invented along the closing chord. */
function resample(pts,step,closed){
  const n=pts.length; if(n<3) return pts.slice();
  const out=[]; let carry=0;
  const last = closed ? n : n-1;
  for(let i=0;i<last;i++){
    const a=pts[i], b=pts[(i+1)%n];
    const seg=dist(a,b); if(seg<1e-6) continue;
    let t=carry;
    while(t<seg){ out.push({x:a.x+(b.x-a.x)*t/seg, y:a.y+(b.y-a.y)*t/seg}); t+=step; }
    carry=t-seg;
  }
  if(!closed) out.push({x:pts[n-1].x, y:pts[n-1].y});
  return out.length>=3?out:pts.slice();
}

function arcLengths(pts,closed){
  const n=pts.length, s=new Array(n); let acc=0;
  for(let i=0;i<n;i++){
    s[i]=acc;
    if(closed || i<n-1) acc+=dist(pts[i],pts[(i+1)%n]);
  }
  return {s,total:acc||1};
}

/* -------------------------------------------------------------- colours */
function hex2rgb(h){
  h=h.replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
const clamp255=v=>Math.max(0,Math.min(255,Math.round(v)));
function shade(hex,amt){ // amt>0 lighten, amt<0 darken
  const [r,g,b]=hex2rgb(hex);
  const f=v=> amt>0 ? v+(255-v)*amt : v*(1+amt);
  return 'rgb('+clamp255(f(r))+','+clamp255(f(g))+','+clamp255(f(b))+')';
}

/* ------------------------------------------------------------ rendering */
let dpr=1;
function resize(){
  dpr = window.devicePixelRatio||1;
  const r = stage.getBoundingClientRect();
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
  cv.style.width = r.width+'px';      cv.style.height = r.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
new ResizeObserver(resize).observe(stage);   // palette panel opening changes the stage width

/* The dot grid is ~1,300 dots and it was a beginPath/arc/fill EACH, every frame.
   The lattice only changes when the stage is resized, so the dots are built once
   into a single Path2D and drawn with one fill() - 0.92ms -> 0.56ms on an
   ordinary stage, and pixel-identical to within 1/255 on the dots' own edges.

   A repeating createPattern() tile was tried first and is the obvious answer, but
   it measured ~2.5ms: one big textured fill is worse here than a heap of tiny
   arcs, on the software backend and the accelerated one alike. Do not "optimise"
   this back into a pattern without measuring it. */
const DOT_STEP=24;
let dotPath=null, dotKey='';
function dotGrid(w,h){
  const key=w+'x'+h;
  if(dotPath && dotKey===key) return dotPath;
  const p=new Path2D();
  for(let y=DOT_STEP/2;y<h;y+=DOT_STEP)
    for(let x=DOT_STEP/2;x<w;x+=DOT_STEP){
      p.moveTo(x+1.15,y);                          // or each arc chains onto the last
      p.arc(x,y,1.15,0,TAU);
    }
  dotPath=p; dotKey=key;
  return p;
}
function drawBackground(w,h){
  ctx.fillStyle='#F7F4EE'; ctx.fillRect(0,0,w,h);   // off white paper
  ctx.fillStyle='#CFC7B8';                          // darker shade, not black
  ctx.fill(dotGrid(w,h));
}

/* The light axis, given as two corners of the shape's box in 0..1 fractions.
   Lit corner -> dark corner. Change these two lines to re-aim the light. */
let LIGHT_FROM = {x:1, y:0};      // top right
let LIGHT_TO   = {x:0, y:1};      // bottom left
function lightAxis(b){
  const A={x:b.x0+LIGHT_FROM.x*b.w, y:b.y0+LIGHT_FROM.y*b.h};
  const B={x:b.x0+LIGHT_TO.x*b.w,   y:b.y0+LIGHT_TO.y*b.h};
  const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy)||1;
  return {A:A, B:B, d:{x:dx/L, y:dy/L}, L:L};
}

/* Two colours only. TERMINATOR is where the light stops, SOFTNESS how abruptly
   - keep it small and the falloff stays crisp instead of smearing a wash of
   midtones through the middle of the shape. */
const TERMINATOR = 0.62;
const SOFTNESS   = 0.04;

/* The terminator is an ARC, not a straight cut - a curved edge is what reads as
   a rounded form. The light is a point sitting off the lit side, back along the
   axis; LIGHT_DIST is how far off, and it is the only curvature control:
   small = tightly curved and wraps round the side, large = flattens to a line.
   Wherever the light sits, the arc is made to pass through the same point the
   straight version would have, so moving it changes the curve and not the tone. */
const LIGHT_DIST = 0.7;
function terminatorArc(b){
  const ax   = lightAxis(b);
  const diag = Math.hypot(b.w,b.h)||1;
  const L    = {x:b.cx-ax.d.x*diag*LIGHT_DIST, y:b.cy-ax.d.y*diag*LIGHT_DIST};
  const Q    = {x:ax.A.x+ax.d.x*ax.L*TERMINATOR, y:ax.A.y+ax.d.y*ax.L*TERMINATOR};
  return {L:L, R:dist(L,Q)};
}

function fillStyleFor(b,s){
  const t=terminatorArc(b);
  const g=ctx.createRadialGradient(t.L.x,t.L.y,0, t.L.x,t.L.y, t.R/TERMINATOR);
  g.addColorStop(0, paint(s.colors.fill));
  g.addColorStop(Math.max(0,TERMINATOR-SOFTNESS), paint(s.colors.fill));
  g.addColorStop(Math.min(1,TERMINATOR+SOFTNESS), paint(s.colors.shadow));
  g.addColorStop(1, paint(s.colors.shadow));
  return g;
}

/* Engraver's shading: flat fill, then ONE band of 45-degree hatch lines at a
   single weight - the same one tone the gradient mode gives, just drawn as
   line texture. The band is clipped to the far side of the same terminator arc
   the gradient uses, so both modes break on exactly the same curve. */
const HATCH_GAP    = 5.5;     // fixed, so the texture reads the same on every shape
const HATCH_WEIGHT = 0.5;     // share of the gap each line fills
function hatchShade(b,s){
  const diag = Math.hypot(b.w,b.h) || 1;
  if(diag<36) return;                               // too small to read as texture
  const hd  = {x:Math.SQRT1_2, y:Math.SQRT1_2};     // hatch lines, fixed 45 degrees
  const hs  = {x:Math.SQRT1_2, y:-Math.SQRT1_2};    // and the direction we step them

  // only step across the span the box actually occupies
  let k0=1e9, k1=-1e9;
  [[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]].forEach(function(p){
    const k=(p[0]-b.cx)*hs.x+(p[1]-b.cy)*hs.y;
    if(k<k0)k0=k; if(k>k1)k1=k;
  });

  const t=terminatorArc(b);
  ctx.save();
  ctx.beginPath();                                  // everything beyond the arc
  ctx.rect(b.x0-diag, b.y0-diag, b.w+diag*2, b.h+diag*2);
  ctx.moveTo(t.L.x+t.R, t.L.y);
  ctx.arc(t.L.x, t.L.y, t.R, 0, TAU);
  ctx.clip('evenodd');

  ctx.strokeStyle=s.colors.shadow; ctx.lineCap='butt';
  ctx.lineWidth=HATCH_GAP*HATCH_WEIGHT;
  for(let k=k0-HATCH_GAP; k<=k1+HATCH_GAP; k+=HATCH_GAP){
    const cx=b.cx+hs.x*k, cy=b.cy+hs.y*k;
    ctx.beginPath();
    ctx.moveTo(cx-hd.x*diag, cy-hd.y*diag);
    ctx.lineTo(cx+hd.x*diag, cy+hd.y*diag);
    ctx.stroke();
  }
  ctx.restore();
}

/* Which frame of a reference to draw. Pinned by default - an eye sheet is a set
   of expressions a game swaps between, not something that plays on its own - but
   an instance can be set to FOLLOW, and then it walks in step with whatever
   frame the parent is showing, wrapping when it is the shorter of the two. */
function refFrames(lib){ return (lib.views||{})[Object.keys(lib.views||{})[0]] || []; }
function refFrameIndex(rf,lib,pframe){
  const frames=refFrames(lib), n=frames.length||1;
  if(rf.follow) return ((pframe||0)%n+n)%n;
  return Math.max(0,Math.min(n-1, rf.frame||0));
}

/* An imported drawing. Draw its frame through the reference's own transform,
   which makes it a STAMP rather than a re-lit shape: the sub-shapes' light axis
   and hatch gap are evaluated in the reference's local frame, so rotating one
   rotates its light with it and scaling one scales its hatch. For a rigid
   imported asset that is the more predictable of the two - it looks exactly as
   it was authored.

   An item may import another item, so a sub-shape can itself be a reference and
   this recurses through drawShape. depth is the only thing stopping it: a cycle
   is reachable once two items reference each other. */
function drawRefShape(s,opts){
  const o = opts||{};
  const depth = o.depth||0;
  if(depth>=REF_MAX_DEPTH) return;
  const lib = refLib.get(s.ref.key);
  if(!lib) return;
  const fi = refFrameIndex(s.ref, lib, o.pframe);
  const fr = refFrames(lib)[fi];
  if(!fr || !fr.length) return;
  ctx.save();
  // A reference binds to one bone and moves rigidly - see posedPlacement.
  const pl = posedPlacement(s, o.pframe);
  ctx.translate(pl.x,pl.y); ctx.rotate(pl.rot); ctx.scale(pl.sx,pl.sy);
  // opts is forwarded near-verbatim: drawShape ASSIGNS globalAlpha rather than
  // multiplying it, so an alpha set out here would be thrown away and the
  // onion skin would draw an imported drawing at full strength. Only depth and
  // the parent frame change on the way down - a nested reference follows the
  // frame of the reference holding it, not the document's.
  const sub = {ghost:o.ghost, depth:depth+1, pframe:fi};
  for(const x of fr) drawShape(x,sub);
  ctx.restore();
}

function drawShape(s,opts){
  if(s.ref){ drawRefShape(s,opts); return; }
  const ghost = opts && opts.ghost;
  /* The frame is passed through so the onion of frame n-1 is deformed by frame
     n-1's pose, and the other view by the current one. Without it both would
     be posed by whichever frame happens to be showing. */
  const wp = worldPts(s, opts && opts.pframe);
  if(wp.length<3) return;
  const b = bbox(wp);
  const closed = s.closed!==false;
  const hatching = shading==='hatch' && !ghost;

  ctx.save();
  if(ghost) ctx.globalAlpha=0.13;

  buildFill(ctx,wp,closed);                     // the fill closes whether the outline does or not

  // One layer of shading and no more. There used to be a soft contact shadow
  // cast outside each shape, which landed on whatever sat underneath and gave
  // those shapes a second, darker band on top of their own shading.
  // NONE in a slot switches that part off. Fill and shadow are independent:
  // no fill leaves the silhouette see-through, no shadow leaves it flat.
  const noFill=s.colors.fill===NONE, noShadow=s.colors.shadow===NONE;
  if(hatching || noShadow){
    if(!noFill){ ctx.fillStyle=s.colors.fill; ctx.fill(); }
  }else{
    ctx.fillStyle=fillStyleFor(b,s); ctx.fill();
  }

  if(hatching && !noShadow){                    // hatch inside the silhouette
    ctx.save(); ctx.clip(); hatchShade(b,s); ctx.restore();
  }

  // hatchShade tramples the current path, so rebuild before stroking
  if(s.colors.outline!==NONE){
    if(closed) buildPath(ctx,wp); else buildOpenPath(ctx,wp);
    ctx.lineJoin='round';
    ctx.lineCap = closed ? 'round' : 'butt';    // butt: the outline stops flush with the chord
    ctx.strokeStyle=s.colors.outline; ctx.lineWidth=s.lw;
    ctx.stroke();
  }
  ctx.restore();
}

/* selection chrome for the Hand of Judgement */
function rawCorners(s){
  const b=bbox(s.pts);
  return [{x:b.x0,y:b.y0},{x:b.x1,y:b.y0},{x:b.x1,y:b.y1},{x:b.x0,y:b.y1}];
}
const GRP_PAD = 12;        // visual breathing room round the group rig
function localCorners(s){
  const b=bbox(s.pts);
  const px=10/Math.abs(s.sx||1), py=10/Math.abs(s.sy||1);   // near-constant visual padding
  return [
    {x:b.x0-px,y:b.y0-py},   // 0 TL
    {x:b.x1+px,y:b.y0-py},   // 1 TR = rotate
    {x:b.x1+px,y:b.y1+py},   // 2 BR
    {x:b.x0-px,y:b.y1+py}    // 3 BL
  ];
}
function drawRotateIcon(x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.beginPath(); ctx.arc(0,0,9,0,TAU);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.strokeStyle='#6ea8ff'; ctx.lineWidth=1.6; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,4.6,-0.4,Math.PI*1.35);
  ctx.strokeStyle='#3f6fd8'; ctx.lineWidth=1.7; ctx.stroke();
  const a=-0.4, ax=Math.cos(a)*4.6, ay=Math.sin(a)*4.6;   // arrow head
  ctx.beginPath(); ctx.moveTo(ax+2.8,ay-1.0); ctx.lineTo(ax-1.2,ay-2.6); ctx.lineTo(ax-0.6,ay+2.2);
  ctx.closePath(); ctx.fillStyle='#3f6fd8'; ctx.fill();
  ctx.restore();
}
/* The group's screen-space box - axis aligned in world space. This is the box
   the flip mirrors about; the rig uses the tilted frame below instead. */
// An arrow, not a bare `worldPts`: it takes a frame as its second argument now
// and flatMap would hand it the array index.
function groupBox(grp){ return bbox(grp.flatMap(s=>worldPts(s))); }

/* The group RIG has an angle of its own, so the box turns with the handle you
   are dragging - an upright box while the shapes swing round inside it reads as
   the rig ignoring you, even though the shapes are doing the right thing.
   Only the ANGLE is kept; the extents are re-measured from the shapes every
   frame in that frame's own axes, so the box still wraps them tightly after a
   move, a smear or a delete without anything having to invalidate it. The angle
   resets whenever the membership of the selection changes. */
let gRot=0, gRotKey='';
function groupFrame(grp){
  const key=grp.map(g=>g.id).join(',');
  if(key!==gRotKey){ gRotKey=key; gRot=0; }
  const c=Math.cos(-gRot), n=Math.sin(-gRot);
  let a=1e9,b=1e9,d=-1e9,e=-1e9;
  for(const g of grp) for(const p of worldPts(g)){
    const x=p.x*c-p.y*n, y=p.x*n+p.y*c;
    if(x<a)a=x; if(y<b)b=y; if(x>d)d=x; if(y>e)e=y;
  }
  return {ang:gRot, x0:a,y0:b,x1:d,y1:e, w:d-a,h:e-b, cx:(a+d)/2, cy:(b+e)/2};
}
function frameToWorld(f,p){
  const c=Math.cos(f.ang), n=Math.sin(f.ang);
  return {x:p.x*c-p.y*n, y:p.x*n+p.y*c};
}
function groupCorners(grp,pad){
  const f=groupFrame(grp), p=pad||0;
  return [{x:f.x0-p,y:f.y0-p},{x:f.x1+p,y:f.y0-p},{x:f.x1+p,y:f.y1+p},{x:f.x0-p,y:f.y1+p}]
         .map(q=>frameToWorld(f,q));
}
/* The group rig: the same handles as a single shape (TR rotates, the rest
   resize), minus the outline dots - warping is still single-shape only. */
function drawGroupRig(grp){
  const c=groupCorners(grp,GRP_PAD);
  ctx.save();
  ctx.setLineDash([7,4]); ctx.lineWidth=1.6; ctx.strokeStyle='#6ea8ff';
  ctx.beginPath(); ctx.moveTo(c[0].x,c[0].y);
  for(let i=1;i<4;i++) ctx.lineTo(c[i].x,c[i].y);
  ctx.closePath(); ctx.stroke();
  ctx.setLineDash([]);
  c.forEach(function(p,i){
    if(i===1){ drawRotateIcon(p.x,p.y); return; }
    ctx.beginPath(); ctx.arc(p.x,p.y,6.5,0,TAU);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=1.8; ctx.strokeStyle='#6ea8ff'; ctx.stroke();
  });
  ctx.restore();
}

/* Depth arrows: two buttons off the RIGHT of the selection's screen box - up
   raises the selection one level, down lowers it. They sit on the axis-aligned
   world bbox rather than the tilted rig, so "up" is always up on screen even
   when the group rig has been turned right over. */
const DEPTH_R = 11;
const HANDLE_R = 11;       // the rotate icon, the largest of the rig handles
function depthBtns(grp){
  const b=groupBox(grp);
  /* The rig is drawn in the shapes' OWN axes, so on a rotated shape its corners
     stand well clear of the axis-aligned bbox - clearing the bbox alone left the
     arrows sitting under a handle. Measure against the rig's corners as well. */
  const rig = grp.length>1 ? groupCorners(grp,GRP_PAD)
                           : localCorners(grp[0]).map(p=>toWorld(grp[0],p));
  let right = b.x1 + (grp.length>1?GRP_PAD:10);
  for(const p of rig) right = Math.max(right, p.x + HANDLE_R);
  const x = right + DEPTH_R + 7;
  return [{x:x, y:b.cy-DEPTH_R-4, dir: 1},
          {x:x, y:b.cy+DEPTH_R+4, dir:-1}];
}
function drawDepthBtns(grp){
  ctx.save();
  for(const b of depthBtns(grp)){
    const live = canReorder(grp, b.dir);      // greyed out when it is already at the end
    ctx.beginPath(); ctx.arc(b.x,b.y,DEPTH_R,0,TAU);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=1.8; ctx.strokeStyle = live ? '#6ea8ff' : 'rgba(110,168,255,.35)';
    ctx.stroke();
    const d = b.dir>0 ? -1 : 1;               // chevron points the way it moves
    ctx.beginPath();
    ctx.moveTo(b.x-4.6, b.y-d*1.4); ctx.lineTo(b.x, b.y+d*3.4); ctx.lineTo(b.x+4.6, b.y-d*1.4);
    ctx.lineWidth=2.1; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle = live ? '#3f6fd8' : 'rgba(63,111,216,.3)';
    ctx.stroke();
  }
  ctx.restore();
}

/* opts.handles gives the corner rig, opts.dots the editable outline points.
   They are separate because an imported reference gets the handles - it can be
   moved, scaled and rotated - and never the dots, since its points belong to the
   sheet. Outside the Hand tool we still outline the selection, because Smear and
   Eraser target it. */
function drawSelection(s,opts){
  const o=opts||{};
  /* A bone-deformed shape gets a plain box round where it ACTUALLY is and no
     handles at all. localCorners is local space put through toWorld, so the
     rig would be drawn at the undeformed position - and resize, rotate and warp
     are edit-at-rest territory anyway, so there is nothing for them to grab. */
  const bent = deformed(s);
  const full = !bent && !!(o.handles||o.dots);
  if(bent){
    const b=bbox(worldPts(s));
    ctx.save();
    ctx.setLineDash([6,5]); ctx.lineWidth=1.4;
    ctx.strokeStyle='rgba(110,168,255,.55)';
    ctx.strokeRect(b.x0-4,b.y0-4,b.w+8,b.h+8);
    ctx.setLineDash([]); ctx.restore();
    return;
  }
  const c = localCorners(s).map(p=>toWorld(s,p));

  ctx.save();
  ctx.setLineDash([6,5]); ctx.lineWidth=1.4;
  ctx.strokeStyle = full ? '#6ea8ff' : 'rgba(110,168,255,.55)';
  ctx.beginPath(); ctx.moveTo(c[0].x,c[0].y);
  for(let i=1;i<4;i++) ctx.lineTo(c[i].x,c[i].y);
  ctx.closePath(); ctx.stroke();
  ctx.setLineDash([]);

  if(!full){ ctx.restore(); return; }

  if(o.dots) for(const p of worldPts(s)){ // editable outline points
    ctx.beginPath(); ctx.arc(p.x,p.y,3.1,0,TAU);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=1.3; ctx.strokeStyle='#5b86d6'; ctx.stroke();
  }

  if(o.handles) c.forEach(function(p,i){   // corner handles, TR is the rotator
    if(i===1){ drawRotateIcon(p.x,p.y); return; }
    ctx.beginPath(); ctx.arc(p.x,p.y,6.5,0,TAU);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=1.8; ctx.strokeStyle='#6ea8ff'; ctx.stroke();
  });
  ctx.restore();
}

/* ------------------------------------------------ the Skinning split view
   How far the artwork and the skeleton are pushed apart: half the content's own
   width plus half the gap, each way, measured over the union of the artwork and
   the rig - so the two columns are clear of one another whatever the drawing is.
   Zero everywhere except the Skinning tool with the box ticked, and every hit
   test in bone mode subtracts it back off.
   Memoised, because it walks every shape's worldPts and the render loop is
   always in flight. */
const SPLIT_GAP = 70;
let splitCache = {key:'', dx:0};
function splitDX(){
  if(!(boneMode && boneTool==='bskin' && skinSplit && rig.length)) return 0;
  const list=cur();
  const key=view+'|'+frame+'|'+rigRev+'|'+bindRev+'|'+list.length;
  if(splitCache.key===key) return splitCache.dx;
  let x0=1e9,x1=-1e9;
  for(const s of list){ const b=bbox(worldPts(s)); x0=Math.min(x0,b.x0); x1=Math.max(x1,b.x1); }
  const W=boneWorld(poseAt(frame));
  for(const b of rig){
    const w=W.get(b.id); if(!w) continue;
    const t=boneTip(w);
    x0=Math.min(x0,w.x,t.x); x1=Math.max(x1,w.x,t.x);
  }
  const dx = x1>x0 ? (x1-x0)/2 + SPLIT_GAP/2 : 0;
  splitCache={key:key, dx:dx};
  return dx;
}
/* A shape the "Hide attached shapes" toggle is currently keeping off screen.
   It is hidden from the HIT TEST as well, or you would keep selecting things
   you cannot see. */
const skinHidden = s => skinHideBound && boneMode && boneTool==='bskin' && !!skinOf(s);

function drawFrame(){
  // self-heal the backing size: the palette panel opening changes the stage width
  if(stage.clientWidth!==Math.round(cv.width/dpr) || stage.clientHeight!==Math.round(cv.height/dpr)) resize();
  const w=cv.width/dpr, h=cv.height/dpr;
  drawBackground(w,h);

  syncChrome();

  /* Everything from here to the matching restore is the ARTWORK, and in the
     Skinning split view it is drawn a column to the left of where it lives.
     The rig gets the same offset the other way, in drawBones. */
  const SD=splitDX();
  if(SD){ ctx.save(); ctx.translate(-SD,0); }
  drawEditBackdrop();

  /* Two onions, and they are independent. The VIEW onion is how you trace a
     back view against the front - the first view, unless you are standing on
     it, then the second. The FRAME onion is how you draw the next step of an
     animation against the last one. Frame 0 has nothing behind it. */
  if(onionOn && viewNames.length>1){
    const ok = view===viewNames[0] ? viewNames[1] : viewNames[0];
    for(const s of (views[ok]||[])[frame]||[]) drawShape(s,{ghost:true});
  }
  if(onionFrame && frame>0)
    for(const s of (views[view]||[])[frame-1]||[]) drawShape(s,{ghost:true});
  /* While you are rigging, the artwork is context rather than the subject - it
     goes grey exactly as an onion does. The Skinning tool is the exception: you
     are picking shapes with it, so they have to be legible. */
  const rigging = boneMode && boneTool!=='bskin';
  for(const s of cur()){
    if(skinHidden(s)) continue;
    drawShape(s, rigging ? {pframe:frame, ghost:true} : {pframe:frame});
  }
  if(SD) ctx.restore();

  if(drawing && drawing.pts.length>1){       // live brush stroke
    ctx.save();
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle = current.outline===NONE ? 'rgba(60,50,40,.5)' : current.outline;
    ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(drawing.pts[0].x,drawing.pts[0].y);
    for(let i=1;i<drawing.pts.length;i++) ctx.lineTo(drawing.pts[i].x,drawing.pts[i].y);
    ctx.stroke();
    const first=drawing.pts[0], last=drawing.pts[drawing.pts.length-1];
    const snapAt = closeThresholdFor(drawing.len);
    const willClose = drawing.len>MIN_RUN && dist(first,last)<snapAt;

    // chord preview: it is where the fill will cut across, and it only gets an
    // outline if you come back within snapping range of where you started
    ctx.setLineDash([5,5]); ctx.globalAlpha=willClose?.7:.28; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(first.x,first.y);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.globalAlpha=1;
    // Show the live snap radius. Since it tracks how far you have drawn, the
    // ring grows with the stroke and you can see exactly what you have to hit.
    if(drawing.len>MIN_RUN){
      ctx.beginPath(); ctx.arc(first.x,first.y,snapAt,0,TAU);
      ctx.setLineDash([3,4]); ctx.lineWidth=1.2;
      ctx.strokeStyle = willClose ? 'rgba(63,157,90,.8)' : 'rgba(60,50,40,.3)';
      ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.beginPath(); ctx.arc(first.x,first.y,willClose?7:4,0,TAU);
    ctx.lineWidth=willClose?2.5:1.5;
    ctx.strokeStyle=willClose?'#3f9d5a':'rgba(60,50,40,.45)';
    ctx.stroke();
    ctx.restore();
  }

  // One shape gets the editable rig; a group gets a faint box per shape plus
  // one rig round the lot, since resize and rotate now take the whole group.
  // Warping is still the anchor shape's alone, so the dots stay single-shape.
  /* tool keeps its old value in bone mode, so without the !boneMode guard
     entering it with a shape selected leaves the shape rig, the group rig and
     the depth chevrons drawn over the top of the skeleton. */
  const grp=(playing||boneMode) ? [] : selGroup();
  const solo = tool==='hand' && grp.length===1;
  for(const g of grp) drawSelection(g, solo ? {handles:true, dots:editable(g)} : null);
  if(grp.length>1 && tool==='hand') drawGroupRig(grp);
  if(grp.length && tool==='hand') drawDepthBtns(grp);

  if(marquee){
    const mx=Math.min(marquee.x0,marquee.x1), my=Math.min(marquee.y0,marquee.y1);
    const mw=Math.abs(marquee.x1-marquee.x0), mh=Math.abs(marquee.y1-marquee.y0);
    ctx.save();
    ctx.fillStyle='rgba(110,168,255,.12)'; ctx.fillRect(mx,my,mw,mh);
    ctx.strokeStyle='#6ea8ff'; ctx.lineWidth=1.2; ctx.setLineDash([5,4]);
    ctx.strokeRect(mx+.5,my+.5,mw,mh);
    ctx.restore();
  }

  // ...and the same for the carve disc, which also reads `tool`.
  if(!boneMode && (tool==='eraser'||tool==='smear') && mouse.x>-500){
    const er = tool==='eraser';
    ctx.save();
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,er?eraserR:smearR,0,TAU);
    if(er){ ctx.fillStyle='rgba(220,80,60,.10)'; ctx.fill(); }
    ctx.strokeStyle = er ? 'rgba(190,60,45,.7)' : 'rgba(60,50,40,.55)';
    ctx.lineWidth=1.4; ctx.setLineDash([4,4]); ctx.stroke();
    ctx.restore();
  }

  // Bones last: they are drawn on top of the artwork, and while it is playing
  // the canvas is a viewer, so the rig goes away with the rest of the chrome.
  if(!playing){ drawSkinOverlay(); drawBones(); drawIKTargets(); }
}

/* ONE driver, and one only.

   The body above used to be render() itself and used to end by re-scheduling
   ITSELF - and render() is also called directly from twenty-odd places (the
   frame chips, Q/E, Tab, undo, save, the Library...). Every one of those calls
   therefore left another self-perpetuating loop running for the life of the
   page: they were only ever added, never removed. Ten frame-steps meant eleven
   full redraws of the whole document per animation frame, forever, idle or not,
   and a normal session reached several hundred. It read as a memory problem
   because each loop re-allocates a worldPts array and a fresh CanvasGradient
   per shape per frame, so the GC churn multiplied with it.

   So: drawFrame() is the body, render() only draws, and startRenderLoop() -
   called once, at boot - is the only thing that ever schedules. Every existing
   render() call site keeps working and now costs exactly one extra frame. */
/* =========================================================== bone geometry
   Forward kinematics. rig is ordered parents-before-children, so one pass down
   the list resolves the whole tree: a bone's origin is a point along its parent
   (att, 1 being the parent's tip) and its world angle is the parent's plus its
   own local one. Only a root carries a world x,y, and it carries it in the POSE
   rather than in the structure, so the figure can be moved per frame. */
function boneWorld(pose){
  const M=new Map();
  for(const b of rig){
    const p=pose[b.id] || bindPose[b.id] || {len:0,rot:0};
    let x,y,rot;
    const pw = b.parent!=null ? M.get(b.parent) : null;
    if(!pw){ x=p.x||0; y=p.y||0; rot=p.rot||0; }   // root, or an orphan treated as one
    else{
      // along the parent, then perpendicular to it, both in the parent's frame
      const t=(b.att==null?1:b.att)*pw.len, o=b.off||0;
      const c=Math.cos(pw.rot), n=Math.sin(pw.rot);
      x=pw.x + c*t - n*o;  y=pw.y + n*t + c*o;
      rot=pw.rot+(p.rot||0);
    }
    M.set(b.id,{x:x,y:y,rot:rot,len:p.len||0});
  }
  return M;
}
const boneTip = w => ({x:w.x+Math.cos(w.rot)*w.len, y:w.y+Math.sin(w.rot)*w.len});
/* Where a child hanging off `att` of this bone starts. */
const boneAt  = (w,t) => ({x:w.x+Math.cos(w.rot)*w.len*t, y:w.y+Math.sin(w.rot)*w.len*t});

/* Pick radius for a bone's end circles, capped against the bone the same way
   pickR caps a shape's handles - a short bone would otherwise be all handle. */
const BONE_R = 5.5;
const boneR = w => Math.max(3.5, Math.min(BONE_R+3, w.len*0.25));

/* knobsOnly is what the Skinning tool passes. A bone drawn over a small limb
   covers the whole shape, so with the body live there was no way to click the
   artwork underneath it at all - and picking shapes is the entire job of that
   tool. Its end circles still select a bone, and clicking a bound shape finds
   its bone anyway. */
function boneHit(world,p,knobsOnly){
  /* Tips first and in reverse rig order, so a child's origin (which sits on its
     parent) wins over the parent's body underneath it. */
  for(let i=rig.length-1;i>=0;i--){
    const w=world.get(rig[i].id), r=boneR(w)+3;
    if(dist(boneTip(w),p)<r) return {bone:rig[i], part:'tip', t:1};
    if(dist(w,p)<r)          return {bone:rig[i], part:'root', t:0};
  }
  if(knobsOnly) return null;
  for(let i=rig.length-1;i>=0;i--){
    const w=world.get(rig[i].id), t=boneTip(w);
    if(w.len>0.5 && segDist(p,w,t) < 7){
      // where along the bone, for a mid-attachment
      const dx=t.x-w.x, dy=t.y-w.y, L2=dx*dx+dy*dy;
      const u=Math.max(0,Math.min(1,((p.x-w.x)*dx+(p.y-w.y)*dy)/L2));
      return {bone:rig[i], part:'body', t:u};
    }
  }
  return null;
}

/* ------------------------------------------------------------ drawing them
   Bones go on top of the artwork. Two circles and a line each; the selected one
   is amber and its TIP carries an extra ring, because that is where the next
   bone in the chain will start. Everything is drawn with a dark casing under it
   so it stays legible over any colour. */
function drawBones(){
  if(!rigVisible()) return;
  const W=boneWorld(poseAt(frame));
  ctx.save();
  // the split view's other half: the artwork went left, the rig goes right
  const SD=splitDX(); if(SD) ctx.translate(SD,0);
  ctx.lineCap='round'; ctx.lineJoin='round';
  /* In the Skinning tool the artwork is the subject, so the rig steps back -
     unless it has been split off to the side, where it is a column of its own
     and nothing is underneath it to see through it. */
  if(boneMode && boneTool==='bskin' && !SD) ctx.globalAlpha=0.6;

  const body=(w,on)=>{
    const t=boneTip(w);
    if(w.len<0.5) return;
    ctx.beginPath(); ctx.moveTo(w.x,w.y); ctx.lineTo(t.x,t.y);
    ctx.lineWidth=(on?5.5:4.2); ctx.strokeStyle='rgba(20,17,15,.72)'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w.x,w.y); ctx.lineTo(t.x,t.y);
    ctx.lineWidth=(on?3.0:2.0); ctx.strokeStyle=on?'#ffc94d':'#6ea8ff'; ctx.stroke();
  };
  /* The ORIGIN knob is solid and the TIP knob is a ring: that is the whole of
     how you tell which end of a bone you are looking at, and the tip is where
     the next bone starts. A dark fill made the ring read as another solid dot,
     so the hollow one is filled with paper instead. */
  const knob=(p,r,on,filled)=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU);
    ctx.fillStyle = filled ? (on?'#ffc94d':'#6ea8ff') : 'rgba(247,244,238,.92)';
    ctx.fill();
    ctx.lineWidth=2.4; ctx.strokeStyle='rgba(20,17,15,.75)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU);
    ctx.lineWidth=1.4; ctx.strokeStyle=on?'#ffc94d':'#6ea8ff'; ctx.stroke();
  };

  for(const b of rig) if(b.id!==selBone){ const w=W.get(b.id);
    body(w,false); knob(w,boneR(w),false,true); knob(boneTip(w),boneR(w),false,false); }

  const sb = selBone!=null ? boneById(selBone) : null;
  if(sb){
    const w=W.get(sb.id), t=boneTip(w), r=boneR(w);
    /* The scale box, wherever the rig is poseable - the same idea as a shape's
       rig, with handles only at the far end because a bone's origin belongs to
       its parent and cannot move. */
    if(boneTool!=='bdraw' || !boneMode){
      const cn=boneCorners(w);
      ctx.beginPath(); ctx.moveTo(cn[0].x,cn[0].y);
      for(let i=1;i<4;i++) ctx.lineTo(cn[i].x,cn[i].y);
      ctx.closePath();
      ctx.setLineDash([5,4]); ctx.lineWidth=1.2;
      ctx.strokeStyle='rgba(255,201,77,.55)'; ctx.stroke(); ctx.setLineDash([]);
      for(const h of boneScaleHandles(w)){
        ctx.beginPath(); ctx.arc(h.x,h.y,5,0,TAU);
        ctx.fillStyle='#fff'; ctx.fill();
        ctx.lineWidth=1.6; ctx.strokeStyle='#ffc94d'; ctx.stroke();
      }
    }
    body(w,true); knob(w,r,true,true); knob(t,r,true,false);
    // the tip is where the next bone starts - say so plainly
    ctx.beginPath(); ctx.arc(t.x,t.y,r+5,0,TAU);
    ctx.setLineDash([3,3]); ctx.lineWidth=1.4; ctx.strokeStyle='rgba(255,201,77,.85)';
    ctx.stroke(); ctx.setLineDash([]);
    if(sb.pinned){                       // a pin stops the IK solve
      ctx.beginPath(); ctx.arc(w.x,w.y,r+4,0,TAU);
      ctx.lineWidth=1.8; ctx.strokeStyle='#e0403a'; ctx.stroke();
    }
    /* Offset PERPENDICULAR to the bone, not straight up: on a vertical bone -
       which is most of a humanoid - straight up drops the label onto the bone. */
    const lbl=(sb.name||'Bone')+(sb.side?' '+sb.side:'');
    // clear of the scale box as well as the bone, or it lands on the handles
    const mp=boneAt(w,0.5), off=r+BONE_PAD+13;
    const lx=mp.x - Math.sin(w.rot)*off, ly=mp.y + Math.cos(w.rot)*off;
    ctx.font='600 11px ui-sans-serif,system-ui,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=3.5; ctx.strokeStyle='rgba(20,17,15,.9)';
    ctx.strokeText(lbl, lx, ly);
    ctx.fillStyle='#ffc94d'; ctx.fillText(lbl, lx, ly);
  }
  // a pinned bone that is NOT selected still has to read as pinned
  for(const b of rig) if(b.pinned && b.id!==selBone){
    const w=W.get(b.id);
    ctx.beginPath(); ctx.arc(w.x,w.y,boneR(w)+4,0,TAU);
    ctx.lineWidth=1.6; ctx.strokeStyle='rgba(224,64,58,.85)'; ctx.stroke();
  }

  /* Where the NEXT bone will hang from. With a bone selected, Draw Bones always
     parents to it - so say so before anything is committed, by running a dotted
     line from that bone's tip to wherever the new bone is about to start. */
  const drawing0 = boneGesture && boneGesture.mode==='draw';
  if(boneMode && boneTool==='bdraw' && sb && mouse.x>-500){
    const w=W.get(sb.id), from=boneTip(w);
    // snapped, so the tether collapses to nothing the moment the start joins
    const to = boneDrawStart(sb.id, drawing0 ? boneGesture.from : mouse);
    if(dist(from,to)>2){
      ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(to.x,to.y);
      ctx.setLineDash([2,5]); ctx.lineWidth=1.5;
      ctx.strokeStyle='rgba(255,201,77,.75)'; ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(to.x,to.y,2.6,0,TAU);
      ctx.fillStyle='rgba(255,201,77,.9)'; ctx.fill();
    }
  }

  // the bone being dragged out right now
  if(drawing0 && boneGesture.tip){
    const a=boneDrawStart(boneGesture.parent, boneGesture.from), t=boneGesture.tip;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(t.x,t.y);
    ctx.lineWidth=2.4; ctx.setLineDash([5,4]); ctx.strokeStyle='#ffc94d'; ctx.stroke();
    ctx.setLineDash([]);
    knob(a,5,true,true); knob(t,5,true,false);
  }
  ctx.restore();
}

/* ------------------------------------------------------------ IK targets
   A per-bone marker sitting ON the bone's TIP, toggled by "IK target" in the
   bone panel.

   It is drawn OUTSIDE drawBones because drawBones has a pile of its own state
   to set up, but it is gated on the SAME rigVisible(): a target is part of the
   skeleton, so it comes and goes with it. In Draw mode that means the animation
   bar's skeleton checkbox. It still takes the split view's rig-side offset,
   because it hangs off a bone.

   The seed is the TIP EXACTLY, with no offset of any kind. The goal is a goal
   for the tip, so a seed anywhere else is a pose change the author did not ask
   for: it used to be dropped 26px past the tip, and every targeted limb then
   popped out to reach it the moment the skeleton was touched. Nothing about the
   crosshair's own placement may move a bone. */
const IKT_R = 10;
// Where a target sits before it has been placed. Only ever a SEED.
const ikTargetPos = w => boneTip(w);

/* A goal is a WORLD point, and it is per FRAME: it lives on the pose entry as
   ikx/iky, so clonePose, snapshot(), the scene's bones.pose, frame duplication
   and undo all carry it with nothing extra written.

   World rather than bone-relative is the whole point of it. Moving the root -
   or any bone above the target's own - must NOT carry the target along; the
   chain solves back to the goal instead, which is what plants a foot while the
   body moves over it. */
const ikGoalOf = (b,pose,W) => { const v=pose[b.id];
  return (v && v.ikx!=null) ? {x:v.ikx, y:v.iky} : ikTargetPos(W.get(b.id)); };
function seedIKGoal(b,f){
  const p=poseAt(f), w=boneWorld(p).get(b.id);
  if(!w || !p[b.id]) return;
  const t=ikTargetPos(w); p[b.id].ikx=t.x; p[b.id].iky=t.y;
}
function seedIKGoalAll(b){ for(let f=0;f<bonePose.length;f++) seedIKGoal(b,f); }
function clearIKGoal(b){
  for(const p of bonePose) if(p[b.id]){ delete p[b.id].ikx; delete p[b.id].iky; }
}
/* Put every targeted chain back on its goal. Called after ANY pose edit, since
   all of them move a limb off its target - and NEVER from the render loop: the
   pose is the document and the painter does not write to it.

   `stopId` is the bone the user is dragging right now, and it acts as a pin: a
   hand's chain runs all the way up through the spine and the pelvis, so without
   it enforcing a hand goal would rewrite the very bone being dragged and the
   gesture would read as dead. Two passes, because solving one limb can shift
   another off its goal through their shared ancestors. */
function enforceIKTargets(stopId){
  if(!rig.some(b=>b.ikt)) return;
  const p=poseAt(frame);
  // FOUR passes, not two. Two limbs whose chains share an ancestor take turns
  // pulling it about, and two rounds left the earlier one of them up to ~18px
  // off its goal after a single large move - which reads as exactly the pop the
  // targets exist to stop. A whole enforce is 0.016ms, so the extra rounds are
  // free; past four nothing moves.
  for(let pass=0; pass<4; pass++)
    for(const b of rig){
      const v=p[b.id];
      if(!b.ikt || !v || v.ikx==null) continue;
      solveIK(b, {x:v.ikx, y:v.iky}, stopId);
    }
}
/* A press on a target drives IK: the goal is where the bone's TIP is asked to
   go, so it is exactly what dragging the tip does, at whatever lever the target
   happens to be sitting at.

   The pick radius is generous and the NEAREST target wins, because a target
   sitting under a bone still has to be grabbable - that is the whole reason it
   is tested before the bones are. */
function ikTargetHit(world,p){
  const pose=poseAt(frame);
  let best=null, bd=IKT_R+8;
  for(const b of rig){
    if(!b.ikt || !world.get(b.id)) continue;
    const d=dist(ikGoalOf(b,pose,world),p);
    if(d<bd){ bd=d; best=b; }
  }
  return best;
}
function drawIKTargets(){
  // part of the skeleton, so it is shown exactly when the skeleton is
  if(!rigVisible() || !rig.some(b=>b.ikt)) return;
  const pose=poseAt(frame), W=boneWorld(pose);
  ctx.save();
  const SD=splitDX(); if(SD) ctx.translate(SD,0);
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const b of rig){
    if(!b.ikt) continue;
    const w=W.get(b.id); if(!w) continue;
    const p=ikGoalOf(b,pose,W);
    const on = b.id===selBone ||
               (!!boneGesture && boneGesture.mode==='bikt' && boneGesture.bone===b.id);
    // a dotted leader back to the tip says which bone a target belongs to
    {
      const t=boneTip(w);
      ctx.beginPath(); ctx.moveTo(t.x,t.y); ctx.lineTo(p.x,p.y);
      ctx.setLineDash([2,4]); ctx.lineWidth=1.3;
      ctx.strokeStyle='rgba(47,191,148,.75)'; ctx.stroke(); ctx.setLineDash([]);
    }
    // paper-filled with a dark casing, like the bone knobs, so it reads over
    // any colour - but a crosshair rather than a plain disc, so it never reads
    // as one more bone end
    ctx.beginPath(); ctx.arc(p.x,p.y,IKT_R,0,TAU);
    ctx.fillStyle='rgba(247,244,238,.92)'; ctx.fill();
    ctx.lineWidth=2.6; ctx.strokeStyle='rgba(20,17,15,.75)'; ctx.stroke();
    ctx.lineWidth=1.6; ctx.strokeStyle=on?'#ffc94d':'#2fbf94'; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x-IKT_R-2,p.y); ctx.lineTo(p.x+IKT_R+2,p.y);
    ctx.moveTo(p.x,p.y-IKT_R-2); ctx.lineTo(p.x,p.y+IKT_R+2);
    ctx.lineWidth=3.2; ctx.strokeStyle='rgba(20,17,15,.75)'; ctx.stroke();
    ctx.lineWidth=1.5; ctx.strokeStyle=on?'#ffc94d':'#2fbf94'; ctx.stroke();
  }
  ctx.restore();
}


function render(){ drawFrame(); }
function startRenderLoop(){ (function loop(){ drawFrame(); requestAnimationFrame(loop); })(); }

/* ======================================================= undo / redo stacks */
const undoStack=[], redoStack=[];
/* Whether the document has moved on since the last save or load. Set by
   pushUndo - every edit goes through it - and cleared by a save, a load and a
   new scene. guardUnsaved() further down is what asks about it. */
let dirty=false;
function snapshot(){
  const v={};
  for(const n of viewNames) v[n]=views[n]||[];
  // Every FRAME of every view, so adding, duplicating and deleting a frame are
  // all ordinary undoable edits with nothing extra to write.
  // refLib is NOT in here: a load clears the stacks, so the view names cannot
  // change under a snapshot, and an entry orphaned by undoing an import is
  // inert. That is also why an Update keys a NEW refLib entry and repoints the
  // shapes at it rather than mutating the entry in place - the repointing lives
  // in the shapes, so it lands in here for free.
  /* The skeleton rides along in here too. It is a few KB against a whole
     document stringify, and carrying all three of rig/bind/pose is what makes
     every bone edit an ordinary undoable one with nothing extra written -
     a snapshot that forgets one of them looks fine until you redo. */
  return JSON.stringify({views:v, view:view, frame:frame, sel:selGroup().map(g=>g.id),
                         rig:rig, bind:bindPose, pose:bonePose, selBone:selBone});
}
function restore(str){
  const snap=JSON.parse(str);
  for(const n of viewNames) views[n]=snap.views[n]||[[]];
  frame=Math.max(0,Math.min(frameCount()-1, snap.frame||0));
  /* Before setView, which clears selBone - and the pose is clamped to the frame
     count the views above have just decided, so it can never come back short. */
  rig=snap.rig||[]; bindPose=snap.bind||{}; bonePose=snap.pose||[];
  fitBonePose(frameCount()); bumpBind();
  const wantBone=snap.selBone;
  setView(snap.view);
  syncFrames();
  selBone = wantBone!=null && boneById(wantBone) ? wantBone : null;
  const ids=snap.sel||[];
  const back=ids.map(id=>cur().find(s=>s.id===id)).filter(Boolean);
  selected=back[0]||null; extra=back.slice(1);
  syncPalette();
}
function syncHistory(){
  document.getElementById('btnUndo').disabled = !undoStack.length;
  document.getElementById('btnRedo').disabled = !redoStack.length;
  syncChrome();
}
function pushUndo(){
  dirty=true;                               // every edit lands here, so this is the one place
  undoStack.push(snapshot());
  if(undoStack.length>60) undoStack.shift();
  redoStack.length=0;                       // a fresh edit forks history, redo is gone
  syncHistory();
}
function undo(){
  if(!undoStack.length) return;
  dirty=true;                               // stepping back is still a difference from the row
  redoStack.push(snapshot());
  restore(undoStack.pop());
  syncHistory();
}
function redo(){
  if(!redoStack.length) return;
  dirty=true;
  undoStack.push(snapshot());
  restore(redoStack.pop());
  syncHistory();
}

/* ========================================================== hit testing */
/* Pick radius for a handle or an outline dot, capped so it can never claim more
   than a quarter of the shape it belongs to - otherwise a small shape is all
   handle and has no middle left to grab. */
function pickR(minDim, full){ return Math.max(3, Math.min(full, minDim*0.25)); }
function shapeAt(w){
  const list=cur();
  for(let i=list.length-1;i>=0;i--){
    if(skinHidden(list[i])) continue;      // not on screen, so not clickable
    buildFill(ctx, worldPts(list[i]), list[i].closed!==false);   // click the fill, chord included
    if(ctx.isPointInPath(w.x,w.y)) return list[i];
  }
  return null;
}
function outlineNear(w,tol){
  const list=cur();
  for(let i=list.length-1;i>=0;i--){
    /* warpable, not editable: a shape displaced by a bone has no honest local
       space to write a carve back into, so the tools look past it to whatever
       is underneath - the same thing they already do with a reference. */
    if(!warpable(list[i])) continue;
    for(const p of worldPts(list[i])) if(dist(p,w)<tol) return list[i];
  }
  return null;
}

/* =============================================================== events */
function pos(e){
  const r=cv.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}

cv.addEventListener('pointerdown',e=>{
  // While it is playing the canvas is a viewer, not an editor: the frame under
  // the cursor changes twelve times a second, so any gesture would land on
  // whichever frame happened to be up when you let go.
  if(playing) return;
  cv.setPointerCapture(e.pointerId);
  const w=pos(e); mouse.down=true; mouse.x=w.x; mouse.y=w.y;
  // Back to the paint sidebar: a click on the canvas is the end of a pick.
  if(closeLibrary()) syncPalette();

  /* Bone mode owns the canvas outright - it REPLACES the drawing tools, so
     nothing below this line may run while it is up. */
  if(boneMode){ bonePointerDown(w,e); return; }

  /* The skeleton overlay is the opposite bargain: the rig is just a set of
     handles floating over the ordinary editor, so it claims a press only when
     one actually lands on a bone and everything else falls through to whatever
     tool is up. */
  /* An IK target is grabbable wherever it is DRAWN, and it is drawn exactly
     when the skeleton is - so it rides the same guard. Tested BEFORE the
     overlay's bones, because a target sitting under one still has to be
     reachable, and it costs nothing at all when no bone has one. */
  if(rigVisible() && rig.some(b=>b.ikt)){
    const BW=boneWorld(poseAt(frame));
