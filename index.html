    const it=ikTargetHit(BW,w);
    if(it){ clearSel(); ikTargetDown(w,it); return; }
  }

  if(poseOverlay && rig.length){
    const BW=boneWorld(poseAt(frame));
    const hit=boneHit(BW,w);
    // the Hand is aimed at one thing at a time: taking a bone drops the shapes,
    // which is what lets the sidebar follow the press with no tie to break
    if(hit){ clearSel(); boneHandDown(w,hit,BW); return; }
    /* A press that misses every bone DESELECTS - exactly as bone mode's Hand
       does - but it does not claim the press: it still falls through to
       whatever tool is up. */
    if(selBone!=null){ selBone=null; syncPalette(); }
  }

  if(tool==='brush'){
    drawing={pts:[w], len:0};
    return;
  }

  if(tool==='eraser' || tool==='smear'){
    // Start the sweep wherever you like - empty paper included. It locks onto
    // the first outline the disc actually touches and then stays on that one.
    carve={shapes:[], locked:false, mode: tool==='eraser'?'erase':'smear', prev:w};
    tryCarve(w);
    return;
  }

  /* ---- Hand of Judgement ---- */
  // Depth arrows first: they sit clear of every box, so nothing else can want them.
  {
    const g0=selGroup();
    if(g0.length) for(const b of depthBtns(g0)){
      if(dist(b,w) < DEPTH_R+3){ reorderSel(b.dir); gesture=null; return; }
    }
  }

  // A group carries its own rig: resize and rotate act on all of it at once,
  // about the group's screen box. Warping is still the anchor shape's alone,
  // so the per-shape handles only appear when the selection is a single shape.
  const grp=selGroup();
  if(grp.length>1){
    const gc=groupCorners(grp,GRP_PAD);
    const gf=groupFrame(grp), gR=pickR(Math.min(gf.x1-gf.x0, gf.y1-gf.y0), 13);
    for(let i=0;i<4;i++){
      if(dist(gc[i],w) < gR){
        pushUndo();
        // Snapshot the group: every move is computed from the state at grab,
        // so the box the gesture works against never drifts under itself.
        const snap=grp.map(g=>({s:g, x:g.x, y:g.y, sx:g.sx, sy:g.sy, rot:g.rot}));
        if(i===1){                                   // top right = rotate
          const f=groupFrame(grp), piv=frameToWorld(f,{x:f.cx,y:f.cy});
          gesture={mode:'grotate', cx:piv.x, cy:piv.y, rot0:gRot,
                   ang0:Math.atan2(w.y-piv.y, w.x-piv.x), grab:snap};
        }else{                                       // others = resize
          const raw=groupCorners(grp,0);             // unpadded: what actually scales
          const a=raw[(i+2)%4];                      // the pinned corner
          // The rig's padding is a constant number of pixels, so it does NOT
          // scale with the box. Measure the drag against the unpadded corner and
          // carry the pad across as a fixed offset, or the handle falls short of
          // the cursor by the pad the moment the box grows.
          gesture={mode:'gresize', anchor:a,
                   pad:{x:gc[i].x-raw[i].x, y:gc[i].y-raw[i].y},
                   diag:{x:raw[i].x-a.x, y:raw[i].y-a.y}, grab:snap};
        }
        return;
      }
    }
  }

  // Handles belong to a single shape. With a group up, the only gesture is move.
  if(selected && !extra.length){
    const corners0 = localCorners(selected);
    const corners = corners0.map(p=>toWorld(selected,p));
    // A small shape has to keep a core you can grab to MOVE it. At a flat 13/10px
    // the handle and outline-dot pick radii swallow a shape only a few px across
    // whole, so a click plumb in the middle grabbed a point and warped it - the
    // shape could not be moved at all. Both radii are capped against the shape's
    // own on-screen size.
    const sb=bbox(worldPts(selected));
    const minDim=Math.min(sb.x1-sb.x0, sb.y1-sb.y0);

    // 1. corner handles
    const cR=pickR(minDim,13);
    for(let i=0;i<4;i++){
      if(dist(corners[i],w) < cR){
        pushUndo();
        if(i===1){                                     // top right = rotate
          const b=bbox(selected.pts);
          const pivot=toWorld(selected,{x:b.cx,y:b.cy});
          gesture={mode:'rotate', pivotLocal:{x:b.cx,y:b.cy}, cx:pivot.x, cy:pivot.y,
                   lastAng:Math.atan2(w.y-pivot.y, w.x-pivot.x)};
        }else{                                         // others = resize
          const lc=rawCorners(selected);   // unpadded: keeps the anchor corner pinned
          const anchorLocal = lc[(i+2)%4];
          // Same trap the group rig already documents: the handle is DRAWN at the
          // padded corner but the maths below puts the BARE corner under the
          // cursor, so the first move snapped the shape in by the pad - a few
          // percent on a big shape, a huge jump on a small one. Carry the pad
          // across as a fixed world offset; it is a constant 10px on screen
          // whatever the scale, so it does not drift as the shape grows.
          const pw=toWorld(selected,corners0[i]), rw=toWorld(selected,lc[i]);
          gesture={mode:'resize', cornerLocal:lc[i], anchorLocal:anchorLocal,
                   pad:{x:pw.x-rw.x, y:pw.y-rw.y},
                   anchorWorld:toWorld(selected,anchorLocal)};
        }
        return;
      }
    }

    // 2. outline points -> soft warp. Never on a reference: those points are the
    //    sheet's, and the corner handles above stay live so it can still be placed.
    //    Never on a bone-deformed shape either: the warp writes back through
    //    toLocal, which knows nothing about the deformation.
    if(warpable(selected)){
      const wp=worldPts(selected);
      const wR=pickR(minDim,10);
      for(let i=0;i<wp.length;i++){
        if(dist(wp[i],w)<wR){
          pushUndo();
          gesture={mode:'warp', weights:warpWeights(selected.pts,i,selected.closed!==false),
                   last:toLocal(selected,w)};
          return;
        }
      }
    }
  }

  // 3. select / move / marquee
  const s=shapeAt(w);
  if(s){
    if(e.shiftKey){                          // shift = add or drop one shape
      if(inSel(s)) dropFromSel(s);
      else if(selected) extra.push(s);
      else selected=s;
      syncPalette(); gesture=null; return;
    }
    // Clicking anything already in the group drags the whole group.
    if(!inSel(s)){ selected=s; extra=[]; syncPalette(); }
    pushUndo();
    gesture={mode:'move', grab:selGroup().map(g=>({s:g, off:{x:g.x-w.x, y:g.y-w.y}}))};
  }else{
    if(!e.shiftKey){ clearSel(); syncPalette(); }
    gesture=null;
    marquee={x0:w.x, y0:w.y, x1:w.x, y1:w.y, add:e.shiftKey};   // drag a box to multi-select
  }
});

cv.addEventListener('pointermove',e=>{
  const w=pos(e); mouse.x=w.x; mouse.y=w.y;

  if(boneMode || boneGesture){ bonePointerMove(w); return; }

  if(drawing){
    const last=drawing.pts[drawing.pts.length-1];
    const step=dist(last,w);
    if(step>1.5){ drawing.pts.push(w); drawing.len+=step; }
    return;
  }
  if(carve){ tryCarve(w); return; }
  if(marquee){ marquee.x1=w.x; marquee.y1=w.y; return; }
  if(!gesture || !selected) return;
  const s=selected;

  if(gesture.mode==='move'){
    for(const g of gesture.grab){ g.s.x=w.x+g.off.x; g.s.y=w.y+g.off.y; }
  }
  else if(gesture.mode==='grotate'){
    // Turn every shape by the same angle and swing its centre round the group
    // pivot, so the arrangement rotates as one body rather than each in place.
    const g=gesture;
    const d=Math.atan2(w.y-g.cy, w.x-g.cx)-g.ang0;
    gRot=g.rot0+d;                                 // the rig turns with the cursor
    const c=Math.cos(d), n=Math.sin(d);
    for(const it of g.grab){
      it.s.rot=it.rot+d;
      const dx=it.x-g.cx, dy=it.y-g.cy;
      it.s.x=g.cx+dx*c-dy*n;
      it.s.y=g.cy+dx*n+dy*c;
    }
  }
  else if(gesture.mode==='gresize'){
    // One uniform factor, projected onto the box diagonal. A rotated shape
    // cannot hold a non-uniform SCREEN-space scale without shearing, and the
    // model has no shear - so a group scales evenly and nothing distorts.
    const g=gesture, a=g.anchor, d=g.diag;
    const L=d.x*d.x+d.y*d.y;
    const t={x:w.x-g.pad.x, y:w.y-g.pad.y};        // where the bare corner must land
    let f = L>1e-6 ? ((t.x-a.x)*d.x + (t.y-a.y)*d.y)/L : 1;
    f=Math.max(0.06,f);                      // no mirroring by dragging past
    for(const it of g.grab){
      it.s.sx=it.sx*f; it.s.sy=it.sy*f;
      it.s.x=a.x+(it.x-a.x)*f;               // spacing scales with the shapes
      it.s.y=a.y+(it.y-a.y)*f;
    }
  }
  else if(gesture.mode==='rotate'){
    const before=toWorld(s,gesture.pivotLocal);
    const ang=Math.atan2(w.y-gesture.cy, w.x-gesture.cx);
    s.rot += ang-gesture.lastAng;
    gesture.lastAng=ang;
    const after=toWorld(s,gesture.pivotLocal);          // keep pivot pinned
    s.x+=before.x-after.x; s.y+=before.y-after.y;
    gesture.cx=before.x; gesture.cy=before.y;
  }
  else if(gesture.mode==='resize'){
    const g=gesture;
    const rel={x:w.x-g.pad.x-g.anchorWorld.x, y:w.y-g.pad.y-g.anchorWorld.y};
    const c=Math.cos(-s.rot), n=Math.sin(-s.rot);
    const rx=rel.x*c-rel.y*n, ry=rel.x*n+rel.y*c;
    const dx=g.cornerLocal.x-g.anchorLocal.x, dy=g.cornerLocal.y-g.anchorLocal.y;
    if(Math.abs(dx)>1e-3){ let v=rx/dx; s.sx = Math.sign(v)*Math.max(0.06,Math.abs(v)); }
    if(Math.abs(dy)>1e-3){ let v=ry/dy; s.sy = Math.sign(v)*Math.max(0.06,Math.abs(v)); }
    const sc={x:g.anchorLocal.x*s.sx, y:g.anchorLocal.y*s.sy};
    const cc=Math.cos(s.rot), nn=Math.sin(s.rot);
    s.x=g.anchorWorld.x-(sc.x*cc-sc.y*nn);
    s.y=g.anchorWorld.y-(sc.x*nn+sc.y*cc);
  }
  else if(gesture.mode==='warp'){
    const cur=toLocal(s,w);
    const dx=cur.x-gesture.last.x, dy=cur.y-gesture.last.y;
    const wts=gesture.weights;
    for(let i=0;i<s.pts.length;i++){
      if(wts[i]<=0) continue;
      s.pts[i].x+=dx*wts[i]; s.pts[i].y+=dy*wts[i];
    }
    gesture.last=cur;
  }
});

function endStroke(){
  if(boneMode || boneGesture){ bonePointerUp(); mouse.down=false; return; }
  if(carve && carve.mode==='smear')
    for(const s of carve.shapes) smearPolish(s, carve.polish.get(s));
  if(drawing){ finishBrush(drawing.pts); drawing=null; }
  if(marquee){ finishMarquee(); marquee=null; }
  carve=null; gesture=null; mouse.down=false;
}

/* A shape joins the selection if its bounding box overlaps the drawn box - the
   forgiving test, so you can lasso a crowd without enclosing every last pixel. */
function finishMarquee(){
  const x0=Math.min(marquee.x0,marquee.x1), x1=Math.max(marquee.x0,marquee.x1);
  const y0=Math.min(marquee.y0,marquee.y1), y1=Math.max(marquee.y0,marquee.y1);
  if(x1-x0<4 && y1-y0<4) return;                  // that was a click, not a box
  const hit=cur().filter(sh=>{
    const b=bbox(worldPts(sh));
    return b.x1>=x0 && b.x0<=x1 && b.y1>=y0 && b.y0<=y1;
  });
  if(!marquee.add) clearSel();
  for(const sh of hit) if(!inSel(sh)){ if(selected) extra.push(sh); else selected=sh; }
  syncPalette();
}
cv.addEventListener('pointerup',endStroke);
cv.addEventListener('pointercancel',endStroke);
cv.addEventListener('pointerleave',()=>{ if(!mouse.down){ mouse.x=-999; mouse.y=-999; } });

/* ================================================================ brush */
function laplacian(pts,amount,passes,closed){
  let p=pts.map(q=>({x:q.x,y:q.y}));
  for(let k=0;k<passes;k++){
    const n=p.length, out=p.map(q=>({x:q.x,y:q.y}));
    for(let i=0;i<n;i++){
      if(!closed && (i===0 || i===n-1)) continue;   // endpoints of an open run stay put
      const a=p[(i-1+n)%n], b=p[(i+1)%n];
      out[i]={ x:p[i].x+((a.x+b.x)/2-p[i].x)*amount,
               y:p[i].y+((a.y+b.y)/2-p[i].y)*amount };
    }
    p=out;
  }
  return p;
}

function finishBrush(raw){
  if(raw.length<4) return;
  // Come back near where you started and the outline snaps shut; otherwise the
  // stroke stays open - filled, but with no outline across the gap.
  const runLen = pathLength(raw);
  const closed = runLen>MIN_RUN &&
                 dist(raw[0], raw[raw.length-1]) < closeThresholdFor(runLen);

  let pts = closed ? rdpLoop(raw, 1.6) : rdp(raw, 1.6);   // kill jitter
  /* Point spacing scales with the stroke too. A flat 12px left a small shape
     with three points, which the guard below then threw away entirely.
     But runLen is the PERIMETER, and on a thin curvy shape that is a measure of
     how far the hand travelled, not of how big the thing is: a ribbon runs out
     along one side and back along the other, so a 60px curl has a ~290px outline.
     runLen/14 read that as a big stroke, sampled it at 12px, and left the curl
     with 24 points - few enough that the smoothing pass below flattened it into
     a bean. Measured, the deformation was a near-constant ~8px whatever the size,
     so it was invisible on a large shape and ate a small one. Capping the spacing
     against the bbox as well keeps a small curly shape densely enough sampled to
     survive the smoothing: worst-case deviation 28% of the shape's size -> 8.5%,
     for ~14% more points. A round or blobby shape is untouched - its perimeter is
     only ~3x its size, so runLen/14 is already the smaller of the two. */
  const rb = bbox(raw);
  const step = Math.max(2, Math.min(12, runLen/14, Math.max(rb.w, rb.h)/12));
  pts = resample(pts, step, closed);
  if(pts.length<5) return;
  pts = laplacian(pts, 0.35, 2, closed);         // gentle confidence pass
  const b = bbox(pts);
  if(b.w<5 && b.h<5) return;

  pushUndo();
  const shape={
    id: uid++,
    pts: pts.map(p=>({x:p.x-b.cx, y:p.y-b.cy})),
    x:b.cx, y:b.cy, rot:0, sx:1, sy:1, lw:brushW, closed:closed,
    colors:{ outline:current.outline, fill:current.fill, shadow:current.shadow }
  };
  cur().push(shape);
}

/* ====================================================== smear and eraser */
/* Both work the same way round the edges: lazily lock onto whichever outline the
   disc first touches - so a sweep can start on blank paper and drag in - then stay
   on that lot for the rest of the stroke. */
function tryCarve(w){
  const R = carve.mode==='erase'?eraserR:smearR;
  if(!carve.locked){
    // A selection claims the tool outright - that is the only way to reach an
    // outline buried under other shapes. The smear takes the WHOLE selection, so a
    // group can be pushed about in one gesture; the eraser stays on the anchor
    // shape, because rubbing a group away at once is not something you can aim.
    let group;
    if(selected)  group = carve.mode==='smear' ? selGroup() : [selected];
    else { const s = outlineNear(w,R); group = s ? [s] : []; }
    // An imported reference cannot be carved. Dropping it from the group must not
    // leave the tool dead everywhere - a selection claims the tool outright, so a
    // refs-only selection would otherwise stop the stroke doing anything at all.
    group = group.filter(editable);
    if(!group.length){ const s = outlineNear(w,R); group = s ? [s] : []; }
    if(!group.some(g=>pointsInRange(g,w,R))) return;
    pushUndo();                       // only once we are actually going to change something
    carve.shapes=group; carve.locked=true;
    // every point the stroke touches, per shape, for the polish pass
    carve.polish=new Map(group.map(g=>[g,new Set()]));
  }
  for(const s of carve.shapes.slice())   // a copy: the eraser can drop one mid-sweep
    if(carve.mode==='erase') eraseAt(s,w);
    else                     smearAt(s,w,carve.prev||w);
  carve.prev=w;
}

function pointsInRange(s,w,r){
  const lp=toLocal(s,w), rl=localRadius(s,r);
  return s.pts.some(p=>dist(p,lp)<rl);
}

/* Radius in the shape's own coordinates - a shape scaled up needs a smaller
   local radius to cover the same distance on screen. */
function localRadius(s,r){
  const avg=(Math.abs(s.sx)+Math.abs(s.sy))/2 || 1;
  return r/avg;
}

/* THE ERASER - rubs points off the outline. Whatever survives is re-joined as
   a single open run, so the erased span simply has no outline any more and the
   fill closes straight across it. Rub enough away and the shape is gone. */
function eraseAt(s,w){
  const lp=toLocal(s,w), rl=localRadius(s,eraserR);
  const pts=s.pts, n=pts.length;
  const keep=pts.map(p=>dist(p,lp)>=rl);
  if(keep.every(Boolean)) return;

  const run=longestRun(keep, s.closed!==false);
  if(!run || run.len<4){                        // nothing worth keeping - bin it
    const list=cur(), i=list.indexOf(s);
    if(i>=0) list.splice(i,1);
    if(inSel(s)){ dropFromSel(s); syncPalette(); }
    carve.shapes=carve.shapes.filter(g=>g!==s);
    return;
  }
  const out=[];
  for(let k=0;k<run.len;k++) out.push(pts[(run.start+k)%n]);
  s.pts=out;
  s.closed=false;                               // the erased span is the bare chord
}

/* Longest surviving stretch of true values, wrapping if the outline is closed */
function longestRun(keep,wrap){
  const n=keep.length;
  let best=null, start=-1, len=0;
  const lim = wrap ? n*2 : n;
  for(let i=0;i<lim;i++){
    if(keep[i%n]){
      if(start<0){ start=i; len=0; }
      len++;
      if(len>n) len=n;
      if(!best || len>best.len) best={start:start%n, len:len};
    }else{ start=-1; len=0; }
  }
  return best;
}

/* THE SMEAR - drags the outline along with the cursor, like a smudge tool.
   Points inside the disc are carried by the pointer's own motion, full strength
   at the centre and fading to nothing at the rim, so a grab-and-drag keeps hold
   of the outline for as long as you keep moving and a push shoves it ahead of
   the disc. It used to shove points radially out to the rim instead, which meant
   the outline could never travel with the cursor - it slid off the disc and
   snapped back the moment the centre passed it. */
/* Full strength across the middle of the disc, fading to nothing at the rim.
   A pure cosine from the centre gripped exactly one point properly and a pull came
   out as a hairline needle; the flat core drags a rounded lobe. */
function gripFalloff(d,rl){
  const core = rl*0.4;
  if(d<=core) return 1;
  return 0.5*(1+Math.cos(Math.PI*(d-core)/(rl-core)));
}

const SMEAR_TENSION = 0.30;              // how hard the outline pulls itself straight
const SMEAR_SLIDE   = 0.3;               // how much of a drag ALONG the outline counts
const SMEAR_HEAL    = 1.0;               // the shrinking half of the tension, relative

/* THE SMEAR - drags the outline along with the cursor, like a smudge tool.
   Points inside the disc are carried by the pointer's own motion, at full strength
   in the middle and fading to nothing at the rim, so a push shoves the outline
   ahead of the disc and a grab hauls a lobe out of it. It used to shove points
   radially out to the rim instead, which meant the outline could never travel with
   the cursor at all - it slid off the disc and snapped back the moment the centre
   passed it. */
function smearAt(s,w,wp){
  const closed = s.closed!==false;
  const lp = toLocal(s,w), pp = toLocal(s,wp);
  const rl = localRadius(s,smearR);
  const dx = lp.x-pp.x, dy = lp.y-pp.y;
  const len = Math.hypot(dx,dy);
  if(len < 0.02) return;                   // a still cursor smudges nothing

  // Sub-step a fast flick, otherwise the disc teleports across the outline and
  // grabs nothing on the way.
  const steps = Math.max(1, Math.ceil(len/(rl*0.35)));
  const sx = dx/steps, sy = dy/steps;
  // Refine the stretch of outline this move is about to touch, BEFORE touching it.
  // A small disc landing on brush-spaced points had only one point to work with and
  // pulled a single-point spike; done afterwards the damage is already in the outline.
  resampleOutline(s, rl, {x:(lp.x+pp.x)/2, y:(lp.y+pp.y)/2, r:len/2 + rl*3});
  const pts = s.pts;
  const polish = carve.polish.get(s);
  const before = pts.map(p=>({x:p.x, y:p.y}));   // to put back anything that crosses
  const np = pts.length;
  const moved = new Map();                 // point -> strongest pull it felt this move
  for(let st=1; st<=steps; st++){
    const cx = pp.x + dx*st/steps, cy = pp.y + dy*st/steps;
    for(let i=0;i<np;i++){
      const p = pts[i];
      const d = Math.hypot(p.x-cx, p.y-cy);
      if(d>=rl) continue;
      const k = gripFalloff(d,rl);
      // Only the part of the motion across the outline gets to move it at full
      // strength; sliding the disc ALONG an edge is damped hard. Undamped, running
      // the disc round a shape shovelled the outline along itself and piled it up
      // into a thin flap - the outline really was being carried from one side of
      // the shape to the other.
      const a = pts[(i-1+np)%np], b = pts[(i+1)%np];
      let tx = b.x-a.x, ty = b.y-a.y;
      const tl = Math.hypot(tx,ty);
      let mx = sx, my = sy;
      if(tl > 1e-6){
        tx/=tl; ty/=tl;
        const along = (sx*tx + sy*ty)*(1-SMEAR_SLIDE);
        mx -= tx*along; my -= ty*along;
      }
      p.x += mx*k; p.y += my*k;
      if(k > (moved.get(p)||0)) moved.set(p,k);
      polish.add(p);
    }
  }
  if(!moved.size) return;

  // Tension. Every point the disc touched - the ones under the middle of it
  // included - gets pulled back against the bend THIS MOVE put in the outline. It
  // is a Laplacian of the displacement, not of the outline: what it relaxes is the
  // difference between how far the point moved and how far its neighbours moved.
  // Smoothing the positions instead is curve-shortening flow, which eats a closed
  // curve alive; it went unnoticed while only a short arc was ever touched at once
  // and the rest of the outline anchored it, but a disc wide enough to swallow a
  // whole small shape touches every point every frame, nothing anchors, and the
  // shape boiled away to nothing in about fifteen frames. A displacement Laplacian
  // is zero for a shape being carried along bodily, so that case now just moves.
  //
  // It is doing two jobs at once: it keeps the outline smooth instead of spiky, and it is what
  // makes the disc LET GO. A point held at full strength lags a little against the
  // tension each frame, the lag carries it out of the middle of the disc, its hold
  // weakens, and it drops out. Nothing is latched, so hauling one side of a shape
  // across to the other is not possible - the outline stretches to where the pull
  // and the tension balance and no further, and how far that is scales with the
  // disc, because a wide disc holds a broad low bulge that the tension barely
  // resists while a small one can only raise a sharp one that it flattens at once.
  const n = pts.length;
  // The shoulder is measured in disc radii, not in points. A fixed span of points
  // is a much wider stretch of outline for a small disc than a large one, and it
  // smoothed a fine smear away as fast as it was made.
  const spacing = Math.max(1, pathLength(pts)/n);
  const span = Math.max(3, Math.min(14, Math.round(rl/spacing*2)+2));
  const touched = new Map();
  for(let i=0;i<n;i++){
    const g = moved.get(pts[i]);
    if(!g) continue;
    for(let j=i-span;j<=i+span;j++){
      const q = closed ? (j+n*2)%n : j;
      if(!closed && (q<=0 || q>=n-1)) continue;
      const decay = g*Math.max(0, 1-Math.abs(j-i)/(span+1));
      if(decay > (touched.get(q)||0)) touched.set(q,decay);
    }
  }
  // ...and a second, weaker pull towards the outline's own neighbours, which is
  // what rounds off a bend the disc left behind on an earlier frame. The
  // displacement pass can only see the bend it has just made, so on its own it
  // never heals anything and a horn survives the rest of the stroke. This one is
  // the shrinking kind, so it fades out as the disc takes in more of the outline
  // and is gone by the time it holds all of it - curve-shortening flow is only
  // harmless while some of the outline is still anchored outside the disc.
  const heal = SMEAR_TENSION*SMEAR_HEAL*Math.max(0, 1-touched.size/n);
  for(const [i,k] of touched){
    const ia=(i-1+n)%n, ib=(i+1)%n;
    const a=pts[ia], b=pts[ib], a0=before[ia], b0=before[ib], p0=before[i];
    const w=0.4+0.6*k, f=SMEAR_TENSION*w, h=heal*w;
    pts[i].x += (((a.x-a0.x)+(b.x-b0.x))/2 - (pts[i].x-p0.x))*f + ((a.x+b.x)/2-pts[i].x)*h;
    pts[i].y += (((a.y-a0.y)+(b.y-b0.y))/2 - (pts[i].y-p0.y))*f + ((a.y+b.y)/2-pts[i].y)*h;
  }
  relieveCusps(pts, touched, closed);
  // The crossing guard has to stay under the point spacing, or points that
  // legitimately sit close together read as a collision and the outline locks solid.
  stopCrossings(pts, touched, before, closed,
                Math.min(Math.max(1.5, rl*0.25), spacing*0.9));
  untangle(s, touched, closed);
}

/* Second line of defence. Anything that folded over anyway gets the fold cut out:
   find a segment near the smear that crosses another, and drop whichever of the
   two loops the crossing makes is the smaller one, joining them at the crossing
   point itself. A shape holds one outline, so a fold is never something to keep -
   it just draws as a crossed-over tangle. */
function untangle(s, touched, closed){
  const idx=[...touched.keys()];
  for(let round=0; round<6; round++){
    const pts=s.pts, n=pts.length;
    if(n<6) return;
    let cut=null;
    for(const i of idx){
      if(i>=n-1 && !closed) continue;
      const a=pts[i], b=pts[(i+1)%n];
      for(let j=0;j<(closed?n:n-1);j++){
        const gapA=Math.abs(j-i), gap=closed?Math.min(gapA,n-gapA):gapA;
        if(gap<2) continue;
        const X=segCross(a,b,pts[j],pts[(j+1)%n]);
        if(X){ cut={i:Math.min(i,j), j:Math.max(i,j), X}; break; }
      }
      if(cut) break;
    }
    if(!cut) return;
    const {i,j,X}=cut;
    const inner=pts.slice(i+1, j+1);                 // the loop the crossing pinches off
    const outer=pts.slice(0,i+1).concat([X], pts.slice(j+1));
    const keep = inner.length > outer.length ? [X].concat(inner) : outer;
    if(keep.length<5) return;
    s.pts=keep;
    idx.length=0; for(let k=0;k<keep.length;k++) idx.push(k);   // recheck everything after a cut
  }
}

/* Where two segments cross, or null. */
function segCross(a,b,c,d){
  const rx=b.x-a.x, ry=b.y-a.y, sx2=d.x-c.x, sy2=d.y-c.y;
  const den=rx*sy2-ry*sx2;
  if(Math.abs(den)<1e-9) return null;
  const t=((c.x-a.x)*sy2-(c.y-a.y)*sx2)/den;
  const u=((c.x-a.x)*ry-(c.y-a.y)*rx)/den;
  if(t<=0||t>=1||u<=0||u>=1) return null;
  return {x:a.x+rx*t, y:a.y+ry*t};
}

/* One tidy-up over everything the stroke touched, once the pointer is up. The
   little hooks a smear leaves where the disc first crossed the outline are too
   small for the tension pass to have finished off while the stroke was still
   moving away from them. */
function smearPolish(s, polish){
  if(!polish || !polish.size) return;
  const closed = s.closed!==false;
  const pts = s.pts, touched = new Map();
  for(let i=0;i<pts.length;i++) if(polish.has(pts[i])) touched.set(i,1);
  if(!touched.size) return;
  const n = pts.length;
  for(let pass=0; pass<2; pass++)
    for(const i of touched.keys()){
      if(!closed && (i<=0 || i>=n-1)) continue;
      const a=pts[(i-1+n)%n], b=pts[(i+1)%n];
      pts[i].x+=((a.x+b.x)/2-pts[i].x)*0.25;
      pts[i].y+=((a.y+b.y)/2-pts[i].y)*0.25;
    }
  relieveCusps(pts, touched, closed);
  untangle(s, touched, closed);
}

/* A hairpin is what a smear leaves when the disc drags a stretch of outline
   sideways along itself: the outline doubles back on its own path and draws as a
   whisker of stroke sticking out of the shape with no width to it. It is not a
   crossing, so the guard below never sees it. Anywhere the outline turns back on
   itself by more than about 100 degrees, pull the point most of the way onto the
   line between its neighbours - which folds the whisker away. */
function relieveCusps(pts, touched, closed){
  const n=pts.length;
  for(let pass=0; pass<3; pass++){
    for(const i of touched.keys()){
      if(!closed && (i<=0 || i>=n-1)) continue;
      const p=pts[i], a=pts[(i-1+n)%n], b=pts[(i+1)%n];
      const v1x=p.x-a.x, v1y=p.y-a.y, v2x=b.x-p.x, v2y=b.y-p.y;
      const m=Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y);
      if(m<1e-6) continue;
      if((v1x*v2x+v1y*v2y)/m > -0.2) continue;          // not a hairpin
      p.x += ((a.x+b.x)/2-p.x)*0.7;
      p.y += ((a.y+b.y)/2-p.y)*0.7;
    }
  }
}

/* Nothing may be pushed through anything else. Any point this move carried onto a
   distant stretch of the same outline goes back where it was, so the wall of a
   dent stops dead when it meets the far wall instead of passing through it and
   knotting the shape up. Without this a small disc could fold the outline over
   itself and leave a shape with a crossed-over tangle in it. */
function stopCrossings(pts, touched, before, closed, guard){
  const n = pts.length, gap = 2, last = closed ? n : n-1;
  for(let pass=0; pass<2; pass++){
    let any=false;
    for(const i of touched.keys()){
      for(let j=0;j<last;j++){
        let d1=Math.abs(j-i), d2=Math.abs(j+1-i);
        if(closed){ d1=Math.min(d1,n-d1); d2=Math.min(d2,n-d2); }
        if(d1<=gap || d2<=gap) continue;                  // its own neighbourhood
        if(segDist(pts[i], pts[j], pts[(j+1)%n]) < guard){
          pts[i].x=before[i].x; pts[i].y=before[i].y; any=true; break;
        }
      }
    }
    if(!any) break;
  }
}

function segDist(p,a,b){
  const vx=b.x-a.x, vy=b.y-a.y, L=vx*vx+vy*vy;
  let t = L ? ((p.x-a.x)*vx+(p.y-a.y)*vy)/L : 0;
  t = t<0?0:t>1?1:t;
  return Math.hypot(p.x-(a.x+vx*t), p.y-(a.y+vy*t));
}

/* Dragging one stretch of outline a long way leaves a huge gap between the last
   point it moved and the first it did not - a dead straight stretch with nothing
   in it to smear next time round. Split anything that has been pulled too far
   apart (and drop points that have been bunched up into each other). */
function resampleOutline(s, rl, near){
  const closed = s.closed!==false;
  const pts=s.pts, out=[];
  // The spacings come off the disc, but they have to be clamped against the SHAPE
  // as well. A disc far bigger than what it is smearing asked for a spacing wider
  // than the whole outline, so every point but a handful was culled as "too tight"
  // on every single move, and a small shape under a big disc was decimated to the
  // four-point floor and then to nothing. Never thin an outline that is already
  // sparse, and never ask for a spacing coarser than a fraction of its perimeter.
  const perim = pathLength(pts) + (closed ? dist(pts[pts.length-1], pts[0]) : 0);
  const maxSeg = Math.max(3, Math.min(rl*0.5, perim/12));
  const minSeg = pts.length<=16 ? 0 : Math.min(maxSeg*0.18, perim/40);
  const last = closed ? pts.length : pts.length-1;
  const inReach = p => !near || Math.hypot(p.x-near.x, p.y-near.y) < near.r;
  for(let i=0;i<pts.length;i++){
    const a=pts[i];
    if(out.length && i<last && inReach(a)){
      const prev=out[out.length-1];
      if(dist(prev,a) < minSeg) continue;             // too tight - skip it
    }
    out.push(a);
    if(i>=last || out.length>600) continue;
    const b=pts[(i+1)%pts.length], d=dist(a,b);
    if(d>maxSeg && inReach(a)){
      const k=Math.min(8, Math.floor(d/maxSeg));
      for(let j=1;j<=k;j++)
        out.push({x:a.x+(b.x-a.x)*j/(k+1), y:a.y+(b.y-a.y)*j/(k+1)});
    }
  }
  if(out.length>=4) s.pts=out;
}

/* ================================================== warp falloff weights */
function warpWeights(pts,idx,closed){
  const {s,total}=arcLengths(pts,closed);
  // Falloff scales with the outline: a flat 90 units swallowed a small shape
  // whole, so dragging a point just slid the thing sideways.
  const R=Math.max(26, Math.min(WARP_R, total*0.30));
  const n=pts.length, out=new Array(n).fill(0);
  for(let i=0;i<n;i++){
    let d=Math.abs(s[i]-s[idx]);
    if(closed) d=Math.min(d,total-d);            // wrap around the loop
    out[i] = d>=R ? 0 : 0.5*(1+Math.cos(Math.PI*d/R));
  }
  out[idx]=1;
  return out;
}

/* A colour drag starts from a swatch or from a slot - dragging between the two
   slot columns is how a colour moves between the defaults and the selection. */
function startColorDrag(hex,fromSlot,e){
  dragColor=hex; dragFrom=fromSlot;
  ghost.classList.toggle('xnone',hex===NONE);
  ghost.style.background = hex===NONE ? '#fff' : hex;
  ghost.style.display='block';
  ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
}

document.getElementById('palette').addEventListener('pointerdown',e=>{
  const sl=e.target.closest && e.target.closest('.slot');
  if(!sl) return;
  e.preventDefault();
  startColorDrag(slotColor(sl),sl,e);
});

window.addEventListener('pointermove',e=>{
  if(!dragColor) return;
  ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
  document.querySelectorAll('.slot').forEach(sl=>sl.classList.remove('hot'));
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const slot=el && el.closest('.slot');
  if(slot) slot.classList.add('hot');
});

window.addEventListener('pointerup',e=>{
  if(!dragColor) return;
  ghost.style.display='none';
  document.querySelectorAll('.slot').forEach(sl=>sl.classList.remove('hot'));
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const slot=el && el.closest('.slot');
  if(slot && slot!==dragFrom) applyColor(slot.dataset.slot, dragColor, slot.dataset.target);
  dragColor=null; dragFrom=null;
});

// Left column is the default for the next shape drawn, right column is the
// selection. A drop hits one or the other, never both - that is what makes
// dragging between the columns mean anything.
function slotColor(sl){
  return (sl.dataset.target==='sel' && selected ? selected.colors : current)[sl.dataset.slot];
}
function applyColor(which,hex,target){
  if(target==='sel'){
    // A reference keeps the sheet's colours. Filter per shape so a mixed
    // selection still recolours the rest, and do not push an undo for a no-op.
    const hit=selGroup().filter(editable);
    if(!hit.length) return;
    pushUndo();
    for(const g of hit) g.colors[which]=hex;
  }else{
    pushUndo();
    current[which]=hex;
  }
  syncPalette();
}

const TOOL_NAMES={brush:'Brush', smear:'Smear', eraser:'Eraser', hand:'Hand of Judgement'};
const TOOL_PANELS={brush:'optBrush', smear:'optSmear', eraser:'optEraser', hand:'optHand'};
/* The bone tools are deliberately NOT values of `tool`: syncPalette does
   getElementById(TOOL_PANELS[tool]) and throws on anything not in that map. */
const esc = s => String(s==null?'':s).replace(/[<&]/g,c=>c==='<'?'&lt;':'&amp;');
const BTOOL_NAMES ={bdraw:'Draw Bones', bhand:'Hand of Judgement', bskin:'Skinning'};
const BTOOL_PANELS={bdraw:'optBDraw',   bhand:'optBHand',          bskin:'optBSkin'};

/* The library is a picker, not a mode to live in: touching the canvas or
   reaching for a tool means you are done with it, so it drops back to the
   paint sidebar. Returns whether it actually closed, so the caller can decide
   whether it still owes a syncPalette. */
function closeLibrary(){
  if(paletteMode!=='library') return false;
  paletteMode='paint';
  return true;
}

/* Bone mode is a mode you live in, not a picker - so unlike the Library it is
   only ever left deliberately: by the button, by reaching for a drawing tool, or
   by a load. It swaps the whole sidebar, which is what takes the colour palette
   away, and it is only offered where a rig means anything. */
function enterBoneMode(){
  if(!canRig() || boneMode) return;

     ghosted view or frame on top of the skeleton reads as more of it. The
     frame one is unreachable anyway while the animation bar is hidden. They

  onionOn=false; onionFrame=false;

function setBoneTool(t){

/* An eye or mouth object's frames are named expressions, and the animation bar
   at the bottom of the stage is already a row of named frames - so for exactly
   ONE selected reference to a fixed-frame kind the bar stands in for that
   object and the sidebar picker goes away. A group has nothing coherent to
   list, so it keeps the document's own frames and the ordinary behaviour. */
function refFrameTarget(){
  const grp=selGroup();
  const s = grp.length===1 && grp[0].ref ? grp[0] : null;
  if(!s || !(DOC_KINDS[s.ref.kind]||{}).frameNames) return null;
  const lib=refLib.get(s.ref.key);
  const frames = lib ? refFrames(lib) : [];
  return frames.length>1 ? {s:s, lib:lib, frames:frames} : null;
}
function refFrameLabel(lib,i){
  const names=lib.frameNames || (DOC_KINDS[lib.kind]||{}).frameNames || null;
  return names ? (names[i]||String(i)) : String(i);
}

/* The frame picker for an imported drawing. It only appears for a selection of
   exactly ONE reference: the frames on offer are that drawing's own, and a mixed
   group would have nothing coherent to list. Both settings live in the shape, so
   snapshot() already carries them and undo works without anything extra. */
function syncPoses(){
  const grp=selGroup();
  const s = grp.length===1 && grp[0].ref ? grp[0] : null;
  const lib = s && refLib.get(s.ref.key);
  const frames = lib ? refFrames(lib) : [];
  // ...unless the animation bar is showing them instead - see refFrameTarget.
  const show = !!(lib && frames.length>1) && !refFrameTarget();
  document.getElementById('poseSec').classList.toggle('hidden',!show);
  document.getElementById('poseDiv').classList.toggle('hidden',!show);
  const box=document.getElementById('poses');
  if(!show){ box.innerHTML=''; return; }

  document.getElementById('poseTitle').textContent=
    (DOC_KINDS[s.ref.kind]||{label:s.ref.kind}).label+' - '+(s.ref.title||'Untitled');

  /* A sheet's frames are named expressions a game picks between, not steps of an
     animation to run alongside the parent, so following has nothing to mean for
     one and the checkbox goes away. */
  document.getElementById('refFollowLbl').classList.toggle('hidden',
    !!(DOC_KINDS[s.ref.kind]||{}).frameNames);
  const follow=document.getElementById('refFollow');
  follow.checked=!!s.ref.follow;
  follow.onchange=()=>setRefFollow(s, follow.checked);

  const names=lib.frameNames||null;
  const at=refFrameIndex(s.ref, lib, frame);
  box.innerHTML='';
  for(let i=0;i<frames.length;i++){
    const b=document.createElement('button');
    b.className='pbtn'+(i===at?' on':'');
    b.textContent=names ? (names[i]||String(i)) : String(i);
    /* An empty frame is one the drawing's author never made - offer it greyed
       rather than hiding it, so the frame list still reads straight against the
       drawing it came from. Following disables the lot: the parent picks. */
    b.disabled = s.ref.follow || !(frames[i] && frames[i].length);
    b.addEventListener('click',()=>setRefFrame(s,i));
    box.appendChild(b);
  }
}
function setRefFrame(s,i){
  if(!s.ref || s.ref.frame===i) return;
  pushUndo();
  s.ref.frame=i;
  syncPoses(); syncFrames(); render();
}
function setRefFollow(s,on){
  if(!s.ref || !!s.ref.follow===!!on) return;
  pushUndo();
  s.ref.follow=!!on;
  syncPoses(); syncFrames(); render();
}
/* The sidebar is always open now - it just changes what it offers. */
function syncPalette(){
  document.getElementById('toolName').textContent=TOOL_NAMES[tool];
  document.querySelectorAll('.toolopt').forEach(el=>el.classList.add('hidden'));
  document.getElementById(TOOL_PANELS[tool]).classList.remove('hidden');

  /* The selection block only exists when there is a selection to act on AND the
     Hand is up. A selection deliberately survives a tool change - it is how
     Smear and Eraser reach an outline buried under other shapes - but only the
     Hand can make or change one, so on the other three the block was a set of
     controls for something the tool you are holding cannot touch. The selection
     is still drawn on the canvas there, which is what says it has claimed the
     tool. */
  const grp=selGroup(), has=!!selected && tool==='hand';
  document.getElementById('selSec').classList.toggle('hidden',!has);
  document.getElementById('selHead').textContent = grp.length>1 ? 'Selected shapes' : 'Selected shape';
  document.getElementById('selDiv').classList.toggle('hidden',!has);
  document.getElementById('selSlots').classList.toggle('hidden',!has);
  document.getElementById('selColHead').classList.toggle('hidden',!has);
  // Nothing in the selection can take a colour: the column stays put but goes inert.
  document.getElementById('selSlots').classList.toggle('locked', has && !grp.some(editable));

  syncPoses();
  syncFrames();   // the selection decides whose frames the bar is showing
  syncCopyBtn();

  /* Make Object promotes the selection into a drawing of its own, so it only
     makes sense where a reference can live - and Edit only for a lone reference
     whose drawing is yours. */
  const one = grp.length===1 ? grp[0] : null;
  document.getElementById('mkObjWrap').classList.toggle('hidden', !(has && canImport()));
  /* A lone reference already IS an object - promoting it would only wrap it in a
     second one, so the button goes inert rather than away. */
  const mkDead = !!(one && one.ref);
  document.getElementById('mkObjBtn').disabled = mkDead;
  if(mkDead) closeMkObjMenu();
  document.getElementById('editRefRow').classList.toggle('hidden', !(one && one.ref && canEditRef(one)));
  if(!has) closeMkObjMenu();
  syncMeta();

  document.querySelectorAll('.slot').forEach(sl=>{
    const c=slotColor(sl);
    const chip=sl.querySelector('.chip');
    chip.classList.toggle('xnone', c===NONE);
    chip.style.background = c===NONE ? '#fff' : c;
    sl.querySelector('.hex').textContent = c===NONE ? 'NONE' : c.toUpperCase();
  });

  /* Last, so it wins over everything the per-tool block above just un-hid: the
     library and bone mode are modes for the WHOLE panel, and both only exist on
     a kind that can hold them. Bone mode hiding #paintPanel is also how the
     colour palette goes away - it lives inside it. */
  const onChar = canImport();
  const lib   = paletteMode==='library' && onChar;
  const bones = paletteMode==='bones'   && canRig();
  const btn = document.getElementById('btnLibrary');
  btn.classList.toggle('hidden',!onChar);
  btn.classList.toggle('active',lib);
  syncModeBtn();
  /* Bone mode REPLACES the drawing tools, so none of them may sit there lit
     while it is up. setTool puts the class back on the way out - and clicking
     one is itself the way out, which is why they stay live rather than being
     disabled outright. */
  /* Bone mode REPLACES the drawing tools: they hide and its own three take the
     same slot in the toolbar. The bone button itself stays put, so there is
     always a way back out. */
  document.querySelectorAll('.tool[data-tool]').forEach(b=>{
    b.classList.toggle('hidden', bones);
    b.classList.toggle('active', !bones && b.dataset.tool===tool);
  });
  document.querySelectorAll('.btool').forEach(b=>{
    b.classList.toggle('hidden', !bones);
    b.classList.toggle('active', bones && b.dataset.btool===boneTool);
  });
  /* ...and posing over the ordinary editor borrows the same panel. With the
     skeleton floating over the artwork, or a bone selected, the Hand is aimed
     at the rig rather than at a shape - so the colours are not what the sidebar
     should be showing, the bone's own properties are. Only for the Hand: every
     other tool still falls through to the artwork, and its colours with it. */
  /* ...but a SHAPE selection wins it back. With the overlay up the Hand is
     aimed at whichever of the two you last pressed, so the panel follows that
     rather than the overlay's mere presence - otherwise selecting a shape while
     posing left the sidebar showing the bone block and no shape controls at
     all. Pressing a bone clears the shape selection (in the overlay's own arm of
     pointerdown), so the two can never both be live and this can never flicker. */
  const posing = !bones && !lib && canRig() && tool==='hand' && !selected &&
                 (poseOverlay || selBone!=null) && rig.length>0;
  document.getElementById('paintPanel').classList.toggle('hidden', lib||bones||posing);
  document.getElementById('libPanel')  .classList.toggle('hidden',!lib);
  document.getElementById('bonePanel') .classList.toggle('hidden',!(bones||posing));
  if(bones||posing) syncBonePanel();
}

        ? Math.round((b.att||0)*100)+'% along the parent'+

/* ==================================================== editing the skeleton
   Draw Bones edits the REST skeleton: it writes bindPose AND the same values
   into every frame's pose, so building and fixing a skeleton never deforms
   anything. The Hand writes only the current frame's pose - that is the half
   that deforms. Keeping the two apart is what makes either predictable. */
function setBoneRest(id,v){
  bindPose[id]={...v};
  // the goal is pose data and survives a rest edit; Draw Bones does not re-solve
  for(const p of bonePose){ const g=p[id];
    p[id]={...v};
    if(g && g.ikx!=null){ p[id].ikx=g.ikx; p[id].iky=g.iky; } }
  bumpBind();
}
// Structure or bind moved: the weights are stale as well as the matrices.
function bumpBind(){ bindRev++; rigRev++; }
function boneSubtree(id){
  const out=[], q=[id];
  while(q.length){ const c=q.shift(); const b=boneById(c); if(!b) continue;
                   out.push(b); for(const k of boneKids(c)) q.push(k.id); }
  return out;                       // breadth first, so parents precede children
}
/* Every shape in the document, across every view and every frame - bones are
   document-wide, so pruning one has to reach all of them. cur() is no use here:
   it returns a fresh [] on a miss and the loop would silently do nothing. */
function allShapes(){
  const out=[];
  for(const v of viewNames) for(const fr of (views[v]||[])) for(const s of (fr||[])) out.push(s);
  return out;
}
function pruneSkin(deadIds){
  const dead=new Set(deadIds);
  for(const s of allShapes()){
    if(!s.skin) continue;
    s.skin.bones=(s.skin.bones||[]).filter(b=>!dead.has(b));
    if(!s.skin.bones.length) delete s.skin;
  }
  bumpBind();
}

/* Both ends come off the drag, and the PARENT comes off the selection rather
   than off where you pressed - so a chain is drawn by keeping the last bone
   selected, and a bone can start anywhere rather than being snapped onto its
   parent. Wherever the start lands is resolved into the parent's own frame as
   (att along, off perpendicular). */
function addBone(parentId, start, end){
  const ang=Math.atan2(end.y-start.y, end.x-start.x), len=dist(start,end);
  const b={ id:bid++, name:'Bone '+(rig.length+1), side:'', parent:parentId,
            att:1, off:0, pinned:false };
  const v={ len:len, rot:ang };
  if(parentId==null){ v.x=start.x; v.y=start.y; }
  else{
    // computed BEFORE the push, so boneWorld's single pass does not meet a bone
    // that has no pose entry yet
    const pw=boneWorld(bindPose).get(parentId);
    if(pw){
      const dx=start.x-pw.x, dy=start.y-pw.y;
      const c=Math.cos(-pw.rot), n=Math.sin(-pw.rot);
      b.att = pw.len>0.0001 ? (dx*c - dy*n)/pw.len : 1;
      b.off = dx*n + dy*c;
      v.rot = ang - pw.rot;                        // stored LOCAL to the parent
    }
  }
  /* Pushed to the END of rig, always. The parent is by definition already in
     the array, so a push can never break the parents-before-children order that
     boneWorld's single pass relies on. */
  rig.push(b);
  setBoneRest(b.id, v);
  return b;
}
/* Where a child hangs off its parent, and at what angle to it - the two numbers
   the IK polyline needs, since with an `off` the joint no longer lies along the
   parent's own axis. */
function jointOf(child, parentLen){
  const a=(child.att==null?1:child.att)*parentLen, o=child.off||0;
  return { len:Math.hypot(a,o), ang:Math.atan2(o,a) };
}

function deleteBone(id){
  if(id==null) return;
  const sub=boneSubtree(id);
  if(!sub.length) return;
  const go=()=>{
    pushUndo();
    const dead=sub.map(b=>b.id);
    rig=rig.filter(b=>dead.indexOf(b.id)<0);
    for(const d of dead){ delete bindPose[d]; for(const p of bonePose) delete p[d]; }
    /* The shapes do NOT move: they are stored at rest all along, so losing a
       bone simply stops deforming them. */
    pruneSkin(dead);
    selBone=null; bumpBind();
    syncPalette(); render();
  };
  if(sub.length>1)
    openModal({ title:'Delete '+sub.length+' bones?',
      body:'"'+(boneById(id).name||'Bone')+'" has '+(sub.length-1)+' bone'+(sub.length>2?'s':'')+
           ' hanging off it. They go too. Anything skinned to them is simply unskinned.',
      buttons:[{label:'Delete',primary:true,danger:true,onClick:go},{label:'Cancel'}] });
  else go();
}

/* Mirroring. A CHILD mirrors about its parent's axis, which is exactly what
   turns a left arm into a right one, so negating its local rot is the whole
   operation. A ROOT has no parent axis to mirror about, so it reflects about
   the canvas centre line instead - the same thing Flip H does to a shape. */
function mirrorBones(list){
  const cx=cv.getBoundingClientRect().width/2;
  const set=new Set(list.map(b=>b.id));
  for(const b of list){
    b.side = b.side==='L' ? 'R' : b.side==='R' ? 'L' : '';
    const detached = b.parent==null || !set.has(b.parent);   // the head of what is moving
    for(const p of [bindPose].concat(bonePose)){
      const v=p[b.id]; if(!v) continue;
      if(detached && b.parent==null){ v.rot=Math.PI-v.rot; if(v.x!=null) v.x=2*cx-v.x; }
      else v.rot=-v.rot;
    }
  }
  bumpBind();
}
function flipBone(id){
  if(id==null) return;
  pushUndo();
  mirrorBones(boneSubtree(id));
  syncPalette(); render();
}
/* A duplicate keeps the same parent and the same attachment point, and comes
   out mirrored - which is what makes it the way you build a second arm. The
   whole subtree comes with it, or a duplicated arm would arrive with no hand. */
function duplicateBone(id){
  if(id==null) return;
  const sub=boneSubtree(id);
  if(!sub.length) return;
  pushUndo();
  const map=new Map(), made=[];
  for(const b of sub){                       // breadth first, so a parent is mapped first
    const c={ id:bid++, name:b.name, side:b.side,
              parent: b.parent!=null && map.has(b.parent) ? map.get(b.parent) : b.parent,
              att:b.att, off:b.off||0, pinned:b.pinned, ikt:!!b.ikt };
    map.set(b.id,c.id); rig.push(c); made.push(c);
    bindPose[c.id]={...(bindPose[b.id]||{len:0,rot:0})};
    for(let i=0;i<bonePose.length;i++) bonePose[i][c.id]={...(bonePose[i][b.id]||bindPose[c.id])};
  }
  mirrorBones(made);
  // a copied goal would sit on the ORIGINAL's target and haul the mirrored limb onto it
  for(const c of made) if(c.ikt) seedIKGoalAll(c);
  selBone=made[0].id;
  syncPalette(); render();
}

/* ------------------------------------------------------- humanoid skeleton
   Authored as WORLD rest angles (0 = +x, positive clockwise because canvas y is
   down) and converted to local on the way in - hand-authoring locals down a
   chain is where the sign errors live. Lengths are fractions of the canvas
   height. The pelvis doubles as the lower spine bone, which is the second spine
   bone without a redundant root.

   It is an A-pose, not a stick: the first version splayed the limbs by only a
   few degrees - enough to keep the IK off a degenerate collinear chain, which
   was the whole reason for the splay - and drew as a single vertical line you
   could not tell an arm from a leg in. Arms 35 degrees off vertical and legs 12
   read as a figure and still start the solver off-axis. */
const HUMANOID=[
  ['Pelvis',   '', null,          1,    -90, 0.11],
  ['Spine',    '', 'Pelvis',      1,    -90, 0.10],
  ['Neck',     '', 'Spine',       1,    -90, 0.04],
  ['Head',     '', 'Neck',        1,    -90, 0.12],
  ['Upper arm','L','Spine',       0.85,  55, 0.10],
  ['Forearm',  'L','Upper arm L', 1,     70, 0.09],
  ['Hand',     'L','Forearm L',   1,     76, 0.045],
  ['Upper arm','R','Spine',       0.85, 125, 0.10],
  ['Forearm',  'R','Upper arm R', 1,    110, 0.09],
  ['Hand',     'R','Forearm R',   1,    104, 0.045],
  ['Thigh',    'L','Pelvis',      0,     78, 0.13],
  ['Shin',     'L','Thigh L',     1,     86, 0.12],
  ['Foot',     'L','Shin L',      1,     35, 0.04],
  ['Thigh',    'R','Pelvis',      0,    102, 0.13],
  ['Shin',     'R','Thigh R',     1,     94, 0.12],
  ['Foot',     'R','Shin R',      1,    145, 0.04]
];
function addHumanoid(){
  pushUndo();
  const r=cv.getBoundingClientRect(), H=r.height, W=r.width;
  const by=new Map();                 // "Name Side" -> {id, world}
  for(const row of HUMANOID){
    const name=row[0], side=row[1], par=row[2], att=row[3], deg=row[4], fl=row[5];
    const world=deg*Math.PI/180, len=fl*H;
    const p = par!=null ? by.get(par) : null;
    const b={ id:bid++, name:name, side:side, parent:p?p.id:null, att:att, off:0, pinned:false };
    rig.push(b);
    const v={ len:len, rot: p ? world-p.world : world };
    if(!p){ v.x=W/2; v.y=0.55*H; }
    setBoneRest(b.id, v);
    by.set(name+(side?' '+side:''), {id:b.id, world:world});
  }
  selBone=by.get('Pelvis').id;
  syncPalette(); render();
}
/* Is this ONE bone already sitting at its rest transform in frame f? It is what
   greys "Reset to Rest" out, so it runs on every syncBonePanel - which is once
   per pose gesture - and is four float compares against bindPose, no boneWorld. */
function boneAtRest(b,f){
  const p=poseAt(f)[b.id], r=bindPose[b.id];
  if(!p || !r) return true;
  return Math.abs((p.len||0)-(r.len||0))<1e-6 && Math.abs((p.rot||0)-(r.rot||0))<1e-9 &&
         Math.abs((p.x||0)-(r.x||0))<1e-6     && Math.abs((p.y||0)-(r.y||0))<1e-6;
}
/* Put ONE bone back where the rest skeleton has it, in this frame alone. The
   subtree is deliberately left as it is - its children hold their own local
   angles and simply ride along, which is what lets a bent arm be straightened
   at the shoulder without losing the elbow. The bone's own goal is re-seeded,
   or the enforce pass would drag it straight back out again. */
function resetBone(){
  const b=selBone!=null&&boneById(selBone); if(!b || boneAtRest(b,frame)) return;
  pushUndo();
  const p=poseAt(frame), g=p[b.id]||{};
  p[b.id]={...(bindPose[b.id]||{len:0,rot:0})};
  if(g.ikx!=null){ p[b.id].ikx=g.ikx; p[b.id].iky=g.iky; }
  if(b.ikt) seedIKGoal(b,frame);
  rigRev++;
  enforceIKTargets(b.id);         // this bone held, every other goal honoured
  syncPalette(); render();
}
function resetPose(){
  if(!rig.length) return;
  pushUndo();
  bonePose[frame]=clonePose(bindPose);
  // the goals go back to rest with the pose, or they would drag it straight out again
  for(const b of rig) if(b.ikt) seedIKGoal(b,frame);
  rigRev++;
  syncPalette(); render();
}

/* ------------------------------------------------- the Hand: posing and IK
   This writes bonePose[frame] and NOTHING else. The shapes are stored at rest
   and deformed on the way out through worldPts, so there is nothing to bake
   and posing can never damage the artwork - Reset pose is exact.

     tip drag   rotate and lengthen that one bone (FK)
     body drag  the cursor snaps to the bone's tip and the chain solves (IK)
     a root     drags the whole figure about instead; it has no chain to solve

   Every move is recomputed from a snapshot taken at pointerdown, exactly as
   grotate/gresize already do. Sixty incremental deltas a second accumulate
   float drift into the pose, and the pose is the document. */

/* The chain that a drag on B moves: B and its ancestors, up to the nearest
   pinned bone. Two things stop the walk early -
     a PIN, which is what pins are for; and
     a joint whose segment has no LENGTH, which happens whenever a bone attaches
     at att 0 of its parent - both thighs of the humanoid do. The polyline FABRIK
     works on cannot represent a zero-length segment: its direction is undefined,
     so writing an angle back from it would spin the parent to atan2(0,0). Which
     is also the behaviour you want anyway: dragging a foot should solve the leg,
     not swing the pelvis. */
function ikChain(B,stopId){
  const chain=[B], P=poseAt(frame);
  let c=B;
  while(!c.pinned && c.parent!=null){
    const p=boneById(c.parent);
    // stopId is the bone under the cursor: an enforced goal may not rewrite it
    if(!p || p.pinned || p.id===stopId) break;
    if(jointOf(c, (P[p.id]||{len:0}).len||0).len < 1) break;   // no segment to rotate
    chain.unshift(p); c=p;
  }
  return chain;
}

/* The effector is always the last bone's TIP - an IK target is a goal for that
   tip and nothing else. (It used to lengthen the last segment by IKT_OFF and
   solve for the target itself, which made the offset part of the chain: the
   limb was asked to reach 26px past wherever you put the crosshair.) */
const IK_ITERS = 10;
function solveIK(B,target,stopId){
  const p=poseAt(frame);
  const chain=ikChain(B,stopId), m=chain.length-1;
  const W=boneWorld(p);
  const pts=[];
  for(let i=0;i<=m;i++){ const w=W.get(chain[i].id); pts.push({x:w.x,y:w.y}); }
  pts.push(boneTip(W.get(chain[m].id)));
  /* With an `off` a joint no longer sits on its parent's own axis, so the
     polyline segment stands at a fixed angle to the bone. phi is that angle,
     and it is what the write-back has to subtract - without it an offset bone
     would be rotated to point AT its child instead of along itself. */
  const d=[], phi=[]; let total=0;
  for(let i=0;i<=m;i++){
    d.push(dist(pts[i],pts[i+1])); total+=d[i];
    phi.push(i<m ? jointOf(chain[i+1], W.get(chain[i].id).len).ang : 0);
  }
  const base={x:pts[0].x, y:pts[0].y};
  const step=(a,b,len)=>{ const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
                          if(L<1e-9) return {x:a.x,y:a.y};
                          return {x:a.x+dx/L*len, y:a.y+dy/L*len}; };

  if(dist(base,target)>total){
    // out of reach: straighten the whole chain at it, one pass and done
    for(let i=0;i<=m;i++) pts[i+1]=step(pts[i],target,d[i]);
  }else{
    for(let it=0; it<IK_ITERS && dist(pts[m+1],target)>0.5; it++){
      pts[m+1]={x:target.x, y:target.y};                       // backward
      for(let i=m;i>=0;i--) pts[i]=step(pts[i+1],pts[i],d[i]);
      pts[0]={x:base.x, y:base.y};                             // forward
      for(let i=0;i<=m;i++) pts[i+1]=step(pts[i],pts[i+1],d[i]);
    }
  }

  /* Root-down, so each bone's parent has already been updated by the time its
     own local angle is worked out. chain[i+1].parent is chain[i] by
     construction; chain[0]'s parent is outside the chain and has not moved.
     Lengths are never touched by IK. */
  let pw = chain[0].parent!=null ? (W.get(chain[0].parent)||{rot:0}).rot : 0;
  for(let i=0;i<=m;i++){
    if(d[i]<1e-6){ pw = pw + (p[chain[i].id].rot||0); continue; }   // undefined direction
    const ang=Math.atan2(pts[i+1].y-pts[i].y, pts[i+1].x-pts[i].x) - phi[i];
    p[chain[i].id].rot = ang - pw;
    pw = ang;
  }
  rigRev++;
}

/* Grabbing an IK target, from wherever it was pressed - bone mode's Hand, the
   skeleton overlay, or Draw mode with the skeleton hidden, which is the whole
   point of the toggle. */
function ikTargetDown(w,b){
  selBone=b.id;
  pushUndo();
  boneGesture={ mode:'bikt', bone:b.id, grab:{x:w.x,y:w.y},
                pose0:clonePose(poseAt(frame)) };
  syncPalette(); render();
}
function boneHandDown(w,hit,W){
  /* The scale handles first, and they belong to the SELECTED bone alone - they
     stand outside its box, so nothing else can want that spot. */
  if(selBone!=null && boneById(selBone)){
    const sw=W.get(selBone);
    if(sw){
      const hs=boneScaleHandles(sw), r=Math.max(6, Math.min(11, sw.len*0.25));
      for(const h of hs) if(dist(h,w)<r){
        pushUndo();
        boneGesture={ mode:'bscale', bone:selBone, grab:{x:w.x,y:w.y},
                      pose0:clonePose(poseAt(frame)) };
        syncPalette(); render(); return;
      }
    }
  }
  if(!hit){ selBone=null; boneGesture=null; syncPalette(); render(); return; }
  selBone=hit.bone.id;
  pushUndo();
  const root = hit.bone.parent==null;
  boneGesture={
    mode: hit.part==='tip' ? 'bfk' : (root ? 'bmove' : 'bik'),
    bone: hit.bone.id, grab:{x:w.x,y:w.y},
    pose0: clonePose(poseAt(frame))       // recomputed from THIS every move
  };
  syncPalette(); render();
}

function boneHandMove(w){
  const g=boneGesture;
  if(!g || g.mode==='draw') return;
  const b=boneById(g.bone); if(!b) return;
  const p=poseAt(frame);
  for(const k of Object.keys(g.pose0)) if(p[k]) p[k]={...g.pose0[k]};   // back to the grab
  rigRev++;

  if(g.mode==='bmove'){
    const v=p[b.id];
    v.x=(g.pose0[b.id].x||0)+(w.x-g.grab.x);
    v.y=(g.pose0[b.id].y||0)+(w.y-g.grab.y);
    rigRev++;
  }else if(g.mode==='bfk'){
    /* ROTATE ONLY - the length is not touched. Dragging the end used to set it
       from the cursor distance, which scaled every shape on the bone as a side
       effect of aiming a limb. Scaling is its own gesture now, on the box.
       The origin does not depend on this bone's own rot or len, only on its
       ancestors, so it is stable through the drag. */
    const W=boneWorld(p), o=W.get(b.id);
    const pw = b.parent!=null ? (W.get(b.parent)||{rot:0}).rot : 0;
    p[b.id].rot = Math.atan2(w.y-o.y, w.x-o.x) - pw;
    rigRev++;
  }else if(g.mode==='bscale'){
    // along the bone's own axis from its pinned origin, so the origin never moves
    const W=boneWorld(p), o=W.get(b.id);
    const c=Math.cos(o.rot), n=Math.sin(o.rot);
    p[b.id].len = Math.max(4, (w.x-o.x)*c + (w.y-o.y)*n);
    rigRev++;
  }else if(g.mode==='bikt'){
    // the drag IS the goal: write it into the pose, then solve to it
    const v=p[b.id]; if(v){ v.ikx=w.x; v.iky=w.y; }
    solveIK(b,w);               // the tip is asked for the target's own position
  }else{
    solveIK(b,w);
  }
  /* This bone's OWN target follows the gesture - it is a handle on the bone and
     would otherwise fight it - and then every other target pulls its chain back
     onto its goal, with this bone held. */
  if(g.mode!=='bikt' && b.ikt) seedIKGoal(b,frame);
  enforceIKTargets(b.id);
  render();
}

/* -------------------------------------------------------- the Skinning tool
   The bone selection and the shape selection are live at the same time and are
   independent, which is the whole trick:

     click a bone   -> select it, AND select every shape it influences
     click a shape  -> select it; if it is bound, move the bone selection to its
                       strongest bone. If it is UNBOUND, leave the bone selection
                       alone - that is what makes Attach reachable, because the
                       way to attach is: click the bone, shift-click the shapes,
                       press Attach. */
let bindFalloff = 90;
const SKIN_MIN_PTS = 24;   // below this a weighted shape hinges instead of bending
const SKIN_MAXBONES = 4;   // per shape, for bones picked by DISTANCE (a guess)
/* ...and a far higher one for bones that actually run THROUGH the shape, which
   are not a guess. A 4-bone cap silently dropped the last bone of any chain
   longer than four - and since equal coverage keeps rig order, the one it threw
   away was always the far END of the chain, so the tip of a long arm or tail sat
   there refusing to follow the bone plainly inside it. What keeps the blend
   local and cheap is the per-POINT cap (SKIN_MAXB), not this one. */
const SKIN_MAXBONES_IN = 12;

function boneSkinDown(w,hit,e){
  boneGesture=null;
  if(hit){
    selBone=hit.bone.id;
    const g=cur().filter(s=>{ const sk=skinOf(s); return sk && sk.bones.indexOf(hit.bone.id)>=0; });
    selected=g[0]||null; extra=g.slice(1);
    syncPalette(); render(); return;
  }
  // knobsOnly above means the bones no longer swallow a press over a small limb
  const SD=splitDX();                 // the artwork is drawn a column to the LEFT
  const s=shapeAt(SD?{x:w.x+SD,y:w.y}:w);
  if(s){
    const add = !!(e && e.shiftKey);
    if(add){
      if(inSel(s)) dropFromSel(s);
      else if(selected) extra.push(s);
      else selected=s;
    }else{ selected=s; extra=[]; }
    /* A bound shape moves the bone selection to its own bone - that is how you
       ask "what is this on?". But NOT while a selection is being built up: a
       shift-click that happened to land on something bound elsewhere used to
       throw away the bone you had just aimed at, and the whole attach had to be
       started again. */
    const sk=skinOf(s);
    if(sk && !add) selBone=sk.bones[0];   // bones[0] is the strongest by construction
  }else if(!e || !e.shiftKey){ clearSel(); }
  syncPalette(); render();
}

/* Which bones actually run THROUGH the shape, by coverage. This is what fixes a
   wide shape with one bone up the middle - a torso's outer points are nearer
   the arm bones than the spine, so a plain nearest-distance bind gave it four
   influences and warped it whenever an arm moved. A bone that passes through a
   shape owns it; one that merely passes nearby does not. */
function bonesInside(s,B){
  const wp=s.pts.map(p=>toWorld(s,p));
  if(wp.length<3) return [];
  buildFill(ctx, wp, s.closed!==false);       // the same path shapeAt hit-tests
  const out=[], N=10;
  for(const b of rig){
    const w=B.get(b.id); if(!w || w.len<1) continue;
    let n=0;
    for(let i=0;i<=N;i++){ const q=boneAt(w,i/N); if(ctx.isPointInPath(q.x,q.y)) n++; }
    if(n) out.push({id:b.id, cov:n/(N+1)});
  }
  out.sort((a,b)=>b.cov-a.cov);
  return out;
}

/* Every bone whose rest position comes within `fall` of the shape, nearest
   first. Measured against the BIND pose, which is the frame the weights belong
   to. A shape out of range of everything still gets the single nearest bone -
   a shape you asked to bind must end up bound. */
function bonesScored(s,B){
  const wp=s.pts.map(p=>toWorld(s,p));
  const scored=[];
  for(const b of rig){
    const w=B.get(b.id); if(!w) continue;
    const t=boneTip(w);
    let d=1e9; for(const p of wp) d=Math.min(d, segDist(p,w,t));
    scored.push({id:b.id,d:d});
  }
  scored.sort((a,b)=>a.d-b.d);
  return scored;
}
function bonesNear(s,B,fall){
  const scored=bonesScored(s,B);
  if(!scored.length) return [];
  const keep=scored.filter(x=>x.d<=fall).slice(0,SKIN_MAXBONES);
  return (keep.length?keep:[scored[0]]).map(x=>x.id);
}

function attachToBone(){
  const g=selGroup();
  if(!g.length || selBone==null || !boneById(selBone)) return;
  pushUndo();
  // falloff 0 is the rigid case: one bone, weight 1, and the blend in worldPts
  // reduces exactly to the closed-form composition.
  for(const s of g) s.skin={bones:[selBone], falloff:0};
  bumpBind(); syncPalette(); render();
}
function bindToSkeleton(){
  const g=selGroup();
  if(!g.length || !rig.length) return;
  pushUndo();
  const B=boneWorld(bindPose);
  for(const s of g){
    /* A reference's pts are its placement box, not an outline, so it cannot be
       point-deformed: one bone, rigid, always. */
    if(s.ref){ const n=bonesNear(s,B,1e9); s.skin={bones:[n[0]], falloff:0}; continue; }

    /* Bones running through the shape win outright, and a single one of those
       makes it RIGID rather than weighted - which is the whole answer for a
       torso, a limb or a head. Only when several bones share the shape is it
       weighted, and then only among those. Nothing inside it at all (a hand
       blob sitting off the end of its bone) falls back to plain distance. */
    /* Relative to the BEST coverage, not an absolute bar. A torso straddles the
       waist, so the two spine bones cover 0.45 each and a flat 0.5 threshold
       rejected both and dropped the shape back to plain distance - which is
       exactly the four-bone mis-bind this test is about. The floor keeps out a
       bone that merely clips a corner. */
    const all=bonesInside(s,B);
    const best=all.length?all[0].cov:0;
    const inside=all.filter(x=>x.cov>=Math.max(0.15, 0.6*best));
    let bones, fall;
    if(inside.length===1){ bones=[inside[0].id]; fall=0; }
    else if(inside.length>1){ bones=inside.slice(0,SKIN_MAXBONES_IN).map(x=>x.id); fall=bindFalloff; }
    else{
      /* Nothing runs through it. That is the END of a limb - a hand, a foot, the
         last taper of a long thin arm - which the bone stops just short of, and
         it is the case Auto-Attach kept getting wrong: at plain distance the
         forearm, the upper arm and half the torso are all "near" a small blob
         out on the end of a chain, so it came back weighted across the lot and
         the tip of the arm went soft. A bone that all but touches the shape -
         within a GRIP measured against the shape's own thin dimension, so it
         scales with the drawing - owns it outright and rigidly, exactly as a
         bone running through it would. */
      const scored=bonesScored(s,B);
      const bb=bbox(s.pts.map(p=>toWorld(s,p)));
      const grip=Math.max(6, 0.5*Math.min(bb.w,bb.h));
      if(scored.length && scored[0].d<=grip){ bones=[scored[0].id]; fall=0; }
      else{ bones=bonesNear(s,B,bindFalloff); fall = bones.length>1 ? bindFalloff : 0; }
    }
    if(!bones.length) continue;

    /* A weighted shape needs points to bend with - a six-point ribbon over
       three bones hinges rather than curving. Densified under the same undo. */
    if(bones.length>1 && s.pts.length<SKIN_MIN_PTS){
      const perim=pathLength(s.pts)+(s.closed!==false?dist(s.pts[s.pts.length-1],s.pts[0]):0);
      s.pts=resample(s.pts, Math.max(2, perim/SKIN_MIN_PTS), s.closed!==false);
    }
    s.skin={bones:bones, falloff:fall};
  }
  bumpBind(); syncPalette(); render();
}
function unbindSelection(){
  const g=selGroup().filter(s=>s.skin);
  if(!g.length) return;
  pushUndo();
  for(const s of g) delete s.skin;
  bumpBind(); syncPalette(); render();
}

const boneLabel = b => (b.name||'Bone')+(b.side?' '+b.side:'');
function syncSkinPanel(){
  if(boneTool!=='bskin') return;
  const g=selGroup();
  const b=selBone!=null?boneById(selBone):null;
  const bound=g.filter(s=>skinOf(s));
  document.getElementById('btnAttachBone').disabled = !(g.length && b);
  document.getElementById('btnBindSkel')  .disabled = !(g.length && rig.length);
  document.getElementById('btnUnbind')    .disabled = !bound.length;

  /* The target bone as a LIST as well as a canvas click. Picking one used to
     mean leaving the tool for the Hand, selecting it there and coming back -
     and any stray click on a bound shape sent you round again. */
  const sel=document.getElementById('skinBone');
  const key=rig.map(x=>x.id+':'+boneLabel(x)).join('|');
  if(sel.dataset.key!==key){
    sel.dataset.key=key;
    sel.innerHTML='<option value="">— none —</option>'+
      rig.map(x=>'<option value="'+x.id+'">'+boneLabel(x)+'</option>').join('');
  }
  sel.value = b ? String(b.id) : '';
  sel.disabled = !rig.length;

  /* The hint depends on the split, which syncBonePanel does not know about:
     with the columns apart a bone takes a press anywhere along it. */
  if(splitDX()) document.getElementById('boneHint').textContent =
    'The artwork is on the left and the skeleton on the right. Click shapes on one side and bones - anywhere along them - on the other, then Attach.';

  const split=document.getElementById('skinSplit');
  split.checked = skinSplit && !!rig.length;
  split.disabled = !rig.length;
  const hb=document.getElementById('btnHideBound');
  hb.textContent = skinHideBound ? 'Show attached shapes' : 'Hide attached shapes';
  hb.classList.toggle('on', skinHideBound);

  const note=document.getElementById('skinNote');
  const hidden = skinHideBound ? ' '+cur().filter(s=>skinOf(s)).length+' attached shape(s) hidden.' : '';
  note.textContent = (
    !rig.length ? 'Draw some bones first.' :
    !g.length   ? (b ? 'Nothing skinned to "'+boneLabel(b)+'" yet. Click shapes to select them.'
                     : 'Click a bone to see what is on it, or a shape to see its bone.') :
    !b          ? g.length+' shape'+(g.length>1?'s':'')+' selected. Click a bone to attach to.' :
    g.length+' shape'+(g.length>1?'s':'')+' → "'+boneLabel(b)+'". '+
      bound.length+' already bound. Rig frame 0, then Duplicate Frame - skinning lives on the shape, and frames hold different shapes.'
  )+hidden;
}
function setSkinSplit(on){
  skinSplit=!!on; splitCache={key:'',dx:0};
  clearSel();                 // the columns move, and a box drawn round the old
  syncPalette(); render();    // position of a shape reads as a bug
}
function setHideBound(on){
  skinHideBound=!!on;
  if(skinHideBound) for(const s of selGroup().slice()) if(skinOf(s)) dropFromSel(s);
  syncPalette(); render();
}

/* What is bound to what. Only in the Skinning tool, and only worth the cost
   there: the points are tinted by their dominant bone and faded by its weight,
   which is the only way to see WHY a bend looks wrong. */
const boneHue = id => { let i=rig.findIndex(b=>b.id===id); return (i<0?0:i)*47 % 360; };
function drawSkinOverlay(){
  if(!boneMode || boneTool!=='bskin') return;
  /* drawFrame suppresses ALL the ordinary selection chrome in bone mode - it
     reads `tool`, which still holds whatever drawing tool you were on, so the
     resize rig and the depth chevrons would come back with it. The Skinning
     tool still has to show what is selected, so it draws its own plain box. */
  /* The whole overlay is artwork-side, so it takes the artwork's offset. The
     one exception is the tether, whose far end is on a bone - and the rig is a
     column the other way, hence the 2*SD below. */
  const SD=splitDX();
  ctx.save();
  if(SD) ctx.translate(-SD,0);
  ctx.setLineDash([6,5]); ctx.lineWidth=1.5; ctx.strokeStyle='#6ea8ff';
  for(const g of selGroup()){
    if(skinHidden(g)) continue;
    const b=bbox(worldPts(g));
    ctx.strokeRect(b.x0-4,b.y0-4,b.w+8,b.h+8);
  }
  ctx.setLineDash([]);
  ctx.restore();
  if(!rig.length) return;
  const W=boneWorld(poseAt(frame));
  ctx.save();
  if(SD) ctx.translate(-SD,0);
  for(const s of cur()){
    const sk=skinOf(s); if(!sk || skinHidden(s)) continue;
    const wp=worldPts(s), ws=skinWeights(s);
    if(sk.bones.length===1){
      ctx.fillStyle='hsla('+boneHue(sk.bones[0])+',75%,52%,.85)';
      for(const p of wp){ ctx.beginPath(); ctx.arc(p.x,p.y,2.1,0,TAU); ctx.fill(); }
    }else{
      for(let i=0;i<wp.length;i++){
        const top=ws[i].slice().sort((a,b)=>b.w-a.w)[0];
        ctx.fillStyle='hsla('+boneHue(top.b)+',75%,52%,'+(0.3+0.6*top.w).toFixed(2)+')';
        ctx.beginPath(); ctx.arc(wp[i].x,wp[i].y,2.4,0,TAU); ctx.fill();
      }
    }
    // a tether to the strongest bone, so a shape's owner reads at a glance
    const c=bbox(wp), w0=W.get(sk.bones[0]);
    if(w0){
      const m=boneAt(w0,0.5);
      ctx.beginPath(); ctx.moveTo(c.cx,c.cy); ctx.lineTo(m.x+2*SD,m.y);
      ctx.setLineDash([2,4]); ctx.lineWidth=1;
      ctx.strokeStyle='hsla('+boneHue(sk.bones[0])+',70%,45%,.5)';
      ctx.stroke(); ctx.setLineDash([]);
    }
  }
  ctx.restore();
}

/* ------------------------------------------------- bone mode pointer input */
/* The scale box round a selected bone. Handles only at the TIP end: a bone's
   origin is decided by its parent and must stay put, so scaling can only ever
   run along the bone from a pinned origin. Rotating is the tip drag. */
const BONE_PAD=9;
function boneCorners(w){
  const h=boneR(w)+BONE_PAD, L=Math.max(w.len,1);
  const c=Math.cos(w.rot), n=Math.sin(w.rot);
  return [{x:-BONE_PAD,y:-h},{x:L+BONE_PAD,y:-h},{x:L+BONE_PAD,y:h},{x:-BONE_PAD,y:h}]
    .map(p=>({x:w.x+p.x*c-p.y*n, y:w.y+p.x*n+p.y*c}));
}
const boneScaleHandles = w => { const c=boneCorners(w); return [c[1],c[2]]; };

function bonePointerDown(w,e){
  const W=boneWorld(poseAt(frame));
  /* In the split view the rig is drawn a column to the right of where it lives,
     so the cursor has to be brought back before it is tested against it - and
     with the columns apart nothing is underneath a bone any more, so it takes a
     press along its whole body again rather than only on its end circles. */
  const SD=splitDX();
  const hit=boneHit(W, SD?{x:w.x-SD,y:w.y}:w, boneTool==='bskin' && !SD);
  if(boneTool==='bdraw'){
    /* The PARENT is whatever is selected, not whatever you pressed on - so a
       chain draws by keeping the last bone selected and dragging again, and the
       dotted line in drawBones says so before you commit. Both ends come off
       the drag, so a child can start clear of its parent. A press that does not
       travel is a plain selection instead, which is how you branch or start a
       new root. */
    boneGesture={ mode:'draw', hit:hit,
                  parent: (selBone!=null && boneById(selBone)) ? selBone : null,
                  from:   w, tip: null };
    return;
  }
  if(boneTool==='bhand'){
    const it=ikTargetHit(W, SD?{x:w.x-SD,y:w.y}:w);
    if(it){ ikTargetDown(w,it); return; }
    boneHandDown(w,hit,W); return;
  }
  boneSkinDown(w,hit,e);
}
function bonePointerMove(w){
  if(!boneGesture) return;
  if(boneGesture.mode==='draw'){ boneGesture.tip=w; return; }
  boneHandMove(w);
}
const MIN_BONE=8;      // a press that does not travel this far is a selection
const BONE_SNAP=14;    // ...and one starting this close to its parent's tip joins it
/* Where a new bone drawn from `from` really starts. Both ends of a new bone
   come off the drag, so a child can hang clear of its parent - but the common
   case is a chain, and a start a few px off the parent's tip leaves the joint
   nearly-shared rather than shared (att slightly off 1, a stray off). Within
   BONE_SNAP it lands exactly on the tip, which is what addBone resolves to
   att 1, off 0. Measured against the BIND pose because that is what addBone
   itself resolves against - Draw Bones edits the rest skeleton. */
function boneDrawStart(parentId, from){
  if(parentId==null || !from) return from;
  const pw=boneWorld(bindPose).get(parentId);
  if(!pw) return from;
  const t=boneTip(pw);
  return dist(from,t)<BONE_SNAP ? t : from;
}
function bonePointerUp(){
  const g=boneGesture; boneGesture=null;
  if(!g) return;
  if(g.mode==='draw'){
    if(!g.tip || dist(g.from,g.tip)<MIN_BONE){        // a click: just select
      selBone = g.hit ? g.hit.bone.id : null;
    }else{
      pushUndo();
      const b=addBone(g.parent, boneDrawStart(g.parent, g.from), g.tip);
      selBone=b.id;                                   // so the chain keeps drawing
    }
  }
  syncPalette(); render();
}

function commitBoneName(){

}
function setBoneSide(side){

  if(next===b.side){ syncBonePanel(); return; }
  pushUndo(); b.side=next; rigRev++;
  syncBonePanel(); render();
}
function setBonePin(on){
  const b=selBone!=null&&boneById(selBone); if(!b || !!b.pinned===!!on) return;
  pushUndo(); b.pinned=!!on; rigRev++;

}
/* An IK target is a marker, not a pose: it changes nothing about how the bone
   solves, so it does not touch rigRev's meaning beyond making the rig redraw. */
function setBoneIkt(on){
  const b=selBone!=null&&boneById(selBone); if(!b || !!b.ikt===!!on) return;
  pushUndo(); b.ikt=!!on;
  /* Seed the goal in EVERY frame, not just this one. A frame left without one
     would fall back to the derived position and so drift with its parents -
     which is exactly the behaviour the explicit goal exists to stop. */
  // no enforce: the seed IS the tip, so turning a target on cannot move anything
  if(b.ikt) seedIKGoalAll(b); else clearIKGoal(b);
  rigRev++;
  syncPalette(); render();
}
