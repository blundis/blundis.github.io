<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drawthing — 2D Character Prototype</title>
<style>
  :root{
    --chrome:#23201e;
    --chrome-2:#2e2a27;
    --chrome-3:#3b3633;
    --ink:#efe9e0;
    --muted:#a49a8f;
    --accent:#6ea8ff;
    --paper:#F7F4EE;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:13px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--chrome);color:var(--ink);
    display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;
  }
  /* the editor row: toolbar | stage | palette. It is the whole of the body now
     that the animation bar floats inside the stage rather than sitting under it. */
  #main{flex:1;display:flex;min-height:0}

  /* ---------- left toolbar ---------- */
  #toolbar{
    width:74px;flex:0 0 74px;background:var(--chrome-2);
    border-right:1px solid #171513;
    display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;
  }
  #toolbar .logo{font-size:10px;letter-spacing:.14em;color:var(--muted);text-align:center;margin-bottom:4px}
  .tool{
    width:52px;height:52px;border-radius:12px;border:1px solid transparent;
    background:var(--chrome-3);color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;position:relative;
    transition:background .12s,border-color .12s,transform .08s;
  }
  .tool:hover{background:#4a4441}
  .tool:active{transform:scale(.95)}
  .tool.active{background:#514a45;border-color:var(--accent);box-shadow:0 0 0 2px rgba(110,168,255,.22)}
  .tool svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tool .kbd{position:absolute;right:4px;bottom:2px;font-size:9px;color:var(--muted)}
  .tip{
    position:absolute;left:62px;white-space:nowrap;background:#111;color:#fff;
    padding:5px 9px;border-radius:6px;font-size:11px;opacity:0;pointer-events:none;
    transition:opacity .12s;z-index:50;
  }
  .tool:hover .tip{opacity:.96}
  .sep{width:36px;height:1px;background:#4a4441;margin:4px 0}

  /* ---------- stage ---------- */
  #stage{flex:1;position:relative;min-width:0;overflow:hidden}
  canvas{display:block;position:absolute;inset:0;touch-action:none}
  #topbar{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;align-items:center;justify-content:center;z-index:10;
    flex-wrap:wrap;max-width:calc(100% - 24px);
    background:rgba(35,32,30,.86);backdrop-filter:blur(6px);
    border:1px solid #171513;border-radius:11px;padding:6px;
  }
  .seg{display:flex;background:#191716;border-radius:8px;padding:2px}
  .seg button{
    border:0;background:transparent;color:var(--muted);padding:6px 16px;
    border-radius:6px;cursor:pointer;font:inherit;font-weight:600;letter-spacing:.03em;
    position:relative;
  }
  .seg button .kbd{position:absolute;right:4px;bottom:1px;font-size:9px;font-weight:400;
    letter-spacing:0;color:var(--muted);opacity:.75;line-height:1}
  .seg button.on{background:var(--chrome-3);color:var(--ink)}
  /* the key badge names how to GET somewhere, so it belongs on the view you are
     NOT standing on - on the active button it is telling you nothing */
  .seg button.on .kbd{display:none}
  /* a sheet has up to six views and their names are long */
  .seg.compact button{padding:6px 9px;letter-spacing:0}
  .btn{
    border:1px solid #4a4441;background:var(--chrome-3);color:var(--ink);
    padding:6px 11px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap;
  }
  .btn:not(:disabled):hover{background:#4a4441}
  .btn:disabled{opacity:.35;cursor:default}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);padding:0 8px;cursor:pointer}

  /* ---------- the animation bar ----------
     One animation per document. A floating pill at the bottom of the stage,
     matching #topbar at the top of it: same chrome, same rounding, same blur.
     It sits INSIDE #stage, so it costs the canvas no height and resize(), the
     ResizeObserver and the self-heal at the top of render() are untouched. */
  #animbar{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;align-items:center;justify-content:center;z-index:10;
    flex-wrap:wrap;max-width:calc(100% - 24px);
    background:rgba(35,32,30,.86);backdrop-filter:blur(6px);
    border:1px solid #171513;border-radius:11px;padding:6px;
  }
  #frames{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:2px;min-width:0;max-width:100%}
  /* the pill is only as wide as its contents, so there is nothing to push apart */
  .aspacer{flex:0 0 auto;width:2px}
  .fchip{
    flex:0 0 auto;position:relative;width:46px;height:34px;border-radius:7px;
    border:1px solid #4a4441;background:var(--chrome-3);color:var(--muted);
    font:inherit;font-size:11px;cursor:pointer;white-space:nowrap;overflow:hidden;
    padding:0 4px;
  }
  .fchip:hover{background:#4a4441}
  .fchip.on{border-color:var(--accent);color:var(--ink);background:#31405c;font-weight:700}
  /* a named frame an expression sheet never drew still gets its chip - the frame
     list has to read straight against the sheet it describes */
  .fchip.empty{border-style:dashed;opacity:.7}
  .fchip .fdel{
    position:absolute;top:0;right:2px;font-size:12px;line-height:1;color:var(--muted);
    opacity:0;padding:1px 2px;
  }
  .fchip:hover .fdel{opacity:.8}
  .fchip .fdel:hover{color:#f0938c}
  /* the greyed ghost frame with the + on it: the only way to add one */
  .fadd{
    flex:0 0 auto;width:46px;height:34px;border-radius:7px;cursor:pointer;
    border:1px dashed #4a4441;background:transparent;color:var(--muted);
    font:inherit;font-size:15px;line-height:1;
  }
  .fadd:hover{border-color:var(--accent);color:var(--ink)}
  #animbar .btn .kbd{font-size:9px;opacity:.7;margin-left:5px}
  /* An eye or mouth object borrows the bar: its frames are named expressions,
     so the chips grow to fit the caption and the bar says whose they are. */
  #frameOwner{flex:0 0 auto;font-size:11px;color:var(--muted);padding:0 2px;max-width:150px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fchip.named{width:auto;min-width:46px;padding:0 9px}

  /* ---------- right palette ---------- */
  #palette{
    width:300px;flex:0 0 300px;background:var(--chrome-2);border-left:1px solid #171513;
    position:relative;z-index:5;
    padding:14px 12px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;
  }
  #palette h3{margin:0;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;font-weight:700}
  .psec{display:flex;flex-direction:column;gap:6px}
  .toolname{font-size:14px;font-weight:700;letter-spacing:.01em}
  .hidden{display:none !important}
  .prow{display:flex;gap:6px}
  .pbtn{
    flex:1;padding:7px 6px;border-radius:8px;border:1px solid #4a4441;
    background:var(--chrome-3);color:var(--ink);font:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .pbtn:hover:not(:disabled){background:#4a4441}
  .pbtn:disabled{opacity:.32;cursor:default}
  .pbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .slider{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
  .slider input{flex:1;accent-color:var(--accent);min-width:0}
  .slider .val{width:26px;text-align:right;font-family:ui-monospace,Consolas,monospace;color:var(--ink)}
  .divider{height:1px;background:#3b3633}
  .swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
  .sw{
    aspect-ratio:1;border-radius:6px;cursor:grab;border:1px solid rgba(0,0,0,.35);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  }
  .sw:active{cursor:grabbing}
  /* the "none" colour - a white chip with a red X. Dropped in a slot it turns
     that part of the shape off entirely. */
  .xnone{background:#fff !important;position:relative;overflow:hidden}
  .xnone::before,.xnone::after{
    content:'';position:absolute;left:8%;right:8%;top:calc(50% - 1px);height:2px;
    background:#e0403a;border-radius:1px;
  }
  .xnone::before{transform:rotate(45deg)}
  .xnone::after{transform:rotate(-45deg)}
  /* ---------- eyes & mouths library ---------- */
  #paintPanel,#libPanel{display:flex;flex-direction:column;gap:11px;min-height:0}
  #libTabs button{flex:1}
  #libSearch{
    background:#191716;border:1px solid #4a4441;border-radius:8px;color:var(--ink);
    font:inherit;padding:7px 9px;outline:none;
  }
  #libSearch:focus{border-color:var(--accent)}
  #libGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
  #libGrid .gthumb{border-radius:9px}
  #libGrid .gcard.on .gthumb{border-color:var(--accent);box-shadow:0 0 0 2px rgba(110,168,255,.28)}
  #libNote{color:var(--muted);font-size:11px;line-height:1.5}
  /* the tag cloud: the five most used tags of whatever tab you are on */
  #libTags{display:flex;flex-wrap:wrap;gap:4px}
  .tagbtn{
    border:1px solid #4a4441;background:#191716;color:var(--muted);
    border-radius:999px;padding:3px 9px;font:inherit;font-size:11px;cursor:pointer;
  }
  .tagbtn:hover{background:#4a4441;color:var(--ink)}
  .tagbtn.on{background:var(--accent);border-color:var(--accent);color:#12100f;font-weight:600}
  .gtags{color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* the fold: what this drawing already references, and whether it has moved on */
  #usedList{display:flex;flex-direction:column;gap:6px}
  .urow{
    display:flex;gap:8px;align-items:flex-start;cursor:pointer;
    border:1px solid transparent;border-radius:9px;padding:4px;
  }
  .urow:hover{border-color:#4a4441;background:#191716}
  .urow .gthumb{flex:0 0 52px;width:52px;height:52px;border-radius:8px}
  .uinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .utitle{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .uby{color:var(--muted);font-size:10.5px}
  .ustale{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:11px;font-weight:600;margin-top:2px}
  .ustale .pbtn{flex:0 0 auto;padding:3px 9px;font-size:11px}
  /* the pose picker for a single selected reference */
  #poses{display:flex;flex-wrap:wrap;gap:5px}
  #poses .pbtn{flex:0 1 auto;padding:6px 9px;font-size:12px}
  #poses .pbtn.on{background:var(--accent);border-color:var(--accent);color:#12100f;font-weight:600}
  #poseTitle{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* an imported reference owns no colours - the sheet it came from does */
  .slots.locked{opacity:.3;pointer-events:none}
  .colhead{display:flex;align-items:center;gap:6px}
  .colhead h3{flex:1;min-width:0}
  .colhead h3.right{text-align:right}
  .slotcols{display:flex;gap:6px}
  .slots{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
  .slot{
    display:flex;align-items:center;gap:9px;padding:6px;border-radius:9px;cursor:grab;
    min-width:0;overflow:hidden;
    background:#191716;border:1px dashed #4a4441;transition:border-color .12s,background .12s;
  }
  .slot.hot{border-color:var(--accent);background:#20262f}
  .slot .chip{width:28px;height:28px;border-radius:7px;border:1px solid rgba(0,0,0,.4);flex:0 0 28px}
  .slot .lbl{font-weight:700;font-size:12px}
  .slot .hex{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
  /* ---------- modal ---------- */
  #modalWrap{
    /* ABOVE .screen (z-index 300): the gallery's delete prompt and the new-drawing
       kind picker are both opened from an overlay that would otherwise cover them. */
    position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;
    background:rgba(12,10,9,.55);backdrop-filter:blur(2px);
  }
  #modalCard{
    width:340px;background:var(--chrome-2);border:1px solid #171513;border-radius:14px;
    padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.55);
  }
  #modalCard h2{margin:0 0 8px;font-size:15px;font-weight:700;letter-spacing:.01em}
  #modalCard p{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.5}
  #modalInput{
    display:block;width:100%;box-sizing:border-box;margin:0 0 14px;
    background:#191716;border:1px solid #4a4441;border-radius:8px;color:var(--ink);
    font:inherit;padding:9px 10px;outline:none;
  }
  #modalInput:focus{border-color:var(--accent)}
  .mrow{display:flex;gap:7px}
  .mrow .btn{flex:1;padding:8px 6px;font-weight:600}
  .mrow .btn.primary{border-color:var(--accent);background:#31405c;color:#e7efff}
  .mrow .btn.primary:not(:disabled):hover{background:#3b4d70}
  .mrow .btn.danger{border-color:#a8443e;background:#5c3230;color:#ffe9e7}
  .mrow .btn.danger:hover{background:#70403c}

  /* ---------- login / gallery screens ----------
     Both sit OVER the editor rather than hiding it: #stage's ResizeObserver
     would otherwise measure a zero-width canvas and the drawing would be
     resized away while the gallery was up. */
  .screen{position:fixed;inset:0;z-index:300;background:var(--chrome);
    display:flex;flex-direction:column;overflow:hidden}
  #loginScreen{align-items:center;justify-content:center}
  #loginCard{width:320px;background:var(--chrome-2);border:1px solid #171513;border-radius:14px;
    padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px}
  #loginCard h1{margin:0;font-size:17px;letter-spacing:.02em}
  #loginCard p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
  #loginCard input{
    background:#191716;border:1px solid #4a4441;border-radius:8px;color:var(--ink);
    font:inherit;padding:9px 10px;outline:none;
  }
  #loginCard input:focus{border-color:var(--accent)}
  #loginCard input:disabled{opacity:.5}
  #loginErr{color:#f0938c;font-size:11.5px;min-height:14px}
  /* The name being signed in to, shown once the flow has moved past it. */
  #loginWho{margin:0;color:var(--ink);font-size:12.5px}
  #loginWho b{color:var(--accent);font-weight:600}
  #loginBack{background:none;border:0;color:var(--muted);font:inherit;font-size:11.5px;
    text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}
  #loginBack:hover{color:var(--ink)}

  #galleryBar{
    display:flex;align-items:center;gap:10px;padding:12px 16px;
    background:var(--chrome-2);border-bottom:1px solid #171513;flex:0 0 auto;
  }
  #galleryBar h1{margin:0;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  #galleryWho{flex:1;min-width:0;color:var(--ink);font-size:12px}
  #galleryGrid{
    flex:1;overflow-y:auto;padding:16px;display:grid;gap:14px;align-content:start;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  }
  .gnote{color:var(--muted);font-size:12px;grid-column:1/-1}
  .gcard{position:relative;cursor:pointer}
  .gthumb{
    aspect-ratio:1;border-radius:12px;background:var(--paper);border:1px solid #171513;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:border-color .12s,transform .08s;position:relative;
  }
  .gcard:hover .gthumb{border-color:var(--accent)}
  .gcard:active .gthumb{transform:scale(.985)}
  .gthumb img{max-width:88%;max-height:88%;display:block;image-rendering:auto}
  .gthumb .empty{color:#b6ad9e;font-size:11px}
  /* the new-canvas tile - first cell of the grid, always */
  .gcard.new .gthumb{background:#2a2724;border:1px dashed #4a4441;color:var(--muted)}
  .gcard.new svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
  .gmeta{margin-top:6px;font-size:11px;color:var(--muted);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* a soft-deleted drawing, admin view only: struck through, never removed */
  .gcard.deleted .gthumb{opacity:.45}
  .gcard.deleted .gthumb::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(to bottom right,transparent calc(50% - 1.5px),
      #e0403a calc(50% - 1.5px),#e0403a calc(50% + 1.5px),transparent calc(50% + 1.5px));
  }
  .gcard.deleted .gmeta{color:#b0736e}
  .gdel{
    position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:8px;
    border:1px solid #171513;background:rgba(24,21,19,.86);color:#f0d6d3;cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s,background .12s;
  }
  .gdel svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .gcard:hover .gdel{opacity:1}
  .gdel:hover{background:#7a3a35}
  /* the save button flashes green once the row has landed */
  #btnSave.ok{background:#2f5c3a;border-color:#4e9c62}
  /* ...and carries an amber dot for as long as there is work not in the gallery */
  #btnSave.dirty::after{
    content:'';position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;
    background:#e0a33a;box-shadow:0 0 0 2px var(--chrome-3);
  }
  /* published is a state of the drawing, not a tool, so it gets its own tint */
  #btnPublish.on{background:#2f4a5c;border-color:#4e88c9}

  /* ---------- editing an imported object in place ----------
     A third floating pill, between the top bar and the animation bar, up only
     while editStack has something on it. */
  #editbar{
    position:absolute;top:12px;left:12px;z-index:11;
    display:flex;gap:8px;align-items:center;
    background:rgba(60,44,30,.9);backdrop-filter:blur(6px);
    border:1px solid #7a5a32;border-radius:11px;padding:6px 6px 6px 11px;
  }
  #editWho{font-size:12px;color:var(--ink);white-space:nowrap}
  #editWho b{color:#e8b877}

  /* ---------- the Make Object dropdown ---------- */
  #mkObjWrap{position:relative}
  #mkObjMenu{
    position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;
    display:flex;flex-direction:column;gap:4px;padding:5px;
    background:var(--chrome-2);border:1px solid #4a4441;border-radius:9px;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
  }

  /* ---------- the metadata box ---------- */
  #metaSec .mrow2{display:flex;flex-direction:column;gap:3px}
  #metaSec label.cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  #metaSec input[type=text]{
    background:#191716;border:1px solid #4a4441;border-radius:7px;color:var(--ink);
    font:inherit;font-size:12px;padding:6px 8px;outline:none;min-width:0;
  }
  #metaSec input[type=text]:focus{border-color:var(--accent)}
  #metaSec input[type=text]:disabled{opacity:.5;cursor:default}
  #metaFacts{font-size:11px;color:var(--muted);line-height:1.6}
  #ghost{
    position:fixed;width:30px;height:30px;border-radius:8px;pointer-events:none;z-index:999;
    border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.5);transform:translate(-50%,-50%);display:none;
  }
</style>
</head>
<body>

<!-- #main is the editor row; the animation bar sits under it as a real layout
     row, so #stage genuinely shrinks and resize() needs nothing new. -->
<div id="main">
<div id="toolbar">
  <!-- The gallery is not a tool and must NOT carry data-tool, or setTool's
       .tool[data-tool] sweep fights it for the active class. -->
  <button class="tool" id="btnGallery">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg>
    <span class="tip">Gallery</span>
  </button>

  <div class="sep"></div>

  <div class="logo">TOOLS</div>

  <button class="tool active" data-tool="brush">
    <svg viewBox="0 0 24 24"><path d="M4 20c0-3 2-4 3.5-4.5"/><path d="M8.5 15.5c-2 .8-3 2.2-3.2 4.2 2.2-.2 3.6-1.2 4.4-3.2"/><path d="M9.7 16.5 7.5 14.3 16 5.8a1.6 1.6 0 0 1 2.2 0l.5.5a1.6 1.6 0 0 1 0 2.2Z"/></svg>
    <span class="kbd">1</span><span class="tip">The Brush</span>
  </button>

  <button class="tool" data-tool="smear">
    <svg viewBox="0 0 24 24"><path d="M4 17c3.2 0 4.2-3.4 7-3.4S16.6 17 20 17"/><path d="M6 12.2c2.4 0 3.2-2.4 5.2-2.4s2.9 2.4 5 2.4"/><path d="M8.5 7.6c1.6 0 2.1-1.6 3.5-1.6s1.9 1.6 3.4 1.6"/></svg>
    <span class="kbd">2</span><span class="tip">The Smear</span>
  </button>

  <button class="tool" data-tool="eraser">

<script>
/* =========================================================================
