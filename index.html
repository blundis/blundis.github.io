});

/* A colour drag starts from a swatch or from a slot - dragging between the two
   slot columns is how a colour moves between the defaults and the selection. */
function startColorDrag(hex,fromSlot,e){
  dragColor=hex; dragFrom=fromSlot;
  ghost.classList.toggle('xnone',hex===NONE);
  ghost.style.background = hex===NONE ? '#fff' : hex;
  ghost.style.display='block';
  ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
}

document.getElementById('palette').addEventListener('pointerdown',e=>{
  const sl=e.target.closest && e.target.closest('.slot');
  if(!sl) return;
  e.preventDefault();
  startColorDrag(slotColor(sl),sl,e);
});

window.addEventListener('pointermove',e=>{
  if(!dragColor) return;
  ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
  document.querySelectorAll('.slot').forEach(sl=>sl.classList.remove('hot'));
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const slot=el && el.closest('.slot');
  if(slot) slot.classList.add('hot');
});

window.addEventListener('pointerup',e=>{
  if(!dragColor) return;
  ghost.style.display='none';
  document.querySelectorAll('.slot').forEach(sl=>sl.classList.remove('hot'));
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const slot=el && el.closest('.slot');
  if(slot && slot!==dragFrom) applyColor(slot.dataset.slot, dragColor, slot.dataset.target);
  dragColor=null; dragFrom=null;
});

// Left column is the default for the next shape drawn, right column is the
// selection. A drop hits one or the other, never both - that is what makes
// dragging between the columns mean anything.
function slotColor(sl){
  return (sl.dataset.target==='sel' && selected ? selected.colors : current)[sl.dataset.slot];
}
function applyColor(which,hex,target){
  pushUndo();
  if(target==='sel'){ for(const g of selGroup()) g.colors[which]=hex; }
  else current[which]=hex;
  syncPalette();
}

const TOOL_NAMES={brush:'Brush', smear:'Smear', eraser:'Eraser', hand:'Hand of Judgement'};
const TOOL_PANELS={brush:'optBrush', smear:'optSmear', eraser:'optEraser', hand:'optHand'};

/* The sidebar is always open now - it just changes what it offers. */
function syncPalette(){
  document.getElementById('toolName').textContent=TOOL_NAMES[tool];
  document.querySelectorAll('.toolopt').forEach(el=>el.classList.add('hidden'));
  document.getElementById(TOOL_PANELS[tool]).classList.remove('hidden');

  // The selection block only exists when there is a selection to act on.
  const grp=selGroup(), has=!!selected;
  document.getElementById('selSec').classList.toggle('hidden',!has);
  document.getElementById('selDiv').classList.toggle('hidden',!has);
  document.getElementById('selSlots').classList.toggle('hidden',!has);
  document.getElementById('selColHead').classList.toggle('hidden',!has);

  syncCopyBtn();

  document.querySelectorAll('.slot').forEach(sl=>{
    const c=slotColor(sl);
    const chip=sl.querySelector('.chip');
    chip.classList.toggle('xnone', c===NONE);
    chip.style.background = c===NONE ? '#fff' : c;
    sl.querySelector('.hex').textContent = c===NONE ? 'NONE' : c.toUpperCase();
  });
}

/* ------------------------------------------- flip, duplicate, copy, paste */
/* Mirroring in SCREEN space, not the shape's own axes: mirror . rotate(r)
   equals rotate(-r) . mirror, so negate the rotation and one scale, then put
   the centre back where it was. */
function flipSelected(axis){
  const grp=selGroup();
  if(!grp.length) return;
  pushUndo();
  // A group mirrors about the GROUP's screen box, so the shapes swap sides as
  // well as turning over - flipping each about its own centre leaves the
  // arrangement unmirrored, which does not read as a flip at all.
  const gb=bbox(grp.flatMap(worldPts));
  for(const s of grp){
    // Pin the on-screen bounding box, not the local centre - on a rotated shape
    // those are different points and only the former leaves the shape looking put.
    const before=bbox(worldPts(s));
    s.rot=-s.rot;
    if(axis==='h') s.sx=-s.sx; else s.sy=-s.sy;
    const after=bbox(worldPts(s));
    // where it should land: its own spot, reflected across the group axis
    const tx = axis==='h' ? 2*gb.cx-before.cx : before.cx;
    const ty = axis==='v' ? 2*gb.cy-before.cy : before.cy;
    s.x+=tx-after.cx; s.y+=ty-after.cy;
  }
}

let clipboard=null;
function cloneInto(src,dx,dy){
  const c=JSON.parse(JSON.stringify(src));
  c.id=uid++; c.x+=dx; c.y+=dy;
  views[view].push(c);
  selected=c; extra=[]; syncPalette();
  return c;
}
function duplicateSelected(){
  if(!selected) return;
  pushUndo();
  const made=selGroup().map(g=>cloneInto(g,24,24));
  selected=made[0]; extra=made.slice(1); syncPalette();
}
function copySelected(){ if(selected) clipboard=JSON.stringify(selected); }
function pasteClipboard(){
  if(!clipboard) return;
  pushUndo();
  cloneInto(JSON.parse(clipboard),24,24);   // pastes into whichever view is showing
}

document.getElementById('flipH').addEventListener('click',()=>flipSelected('h'));
document.getElementById('flipV').addEventListener('click',()=>flipSelected('v'));
document.getElementById('dupBtn').addEventListener('click',duplicateSelected);
document.getElementById('delBtn').addEventListener('click',()=>deleteSelected());

/* ------------------------------------------------------- tool option sliders */
function bindSlider(id,valId,set){
  const el=document.getElementById(id), out=document.getElementById(valId);
  const upd=()=>{ set(parseFloat(el.value)); out.textContent=el.value; };
  el.addEventListener('input',upd); upd();
}
bindSlider('optSnap','optSnapv', v=>closeFrac=v/100);
bindSlider('optSmearR','optSmearRv', v=>smearR=v);
bindSlider('optEraserR','optEraserRv',v=>eraserR=v);
bindSlider('optBrushW','optBrushWv', v=>{
  brushW=v;
  for(const g of selGroup()) g.lw=v;        // retarget the whole selection too
});

/* ============================================================== chrome UI */
function setTool(t){
  tool=t;
  document.querySelectorAll('.tool[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
  // Selection survives a tool change - that is what lets Smear and Eraser
  // reach a shape sitting underneath another one.
  cv.style.cursor = t==='hand' ? 'default' : 'crosshair';
  syncPalette();
}
document.querySelectorAll('.tool[data-tool]').forEach(b=>
  b.addEventListener('click',()=>setTool(b.dataset.tool)));

function setView(v){
  view=v; selected=null;
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  syncPalette();
}
document.querySelectorAll('#viewSeg button').forEach(b=>
  b.addEventListener('click',()=>setView(b.dataset.view)));

document.getElementById('onion').addEventListener('change',e=>onionOn=e.target.checked);

/* ---------------------------------------- copy this view onto the other side */
const otherView = () => view==='front' ? 'back' : 'front';
// With a shape selected the button acts on that one shape instead of the view.
const copySource = () => selected ? selGroup() : views[view];
const copyLabel  = () => (selected ? (extra.length ? 'Copy '+selGroup().length+' selected to '
                                                   : 'Copy selected to ') : 'Copy to ') +
                         (otherView()==='back' ? 'Back' : 'Front');
function syncCopyBtn(){
  document.getElementById('btnCopyView').textContent = copyLabel();
}

function copyViewTo(mode){                  // 'replace' | 'add'
  const dst=otherView();
  pushUndo();
  const clones=copySource().map(s=>{
    const c=JSON.parse(JSON.stringify(s)); c.id=uid++; return c;
  });
  if(mode==='replace') views[dst]=clones; else views[dst].push(...clones);
}

const modalWrap=document.getElementById('modalWrap');
let modalOpen=false;
function closeModal(){ modalOpen=false; modalWrap.classList.add('hidden'); }
function openCopyModal(){
  const dst=otherView(), n=views[dst].length, m=copySource().length;
  document.getElementById('modalTitle').textContent=copyLabel();
  document.getElementById('modalBody').textContent=
    'The '+dst+' view already has '+n+(n===1?' shape':' shapes')+'. Replace '+(n===1?'it':'them')+
    ' with '+(selected?(m>1?'the '+m+' selected shapes':'the selected shape'):'this view')+', or '+
    (selected&&m===1?'add it on top':'add '+m+' more on top')+'?';
  modalOpen=true; modalWrap.classList.remove('hidden');
}

document.getElementById('btnCopyView').addEventListener('click',()=>{
  if(!copySource().length) return;
  if(views[otherView()].length) openCopyModal();
  else copyViewTo('replace');
});
document.getElementById('mReplace').addEventListener('click',()=>{ closeModal(); copyViewTo('replace'); });
document.getElementById('mAdd')    .addEventListener('click',()=>{ closeModal(); copyViewTo('add'); });
document.getElementById('mCancel') .addEventListener('click',closeModal);
modalWrap.addEventListener('pointerdown',e=>{ if(e.target===modalWrap) closeModal(); });

function setShading(m){
  shading=m;
  document.querySelectorAll('#shadeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.shade===m));
}
document.querySelectorAll('#shadeSeg button').forEach(b=>
  b.addEventListener('click',()=>setShading(b.dataset.shade)));

document.getElementById('btnUndo').addEventListener('click',undo);
document.getElementById('btnRedo').addEventListener('click',redo);

/* ------------------------------------------------------------ depth order */
/* Shapes are drawn in array order, so raising one is a swap towards the end of
   the list - but a swap PER SHAPE made this miserable: getting an eye out from
   under a fringe meant clicking past every unrelated shape in the drawing.
   There are no layers, and adding them would be a second ordering to keep
   straight; instead a level is simply "everything that does not overlap". A
   raise passes every shape the selection does not touch for free and stops on
   the first one it does, so the click count is the number of shapes actually
   in front of it - usually one. Nothing left to overlap means it is already on
   top of everything it could hide behind, and the chevron greys out.
   Overlap is world bbox against world bbox, the same rough test the lasso uses;
   the stroke straddles the path, so half an outline width is allowed for. */
function boxesOverlap(a,b){
  return a.x1>=b.x0 && b.x1>=a.x0 && a.y1>=b.y0 && b.y1>=a.y0;
}
function padBox(s){
  const b=bbox(worldPts(s)), p=s.lw/2;
  return {x0:b.x0-p, y0:b.y0-p, x1:b.x1+p, y1:b.y1+p};
}
/* Index of the non-member the selection would have to hop next, or -1. The
   whole selection moves as one body, so the test is against the group's boxes
   and the scan starts at whichever end of it is nearest the direction of
   travel - a buried member is reason enough for the group to come forward. */
function depthTarget(grp,dir){
  const list=views[view], inG=new Set(grp);
  const boxes=grp.map(padBox);
  let lo=-1, hi=-1;
  for(let i=0;i<list.length;i++) if(inG.has(list[i])){ if(lo<0) lo=i; hi=i; }
  if(lo<0) return -1;
  const hits=i => !inG.has(list[i]) && boxes.some(b=>boxesOverlap(b,padBox(list[i])));
  if(dir>0){ for(let i=lo+1;i<list.length;i++) if(hits(i)) return i; }
  else     { for(let i=hi-1;i>=0;i--)          if(hits(i)) return i; }
  return -1;
}
function canReorder(grp,dir){ return depthTarget(grp,dir)>=0; }
function reorderSel(dir){
  const grp=selGroup();
  const t=grp.length ? depthTarget(grp,dir) : -1;
  if(t<0) return;
  pushUndo();
  const list=views[view], inG=new Set(grp), mark=list[t];
  /* Lift the members out and put them back as one block on the far side of the
     shape they stopped at, so the group stays contiguous and keeps its own
     internal order. The block also never lands lower than the members already
     were (nor higher, going down), so a raise cannot drop half the selection
     behind something it was in front of. Rewritten in place - the array itself
     is held elsewhere. */
  let lo=list.length, hi=-1, below=0, above=0;
  list.forEach((s,i)=>{ if(inG.has(s)){ lo=Math.min(lo,i); hi=i; } });
  list.forEach((s,i)=>{ if(!inG.has(s)){ if(i<hi) below++; if(i<lo) above++; } });
  const block=list.filter(s=>inG.has(s)), rest=list.filter(s=>!inG.has(s));
  const m=rest.indexOf(mark);
  rest.splice(dir>0 ? Math.max(m+1,below) : Math.min(m,above), 0, ...block);
  list.length=0; list.push(...rest);
}

function deleteSelected(){
  if(!selected) return;
  pushUndo();
  for(const g of selGroup()){
    const i=views[view].indexOf(g);
    if(i>=0) views[view].splice(i,1);
  }
  clearSel(); syncPalette();
}
document.getElementById('btnDelete').addEventListener('click',deleteSelected);

/* ------------------------------------------------------------- export PNG
   Renders the current view alone - no paper, no onion skin, no selection
   chrome - onto the main canvas, resized to exactly the shapes' world bbox,
   and hands the result over as a download. drawShape only ever paints
   through the module-level ctx, so the cheapest way to point it somewhere
   else is to retarget the canvas we already have and put it back after. */
const EXPORT_SCALE = 2;
function exportPNG(){
  const shapes = views[view].filter(s=>s.pts.length>=3);
  if(!shapes.length) return;

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const s of shapes){
    const b=bbox(worldPts(s)), pad=s.lw/2+1;   // the outline straddles the path
    if(b.x0-pad<x0) x0=b.x0-pad;  if(b.y0-pad<y0) y0=b.y0-pad;
    if(b.x1+pad>x1) x1=b.x1+pad;  if(b.y1+pad>y1) y1=b.y1+pad;
  }
  const w=Math.max(1,Math.ceil(x1-x0)), h=Math.max(1,Math.ceil(y1-y0));


  cv.width=Math.round(w*EXPORT_SCALE); cv.height=Math.round(h*EXPORT_SCALE);
  ctx.setTransform(EXPORT_SCALE,0,0,EXPORT_SCALE,-x0*EXPORT_SCALE,-y0*EXPORT_SCALE);
  ctx.clearRect(x0,y0,w,h);                   // transparent, no paper
  for(const s of shapes) drawShape(s);
  const url=cv.toDataURL('image/png');

  // drawShape paints no selection chrome, so nothing needs hiding for the export
  resize(); render();                         // put the canvas back before the frame lands

  const a=document.createElement('a');
  a.href=url; a.download='charactersmith-'+view+'.png';
  a.click();
}
document.getElementById('btnExport').addEventListener('click',exportPNG);

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(modalOpen){ if(e.key==='Escape') closeModal(); e.preventDefault(); return; }
  if(e.ctrlKey||e.metaKey){                 // shortcuts first, so "c" is not a tool key
    if(k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
    else if(k==='y'){ e.preventDefault(); redo(); }
    else if(k==='c'){ e.preventDefault(); copySelected(); }
    else if(k==='v'){ e.preventDefault(); pasteClipboard(); }
    else if(k==='d'){ e.preventDefault(); duplicateSelected(); }
    return;
  }
  if(e.target.tagName==='INPUT') return;    // let the sliders keep their arrow keys
  if(k==='q') setView(view==='front'?'back':'front');
  else if(e.key==='1') setTool('brush');
  else if(e.key==='2') setTool('smear');
  else if(e.key==='3') setTool('eraser');
  else if(e.key==='4') setTool('hand');
  else if(k==='h') setShading(shading==='hatch'?'gradient':'hatch');
  else if(e.key==='Delete'||e.key==='Backspace') deleteSelected();
  else if(e.key==='ArrowUp'){   e.preventDefault(); reorderSel( 1); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); reorderSel(-1); }
});

/* ================================================================== boot */
resize();
setTool('brush');
syncHistory();
syncPalette();
render();
