/* ------------------------------------------------------------- export PNG
   Renders the current view alone - no paper, no onion skin, no selection
   chrome - onto the main canvas, resized to exactly the shapes' world bbox,
   and hands the result over as a download. drawShape only ever paints
   through the module-level ctx, so the cheapest way to point it somewhere
   else is to retarget the canvas we already have and put it back after. */
const EXPORT_SCALE = 2;

/* Draws one frame of one view alone, cropped to its shapes, and hands back a
   data URL. opts: {scale} outright, or {maxDim} to fit the longest side (never
   past 2x - a thumbnail of a tiny drawing has nothing to gain from being blown
   up), and {frame} for which frame (default the current one).
   Everything here is synchronous, so the swapped-out canvas never reaches a
   frame; returns null when the frame is empty. */
function renderViewToDataURL(vName, opts){
  const fi = (opts && opts.frame!=null) ? opts.frame : frame;
  /* {shapes} draws that list instead of a view's frame - Make Object wants a
     thumbnail of just the selection, which is not a frame of anything yet. */
  const from = (opts && opts.shapes) || ((views[vName]||[])[fi]||[]);
  const shapes = from.filter(s=>s.pts.length>=3);
  if(!shapes.length) return null;

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const s of shapes){
    const b=bbox(worldPts(s)), pad=s.lw/2+1;   // the outline straddles the path
    if(b.x0-pad<x0) x0=b.x0-pad;  if(b.y0-pad<y0) y0=b.y0-pad;
    if(b.x1+pad>x1) x1=b.x1+pad;  if(b.y1+pad>y1) y1=b.y1+pad;
  }
  const w=Math.max(1,Math.ceil(x1-x0)), h=Math.max(1,Math.ceil(y1-y0));

  const o = opts||{};
  const scale = o.maxDim ? Math.min(2, o.maxDim/Math.max(w,h)) : (o.scale||1);

  cv.width=Math.max(1,Math.round(w*scale)); cv.height=Math.max(1,Math.round(h*scale));
  ctx.setTransform(scale,0,0,scale,-x0*scale,-y0*scale);
  ctx.clearRect(x0,y0,w,h);                   // transparent, no paper
  for(const s of shapes) drawShape(s,{pframe:fi});
  const url=cv.toDataURL('image/png');

  // drawShape paints no selection chrome, so nothing needs hiding for the export
  resize(); render();                         // put the canvas back before the frame lands
  return url;
}

function exportPNG(){
  const url = renderViewToDataURL(view,{scale:EXPORT_SCALE});
  if(!url) return;
  const a=document.createElement('a');
  a.href=url; a.download='drawthing-'+view+'-'+frame+'.png';
  a.click();
}
document.getElementById('btnExport').addEventListener('click',exportPNG);

/* ==================================================== the scene format (v1)
   What gets stored, and what a game that does not exist yet will have to read.
   It is deliberately a superset of the undo snapshot: that one only ever has to
   survive a round trip inside a running editor, so it can lean on every global
   staying put. A saved scene cannot, so it also carries

     - the stage size the coordinates were authored against. World units are CSS
       pixels and there is no camera, so without this the numbers have no scale.
     - the lighting and hatch parameters, which live in module consts and are the
       whole of how a shape is shaded.
     - a version, because this format WILL change. `format` identifies it,
       `version` gates it, and migrateScene is the seam later versions step
       through.

   The `editor` block is convenience only - a game ignores it.

   v2 added three things on top of v1, which knew only a character's two views:

     - `kind`: the document kind.
     - `viewOrder`: the view keys in order.
     - `refs`: sheets imported into a character.

   v3 is the generalisation of all that. There are four kinds now, and every one
   of them animates:

     - `views[key]` is an ARRAY OF FRAMES, each frame a shape list. Every view
       holds the same number of frames - one animation per document, not one per
       view - so views.front[2] and views.back[2] are two sides of one moment.
       v2's per-expression views of an eye or mouth sheet became exactly this:
       one view, one frame per expression.
     - `frameNames`: the frame labels for a kind whose frames are fixed (eyes,
       mouths), or null when they are just numbered steps.
     - `frameCount`: how many, so a reader does not have to trust the arrays.
     - `render.fps`: how fast the editor played it back.
     - `refs` entries hold the same shape as a document - `views`, `frameNames`,
       `frameCount` - plus the `tags` and `author` the Library shows, and their
       OWN `refs`, because an item may import another item.
     - a shape's `ref` carries `frame` (which frame of the reference to draw)
       and `follow` (draw whatever frame the parent is on instead, wrapping).

   Shape fields (see also the table in CLAUDE.md): pts are LOCAL, centred on the
   shape's own bbox centre at creation; x/y/rot/sx/sy place them (sx/sy may be
   negative - that is how a flip is stored); lw straddles the path, so bounds
   need lw/2; closed:false means the outline is stroked only along the drawn run
   while the fill still closes with a straight chord; a colour of "none" means
   do not render that part at all. */
const SCENE_FORMAT  = 'charactersmith.scene';
const SCENE_VERSION = 3;

function sceneToJSON(){
  const r = cv.getBoundingClientRect();
  const vs={};
  for(const n of viewNames) vs[n]=JSON.parse(JSON.stringify(views[n]||[]));
  // Only the references the document still uses: an import that has since been
  // undone or deleted leaves an entry behind in refLib, and there is no reason
  // to carry it into the row. Transitive, because an item can hold references
  // of its own and dropping those would leave a hole in the middle of one.
  const refs={};
  for(const k of usedRefKeys()) if(refLib.has(k)) refs[k]=refLib.get(k);
  return {
    format: SCENE_FORMAT,
    version: SCENE_VERSION,
    createdWith: 'charactersmith-proto',
    kind: docKind,                            // 'character' | 'item' | 'eyes' | 'mouths'
    canvas: { width:Math.round(r.width), height:Math.round(r.height) },
    viewOrder: viewNames.slice(),
    frameNames: (DOC_KINDS[docKind].frameNames||null),
    frameCount: frameCount(),
    views: vs,                                // views[key][frame]; array order IS draw order
    refs: refs,                               // imported drawings, one entry each
    render: {
      shading: shading,                       // 'hatch' | 'gradient'
      light: { from:{x:LIGHT_FROM.x,y:LIGHT_FROM.y}, to:{x:LIGHT_TO.x,y:LIGHT_TO.y},
               terminator:TERMINATOR, softness:SOFTNESS, dist:LIGHT_DIST },
      hatch: { gap:HATCH_GAP, weight:HATCH_WEIGHT, angleDeg:45 },
      fps: FPS
    },
    editor: {
      activeView: view,
      activeFrame: frame,
      defaultColors: { outline:current.outline, fill:current.fill, shadow:current.shadow },
      brushW: brushW
    }
  };
}

function migrateScene(o){
  if(!o || o.format!==SCENE_FORMAT) throw new Error('Not a Drawthing scene.');
  if(o.version>SCENE_VERSION)
    throw new Error('This scene is version '+o.version+', the editor only reads up to '+SCENE_VERSION+'.');
  if(o.version<2){                            // v1 knew only the two character views
    o.kind='character';
    o.viewOrder=['front','back'];
    o.refs={};
    o.version=2;
  }
  if(o.version<3){
    /* v2's views held shape lists. v3's hold frames. For a character that is a
       wrap - one frame, the drawing as it was. For an eye or a mouth sheet the
       expression VIEWS were the frames all along, so they fold into one view in
       the order the sheet declared them, and their old view labels become the
       frame names. */
    const order=(o.viewOrder||[]).slice();
    const src=o.views||{};
    if(o.kind==='eyes' || o.kind==='mouths'){
      o.frameNames=(DOC_KINDS[o.kind].frameNames||order).slice();
      o.views={ main: order.map(n=>src[n]||[]) };
      o.viewOrder=['main'];
      o.frameOrderV2=order;                   // so a v2 ref.pose can still be resolved
    }else{
      o.frameNames=null;
      o.views={};
      for(const n of order) o.views[n]=[ src[n]||[] ];
    }
    o.frameCount=Math.max(1, (o.views[o.viewOrder[0]]||[]).length);
    const rf=o.refs||{};
    for(const k of Object.keys(rf)) rf[k]=migrateRefEntry(rf[k]);
    // and every shape's ref.pose (a name) becomes ref.frame (an index)
    for(const n of o.viewOrder) for(const fr of o.views[n]||[]) for(const s of fr||[])
      if(s && s.ref) migrateRefField(s.ref, rf[s.ref.key]);
    (o.render||(o.render={})).fps=FPS;
    o.version=3;
  }
  return o;
}

/* A v2 refs entry was {frameOrder:[name], frames:{name:[shape]}} - one sheet,
   one expression per key. In v3 it is shaped like a document: one view holding
   an array of frames, in the sheet's own order. */
function migrateRefEntry(e){
  if(!e || e.views) return e;                 // already v3
  const order=(e.frameOrder||[]).slice();
  return { kind:e.kind, title:e.title, drawingId:e.drawingId, rev:e.rev,
           tags:e.tags||[], author:e.author||'',
           frameNames:order, frameCount:Math.max(1,order.length),
           views:{ main: order.map(n=>(e.frames||{})[n]||[]) },
           refs:{} };
}
function migrateRefField(rf,entry){
  if(rf.frame!=null) return;                  // already v3
  const order=(entry && entry.frameNames) || [];
  const i=order.indexOf(rf.pose);
  rf.frame = i>=0 ? i : 0;
  rf.follow = false;
  delete rf.pose;
}

/* Every refLib key the document actually reaches, references inside references
   included. Seeded from the shapes, then walked through each entry's own
   shapes - an item that imports an item would otherwise lose the inner one. */
function usedRefKeys(src){
  const vs = src || views, names = src ? Object.keys(src) : viewNames;
  const seen=new Set(), queue=[];
  const scan=list=>{ for(const s of list||[]) if(s && s.ref && !seen.has(s.ref.key)){
                       seen.add(s.ref.key); queue.push(s.ref.key); } };
  for(const n of names) for(const fr of vs[n]||[]) scan(fr);
  while(queue.length){
    const e=refLib.get(queue.pop());
    if(!e) continue;
    for(const vn of Object.keys(e.views||{})) for(const fr of e.views[vn]||[]) scan(fr);
  }
  return seen;
}

function sceneFromJSON(raw){
  const o = migrateScene(typeof raw==='string' ? JSON.parse(raw) : raw);

  /* Order matters: the kind decides the view KEYS, and they have to exist before
     anything is assigned into them or read back out of them. A key the scene
     declares but does not carry simply comes back empty. */
  const kind = DOC_KINDS[o.kind] ? o.kind : 'character';
  const src  = o.views || {};
  const nF   = Math.max(1, o.frameCount || (src[(o.viewOrder||[])[0]]||[]).length || 1);
  setViewNames(kind, nF);
  /* Every view carries the same number of frames, so a view the scene declares
     but does not carry - or carries short - is padded rather than left ragged;
     views[n][frame] must never be undefined or the render loop dies. */
  const n2 = frameCount();
  for(const n of viewNames){
    const got = src[n] || [];
    views[n] = [];
    for(let i=0;i<n2;i++) views[n].push(got[i] || []);
  }

  refLib.clear();
  const rf = o.refs || {};
  for(const k of Object.keys(rf)) refLib.set(k, rf[k]);

  /* ids are only unique WITHIN a scene, so the counter has to be pushed past
     every one of them - otherwise the next brush stroke gets an id a loaded
     shape already holds, and everything that resolves a shape by id (undo,
     copy-to-the-other-view) picks the wrong one.
     Deliberately NOT walking into the refs' own shapes: nothing ever resolves
     one by id, their ids came from a different scene, and the import strips
     them anyway. */
  let mx=0;
  for(const v of viewNames) for(const fr of views[v]) for(const s of fr) if(s.id>mx) mx=s.id;
  uid = mx+1;

  const ed=o.editor||{}, rn=o.render||{};
  if(ed.defaultColors) current={ outline:ed.defaultColors.outline, fill:ed.defaultColors.fill,
                                 shadow:ed.defaultColors.shadow };
  if(ed.brushW){
    brushW=ed.brushW;
    const el=document.getElementById('optBrushW');
    el.value=ed.brushW; document.getElementById('optBrushWv').textContent=ed.brushW;
  }
  pauseAnim();
  clearSel();
  paletteMode='paint';
  setShading(rn.shading==='gradient'?'gradient':'hatch');
  frame=Math.max(0,Math.min(frameCount()-1, ed.activeFrame||0));
  setView(viewNames.indexOf(ed.activeView)>=0 ? ed.activeView : viewNames[0]);
  syncFrames();
  undoStack.length=0; redoStack.length=0;   // a load is not an edit to undo
  dirty=false;
  syncHistory(); syncPalette(); render();
}

function newScene(kind){
  pauseAnim();
  setViewNames(kind||'character');            // empties and re-keys views, rebuilds the switch
  refLib.clear();
  uid=1; clearSel(); paletteMode='paint';
  currentDrawingId=null; currentDrawingTitle=null; currentDrawingRev=0;
  currentDrawingTags=[]; currentDrawingPublished=false;
  undoStack.length=0; redoStack.length=0;
  dirty=false;
  syncHistory(); setView(viewNames[0]); syncFrames(); syncPalette(); render();
}

/* ================================================= supabase / session / gallery
   Login is a username and a password, backed by Supabase Auth. The account's
   email address is DERIVED from the username - 'bob' signs in as
   bob@example.com - so the user never sees an email field and no mail is ever
   sent (see userEmail for why that domain and not a fake one). cs_users.id IS
   the auth user id, which is what lets RLS key on auth.uid(): see the note at
   the top of supabase/schema.sql. `session` keeps the same
   {id, username, is_admin} shape it always had, so everything downstream of
   here is unchanged. */
let sb = null;
/* The login form stays disabled until this turns true - a submit against a
   client that has not arrived yet half-runs the flow. */
let sbLoaded = false;
const sbReady = new Promise(res=>{
  const land=()=>{ sb=window.sb||null; sbLoaded=!!sb; res(); };
  if(window.sb!==undefined || window.sbError) land();
  else window.addEventListener('sb-ready',land,{once:true});
});
async function db(){
  await sbReady;
  if(!sb) throw new Error('Supabase client did not load (offline, or the page was opened off the filesystem).');
  return sb;
}

let session=null;                 // {id, username, is_admin}; id is the auth user id
let currentDrawingId=null;        // the row Save updates; null means Save inserts
let currentDrawingTitle=null;     // null means Save has to ask for a name first
let currentDrawingRev=0;          // the row's rev, stamped into any reference to it
let currentDrawingTags=[];        // freeform, lower-case, whatever the Library searches on
let currentDrawingPublished=false;// private until published; only published rows reach other users
let uiScreen='draw';              // 'draw' | 'login' | 'gallery'

/* The username has to survive being turned into an email local part, and the
   mapping has to be injective or two names land on one account. Hence the
   format, which is checked here and again by a constraint on the column.

   The domain is example.com because **GoTrue rejects an address whose domain
   does not resolve**. charactersmith.invalid was the obvious choice - .invalid
   is RFC 2606 reserved precisely so it can never reach an inbox - and signUp
   turns it down flat: 'Email address is invalid'. Every other reserved fake
   (.test, .example, a made-up .app) has no DNS either and fails the same way.
   example.com is the one address space that is BOTH reserved for ever - RFC
   2606 again, run by IANA, not registrable by anybody - AND real enough in DNS
   to satisfy the validator. Do not "tidy" this into a prettier domain that
   somebody could come to own. */
const NAME_RE=/^[a-z0-9_-]{2,24}$/;
const MIN_PASS=8;                 // matches the dashboard's minimum
const userEmail=name=>name.toLowerCase()+'@example.com';

function cleanName(name){
  name=(name||'').trim().toLowerCase();
  if(!name) throw new Error('Pick a name first.');
  if(!NAME_RE.test(name))
    throw new Error('Letters, numbers, - and _ only, 2 to 24 characters.');
  return name;
}
function checkPass(p){
  if((p||'').length<MIN_PASS) throw new Error('At least '+MIN_PASS+' characters, please.');
  return p;
}

/* Step one of the login flow, and the ONLY thing a logged-out visitor can ask
   the database: is there an account by this name, so do we ask for the password
   or ask them to choose one. It is a security-definer function rather than a
   select, so anon still reaches no table at all. */
async function userExists(name){
  const c=await db();
  const {data,error}=await c.rpc('cs_user_exists',{p_username:name});
  if(error) throw error;
  return !!data;
}

/* The cs_users row for whoever is signed in. Supabase Auth is the identity;
   this is the profile hanging off it. If the row is missing we make it - that
   is the one broken state reachable here (signUp succeeded, the insert after it
   did not), and it is why signUp stamps the username into the auth metadata. */
async function loadMe(){
  const c=await db();
  const {data:{user},error:ue}=await c.auth.getUser();
  if(ue) throw ue;
  if(!user) throw new Error('Not signed in.');
  const got=await c.from('cs_users').select('id,username,is_admin').eq('id',user.id).maybeSingle();
  if(got.error) throw got.error;
  if(got.data){ session=got.data; return; }
  const name=(user.user_metadata&&user.user_metadata.username)||(user.email||'').split('@')[0];
  const ins=await c.from('cs_users').insert({id:user.id, username:name})
                   .select('id,username,is_admin').single();
  if(ins.error) throw ins.error;
  session=ins.data;
}

async function signInUser(name, pass){
  const c=await db();
  const {error}=await c.auth.signInWithPassword({email:userEmail(name), password:pass});
  if(error) throw new Error(/invalid login credentials/i.test(error.message)
    ? 'Wrong password.' : (error.message||String(error)));
  await loadMe();
}

async function signUpUser(name, pass){
  const c=await db();
  const {data,error}=await c.auth.signUp({
    email:userEmail(name), password:pass,
    options:{data:{username:name}}          // loadMe's repair path reads this back
  });
  if(error) throw new Error(/already registered/i.test(error.message)
    ? 'That name is taken - go back and sign in instead.' : (error.message||String(error)));
  /* No session means the project still has "Confirm email" switched on, and
     there is no inbox for a .invalid address to confirm from. */
  if(!data.session)
    throw new Error('This project still has email confirmation on - turn it off under Authentication, Providers, Email.');
  const ins=await c.from('cs_users').insert({id:data.user.id, username:name})
                   .select('id,username,is_admin').single();
  if(ins.error) throw ins.error;
  session=ins.data;
}

async function signOutUser(){
  session=null; currentDrawingId=null;
  try{ const c=await db(); await c.auth.signOut(); }catch(e){}
}

function thumbnailNow(){
  // Frame 0 of the first view with anything in it: the resting pose is the face
  // of a drawing, whatever the drawing is called and however it animates.
  for(const n of viewNames){
    const url=renderViewToDataURL(n,{maxDim:320, frame:0});
    if(url) return url;
  }
  // Nothing in frame 0 of any view - fall back to the first frame that has anything
  for(let f=1; f<frameCount(); f++)
    for(const n of viewNames){
      const url=renderViewToDataURL(n,{maxDim:320, frame:f});
      if(url) return url;
    }
  return null;
}

async function listDrawings(){
  const c=await db();
  let q=c.from('cs_drawings')
         .select('id,title,kind,rev,thumbnail,deleted_at,updated_at,user_id,cs_users(username)')
         .order('updated_at',{ascending:false});
  // an admin sees everyone's work, soft-deleted rows included; everyone else
  // sees their own, undeleted
  if(!session.is_admin) q=q.eq('user_id',session.id).is('deleted_at',null);
  const {data,error}=await q;
  if(error) throw error;
  return data||[];
}

async function saveDrawing(){
  const c=await db();
  const scene=sceneToJSON(), thumbnail=thumbnailNow();
  const title=currentDrawingTitle||'Untitled';
  const tags=currentDrawingTags||[];
  // rev is bumped by the database on every update - a client cannot forget to
  if(currentDrawingId){
    const {data,error}=await c.from('cs_drawings')
      .update({scene:scene, thumbnail:thumbnail, title:title, kind:docKind, tags:tags,
               published:currentDrawingPublished,
               format_version:SCENE_VERSION, updated_at:new Date().toISOString()})
      .eq('id',currentDrawingId).select('rev').single();
    if(error) throw error;
    if(data) currentDrawingRev=data.rev;
  }else{
    const {data,error}=await c.from('cs_drawings')
      .insert({user_id:session.id, scene:scene, thumbnail:thumbnail, title:title,
               kind:docKind, tags:tags, published:currentDrawingPublished,
               format_version:SCENE_VERSION})
      .select('id,rev').single();
    if(error) throw error;
    currentDrawingId=data.id; currentDrawingRev=data.rev;
  }
}

/* Soft delete only - the row stays, it is just filtered out of the gallery.
   The admin view still shows it, struck through. */
async function deleteDrawing(id){
  const c=await db();
  const {error}=await c.from('cs_drawings')
    .update({deleted_at:new Date().toISOString()}).eq('id',id);
  if(error) throw error;
}

async function openDrawing(row){
  const c=await db();
  const {data,error}=await c.from('cs_drawings').select('id,scene,title,kind,rev,tags,published').eq('id',row.id).single();
  if(error) throw error;
  sceneFromJSON(data.scene);
  currentDrawingId=data.id;
  currentDrawingRev=data.rev||1;
  currentDrawingTitle=data.title||null;   // an old untitled row still gets asked
  currentDrawingTags=(data.tags||[]).slice();
  currentDrawingPublished=!!data.published;
  goScreen('draw');
}

/* ------------------------------------------------------------------ screens
   Both overlays sit ON TOP of the editor rather than replacing it - hiding the
   stage would have the ResizeObserver measure a zero-width canvas. */
function showScreen(n){
  uiScreen=n;
  document.getElementById('loginScreen')  .classList.toggle('hidden', n!=='login');
  document.getElementById('galleryScreen').classList.toggle('hidden', n!=='gallery');
  if(n==='login'){
    document.getElementById('loginErr').textContent='';
    syncLogin();
    setTimeout(()=>document.getElementById(loginStep==='name'?'loginName':'loginPass').focus(),0);
  }
  if(n==='gallery') renderGallery();
}
function goScreen(n){
  const h='#'+n;
  if(location.hash!==h) location.hash=h;      // hashchange calls showScreen
  else showScreen(n);
}
window.addEventListener('hashchange',()=>{
  const n=(location.hash||'').replace('#','')||'draw';
  if(!session && n!=='login'){ goScreen('login'); return; }
  if(n==='login'||n==='gallery'||n==='draw') showScreen(n);
});

function svgIcon(paths,cls){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24');
  if(cls) s.setAttribute('class',cls);
  for(const d of paths){
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d); s.appendChild(p);
  }
  return s;
}

async function renderGallery(){
  const grid=document.getElementById('galleryGrid');
  document.getElementById('galleryWho').textContent =
    session ? ('Signed in as '+session.username+(session.is_admin?' - admin, showing everyone':'')) : '';
  grid.textContent='';
  const loading=document.createElement('div');
  loading.className='gnote'; loading.textContent='Loading...';
  grid.appendChild(loading);

  let rows=[];
  try{ rows=await listDrawings(); }
  catch(err){
    grid.textContent='';
    const n=document.createElement('div');
    n.className='gnote'; n.textContent='Could not reach Supabase: '+(err.message||err);
    grid.appendChild(n);
    return;
  }
  grid.textContent='';

  // the empty canvas always sits first
  const nw=document.createElement('div');
  nw.className='gcard new';
  const nwt=document.createElement('div');
  nwt.className='gthumb';
  nwt.appendChild(svgIcon(['M12 6v12','M6 12h12']));
  nw.appendChild(nwt);
  const nwm=document.createElement('div'); nwm.className='gmeta'; nwm.textContent='New drawing';
  nw.appendChild(nwm);
  // No kind picker any more - New drawing always makes an image. The other
  // kinds are reached through Make Object, which names its own kind.
  nw.addEventListener('click',()=>{ newScene('character'); goScreen('draw'); });
  grid.appendChild(nw);

  for(const row of rows){
    const gone=!!row.deleted_at;
    const card=document.createElement('div');
    card.className='gcard'+(gone?' deleted':'');

    const th=document.createElement('div'); th.className='gthumb';
    if(row.thumbnail){
      const img=document.createElement('img');
      img.src=row.thumbnail; img.alt=row.title||'drawing'; img.draggable=false;
      img.loading='lazy'; img.decoding='async';   // a thumbnail is a ~45KB data: URL and
      // there can be 200 of them; offscreen rows must never be decoded
      th.appendChild(img);
    }else{
      const e=document.createElement('div'); e.className='empty'; e.textContent='empty';
      th.appendChild(e);
    }
    card.appendChild(th);
    card.addEventListener('click',()=>openDrawing(row).catch(err=>alert(err.message||err)));

    // a deleted row is a record, not something to act on further
    if(!gone){
      const del=document.createElement('button');
      del.className='gdel'; del.title='Delete';
      del.appendChild(svgIcon(['M4 7h16',
        'M9.5 7V5.4A1.4 1.4 0 0 1 10.9 4h2.2a1.4 1.4 0 0 1 1.4 1.4V7',
        'M6.5 7 7.4 19a1.5 1.5 0 0 0 1.5 1.4h6.2a1.5 1.5 0 0 0 1.5-1.4L17.5 7']));
      del.addEventListener('click',ev=>{
        ev.stopPropagation();                 // the card underneath opens the drawing
        openModal({
          title:'Delete this drawing?',
          body:'It disappears from the gallery. The record is kept in the database either way, so this can be undone by hand.',
          buttons:[
            {label:'Delete', danger:true, onClick:()=>
              deleteDrawing(row.id)
                .then(()=>{ if(currentDrawingId===row.id) currentDrawingId=null; renderGallery(); })
                .catch(err=>alert(err.message||err))},
            {label:'Cancel'}
          ]
        });
      });
      card.appendChild(del);
    }

    // admins get the author under the thumbnail - that is the only extra
    const meta=document.createElement('div'); meta.className='gmeta';
    const kd=DOC_KINDS[row.kind||'character'];
    const tag=(kd && row.kind && row.kind!=='character') ? ' \u00b7 '+kd.label : '';
    meta.textContent = session.is_admin
      ? ((row.cs_users&&row.cs_users.username)||'unknown')+tag+(gone?' - deleted':'')
      : (row.title||'Untitled')+tag;
    card.appendChild(meta);

    grid.appendChild(card);
  }
}

/* ------------------------------------------------------------- the Library
   Every PUBLISHED mouth, eye and item, plus every one of your own whether it is
   published or not - an unpublished drawing is still yours to build with. The
   listing is deliberately cheap; only the row actually picked has its scene
   fetched. */
let libTab='mouths', libRows=null, libBusy=false, libErr='', libTag='', libOpenUsed=false;
const LIB_TABS={ mouths:'mouths', eyes:'eyes', items:'item' };

async function listSheets(){
  const c=await db();
  let q=c.from('cs_drawings')
    .select('id,title,thumbnail,kind,rev,tags,published,user_id,cs_users(username)')
    .in('kind',['eyes','mouths','item']).is('deleted_at',null);
  // an admin sees the lot, as everywhere else
  if(session && !session.is_admin) q=q.or('published.eq.true,user_id.eq.'+session.id);
  const {data,error}=await q.order('updated_at',{ascending:false}).limit(200);
  if(error) throw error;
  return data||[];
}

const rowTags = r => (r.tags||[]).map(t=>String(t).toLowerCase());

/* The five most used tags of whatever tab you are on. A tag cloud is only worth
   showing while there is more than one of them to choose between. */
function popularTags(rows){
  const n=new Map();
  for(const r of rows) for(const t of rowTags(r)) n.set(t,(n.get(t)||0)+1);
  return [...n.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]))
                         .slice(0,5).map(e=>e[0]);
}

function libMatches(r,q){
  if(libTag && rowTags(r).indexOf(libTag)<0) return false;
  if(!q) return true;
  return (r.title||'').toLowerCase().indexOf(q)>=0 ||
         rowTags(r).some(t=>t.indexOf(q)>=0);
}

function libThumb(row){
  const th=document.createElement('div'); th.className='gthumb';
  if(row.thumbnail){
    const img=document.createElement('img');
    img.src=row.thumbnail; img.alt=row.title||'drawing'; img.draggable=false;
    img.loading='lazy'; img.decoding='async';   // a thumbnail is a ~45KB data: URL and
    // there can be 200 of them; offscreen rows must never be decoded
    th.appendChild(img);
  }else{
    const e=document.createElement('div'); e.className='empty'; e.textContent='empty';
    th.appendChild(e);
  }
  return th;
}

function renderLibrary(){
  const grid=document.getElementById('libGrid');
  const note=document.getElementById('libNote');
  const cloud=document.getElementById('libTags');
  document.querySelectorAll('#libTabs button').forEach(b=>b.classList.toggle('on',b.dataset.lib===libTab));
  grid.textContent=''; note.textContent=''; cloud.textContent='';
  renderUsed();
  if(libErr){ note.textContent=libErr; return; }
  if(libRows===null){ note.textContent = libBusy ? 'Loading...' : ''; return; }

  const q=document.getElementById('libSearch').value.trim().toLowerCase();
  const mine=libRows.filter(r=>r.kind===LIB_TABS[libTab]);

  const tags=popularTags(mine);
  if(libTag && tags.indexOf(libTag)<0) tags.push(libTag);   // keep a chosen tag visible
  for(const t of tags){
    const b=document.createElement('button');
    b.className='tagbtn'+(t===libTag?' on':'');
    b.textContent=t;
    b.addEventListener('click',()=>{ libTag = libTag===t ? '' : t; renderLibrary(); });
    cloud.appendChild(b);
  }

  const rows=mine.filter(r=>libMatches(r,q));
  if(!rows.length) note.textContent = mine.length ? 'Nothing matches that.'
                                                  : 'No '+libTab+' saved yet.';
  for(const row of rows){
    const card=document.createElement('div');
    card.className='gcard';
    card.appendChild(libThumb(row));
    const meta=document.createElement('div'); meta.className='gmeta';
    meta.textContent=row.title||'Untitled';
    card.appendChild(meta);
    if(rowTags(row).length){
      const tg=document.createElement('div'); tg.className='gtags';
      tg.textContent=rowTags(row).join(' ');
      card.appendChild(tg);
    }
    card.addEventListener('click',()=>importRef(row).catch(err=>alert(err.message||err)));
    grid.appendChild(card);
  }
}

/* Every reference the document holds, one row per distinct one however many
   times it is placed - and whether the drawing it came from has moved on since.
   The listing already carries every id and rev, so staleness costs no query. */
function usedRefs(){
  const out=new Map();
  for(const n of viewNames) for(let f=0;f<(views[n]||[]).length;f++)
    for(const s of views[n][f]) if(s.ref){
      let e=out.get(s.ref.key);
      if(!e){ e={key:s.ref.key, ref:s.ref, shapes:[], where:[]}; out.set(s.ref.key,e); }
      e.shapes.push(s); e.where.push({view:n, frame:f});
    }
  return [...out.values()];
}
function latestRevOf(id){
  const r=(libRows||[]).find(x=>x.id===id);
  return r ? (r.rev||1) : null;
}
function rowOf(id){ return (libRows||[]).find(x=>x.id===id) || null; }

function renderUsed(){
  const list=document.getElementById('usedList');
  const fold=document.getElementById('usedFold');
  const used=usedRefs();
  fold.textContent='Used in this drawing ('+used.length+') '+(libOpenUsed?'-':'+');
  list.classList.toggle('hidden', !libOpenUsed || !used.length);
  fold.classList.toggle('hidden', !used.length);
  list.textContent='';
  if(!libOpenUsed) return;

  for(const u of used){
    const lib=refLib.get(u.key) || {};
    const row=rowOf(u.ref.drawingId);
    const latest=latestRevOf(u.ref.drawingId);
    const stale=latest!=null && latest>(u.ref.rev||1);

    const el=document.createElement('div'); el.className='urow';
    el.appendChild(libThumb(row||{thumbnail:null}));
    const info=document.createElement('div'); info.className='uinfo';
    const t=document.createElement('div'); t.className='utitle';
    t.textContent=(u.ref.title||lib.title||'Untitled')+(u.shapes.length>1?' x'+u.shapes.length:'');
    const by=document.createElement('div'); by.className='uby';
    by.textContent=(row&&row.cs_users&&row.cs_users.username) || lib.author || 'unknown';
    info.appendChild(t); info.appendChild(by);
    const tg=rowTags(row||{tags:lib.tags});
    if(tg.length){ const d=document.createElement('div'); d.className='gtags';
                   d.textContent=tg.join(' '); info.appendChild(d); }
    if(stale){
      const w=document.createElement('div'); w.className='ustale';
      w.textContent='Updated';
      const b=document.createElement('button'); b.className='pbtn'; b.textContent='Update';
      b.addEventListener('click',e=>{ e.stopPropagation();
        updateRef(u.key).then(renderLibrary).catch(err=>alert(err.message||err)); });
      w.appendChild(b);
      info.appendChild(w);
    }
    el.appendChild(info);
    // clicking the row finds the thing in the drawing, wherever it is hiding
    el.addEventListener('click',()=>{
      const w=u.where[0];
      if(w.view!==view) setView(w.view);
      if(w.frame!==frame) setFrame(w.frame);
      const here=u.shapes.filter(s=>cur().indexOf(s)>=0);
      selected=here[0]||u.shapes[0]; extra=here.slice(1);
      syncPalette(); render();
    });
    list.appendChild(el);
  }
}

function refreshLibrary(){
  libBusy=true; libRows=null; libErr=''; renderLibrary();
  listSheets()
    .then(r=>{ libRows=r; })
    .catch(err=>{ libRows=[]; libErr='Could not reach Supabase: '+(err.message||err); })
    .then(()=>{ libBusy=false; renderLibrary(); });
}
/* The placement box. NOT four corners: buildPath is a quadratic through segment
   midpoints, so four points draw as a squircle inscribed in the rectangle - and
   shapeAt builds exactly that path, which would leave the corners of every
   imported sheet unclickable under a selection box drawn square. */
function boxPts(w,h){
  const hx=w/2, hy=h/2, N=4, out=[];
  const c=[{x:-hx,y:-hy},{x:hx,y:-hy},{x:hx,y:hy},{x:-hx,y:hy}];
  for(let i=0;i<4;i++){
    const a=c[i], d=c[(i+1)%4];
    for(let j=0;j<N;j++) out.push({x:a.x+(d.x-a.x)*j/N, y:a.y+(d.y-a.y)*j/N});
  }
  return out;
}

/* Turn a fetched row into a refLib entry, and hand back its key and the size of
   the box that wraps it. Shared by the Library's pick and by Update, which is
   the same operation aimed at a shape that already exists.

   An imported drawing keeps ALL its frames - a reference is a stamp of a whole
   animation, and which frame of it shows is the instance's business. Only its
   FIRST view travels: front, or a sheet's only one. */
function buildRefEntry(data){
  // migrateScene ONLY - sceneFromJSON would throw the editor away and load the row
  const o=migrateScene(typeof data.scene==='string'?JSON.parse(data.scene):data.scene);
  const vOrder=(o.viewOrder||[]).filter(n=>Array.isArray((o.views||{})[n]));
  if(!vOrder.length) throw new Error('That drawing has no views.');
  const frames=JSON.parse(JSON.stringify(o.views[vOrder[0]]));

  /* ONE shared offset for every frame - centring each frame on its own bbox
     would make them jitter against each other. The union of all the frames is
     what the placement box wraps, so a bigger frame can never fall outside it
     or be cropped out of an export. The drawing's coordinates are its own
     canvas's, so without this the artwork lands hundreds of px from its box. */
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,any=false;
  for(const fr of frames) for(const s of fr){
    delete s.id;                              // those ids belong to the other scene
    if(!s.pts || s.pts.length<2) continue;
    const bb=bbox(worldPts(s)), pad=(s.lw||0)/2+1;
    if(bb.x0-pad<x0) x0=bb.x0-pad;  if(bb.y0-pad<y0) y0=bb.y0-pad;
    if(bb.x1+pad>x1) x1=bb.x1+pad;  if(bb.y1+pad>y1) y1=bb.y1+pad;
    any=true;
  }
  if(!any) throw new Error('That drawing is empty.');
  const ox=(x0+x1)/2, oy=(y0+y1)/2;
  const bw=Math.max(1,x1-x0), bh=Math.max(1,y1-y0);
  for(const fr of frames) for(const s of fr){ s.x-=ox; s.y-=oy; }

  /* ownerId is what decides whether this document may be edited in place, and
     cx/cy is the offset just taken out of every frame - the backdrop pass needs
     it to draw the parent in the object's own coordinates. */
  const entry={ kind:data.kind, title:data.title||'Untitled', drawingId:data.id,
                rev:data.rev||1, tags:data.tags||[], published:!!data.published,
                ownerId:data.user_id||null, cx:ox, cy:oy,
                author:(data.cs_users&&data.cs_users.username)||'',
                frameNames:(o.frameNames||null), frameCount:Math.max(1,frames.length),
                views:{ main:frames }, refs:(o.refs||{}) };
  return { key:data.id+'@'+(data.rev||1), entry:entry, bw:bw, bh:bh };
}

/* Point a shape at a reference without moving it. Position and rotation are
   untouched and the on-screen WIDTH is held, so swapping to a differently sized
   drawing does not make the thing jump. Update in the Library runs this too. */
function placeRef(shape, built){
  const k=Math.max(1,bbox(shape.pts).w)/built.bw;
  shape.sx*=k; shape.sy*=k;                   // sign survives, so a flip survives
  shape.pts=boxPts(built.bw,built.bh);
  const old=shape.ref||{};
  shape.ref={ key:built.key, drawingId:built.entry.drawingId, rev:built.entry.rev,
              kind:built.entry.kind, title:built.entry.title,
              frame:Math.max(0,Math.min(built.entry.frameCount-1, old.frame||0)),
              follow:!!old.follow };
}

/* An imported item may hold references of its own - they have to travel with it
   or the inner one draws as nothing. */
function absorbNestedRefs(entry){
  for(const k of Object.keys(entry.refs||{}))
    if(!refLib.has(k)) refLib.set(k, migrateRefEntry(entry.refs[k]));
}

/* Would importing this put the drawing inside itself? Only reachable now that an
   item can import an item. REF_MAX_DEPTH would stop the draw, but a cycle costs
   four nested passes on every frame, so it is refused at the door instead. */
function refCycles(entry, targetId){
  if(!targetId) return false;
  const seen=new Set(), q=[entry];
  while(q.length){
    const e=q.pop();
    if(!e) continue;
    if(e.drawingId===targetId) return true;
    for(const vn of Object.keys(e.views||{})) for(const fr of e.views[vn]||[])
      for(const s of fr||[]) if(s && s.ref && !seen.has(s.ref.key)){
        seen.add(s.ref.key); q.push((e.refs||{})[s.ref.key] || refLib.get(s.ref.key));
      }
  }
  return false;
}

const REF_COLS='id,scene,title,kind,rev,tags,user_id,cs_users(username)';

/* Bring a whole drawing in as ONE reference. There is deliberately no limit on
   how many of these a document may hold, or on how many of the same kind. */
async function importRef(row){
  const c=await db();
  const {data,error}=await c.from('cs_drawings').select(REF_COLS).eq('id',row.id).single();
  if(error) throw error;
  const built=buildRefEntry(data);
  if(refCycles(built.entry, currentDrawingId))
    throw new Error('That would put this drawing inside itself.');

  refLib.set(built.key, built.entry);
  absorbNestedRefs(built.entry);

  pushUndo();
  const r=cv.getBoundingClientRect();
  // a quarter of the stage at most, and never blown up past its authored size
  const fit=Math.min(1, (Math.min(r.width,r.height)*0.25)/Math.max(built.bw,built.bh));
  const s={ id:uid++, pts:boxPts(built.bw,built.bh), x:r.width/2, y:r.height/2,
            rot:0, sx:fit, sy:fit,
            lw:0, closed:true, colors:{outline:NONE, fill:NONE, shadow:NONE},
            ref:{ key:built.key, drawingId:built.entry.drawingId, rev:built.entry.rev,
                  kind:built.entry.kind, title:built.entry.title, frame:0, follow:false } };
  cur().push(s);
  selected=s; extra=[];
  syncPalette();
}

/* Swap every instance of a reference to the newest revision of the drawing it
   came from, in place. Undo needs nothing extra: the new revision gets a refLib
   key of its OWN and the shapes are repointed at it, and the shapes are what
   snapshot() carries. The old entry is left behind, inert, exactly as an undone
   import already leaves one - and sceneToJSON prunes it on the way out. */
async function updateRef(oldKey){
  const old=refLib.get(oldKey);
  if(!old) return;
  const c=await db();
  const {data,error}=await c.from('cs_drawings').select(REF_COLS).eq('id',old.drawingId).single();
  if(error) throw error;
  const built=buildRefEntry(data);
  if(built.key===oldKey) return;              // already the latest
  refLib.set(built.key, built.entry);
  absorbNestedRefs(built.entry);

  pushUndo();
  for(const n of viewNames) for(const fr of views[n]||[]) for(const s of fr)
    if(s.ref && s.ref.key===oldKey) placeRef(s, built);
  syncPalette(); render();
}
document.getElementById('btnLibrary').addEventListener('click',()=>{
  if(!canImport()) return;
  paletteMode = paletteMode==='library' ? 'paint' : 'library';
  syncPalette();
  if(paletteMode==='library'){
    refreshLibrary();
    setTimeout(()=>document.getElementById('libSearch').focus(),0);
  }
});
document.getElementById('libTabs').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b && b.dataset.lib){ libTab=b.dataset.lib; libTag=''; renderLibrary(); }
});
/* Debounced: renderLibrary() throws the whole grid away and rebuilds every card,
   and each card's thumbnail is a ~45KB data: URL the browser has to decode again.
   Running that on every keystroke was the most expensive thing in the app after
   the render loop. */
let libSearchT=0;
document.getElementById('libSearch').addEventListener('input',()=>{
  clearTimeout(libSearchT); libSearchT=setTimeout(renderLibrary,150);
});
document.getElementById('usedFold').addEventListener('click',()=>{ libOpenUsed=!libOpenUsed; renderUsed(); });

/* ------------------------------------------------------------- screen wiring */
/* The login card is a two-step form. 'name' asks who you are; the answer to
   cs_user_exists then decides whether step two is 'in' (sign in to an account
   that exists) or 'up' (choose a password for a new one). syncLogin is the only
   thing that touches the card's visibility, so the two steps cannot drift. */
let loginStep='name';             // 'name' | 'in' | 'up'
let loginUsername='';
let loginBusy=false;

function syncLogin(){
  const el=id=>document.getElementById(id);
  const named=loginStep!=='name';
  el('loginIntro').classList.toggle('hidden', named);
  el('loginName') .classList.toggle('hidden', named);
  el('loginWho')  .classList.toggle('hidden', !named);
  el('loginPass') .classList.toggle('hidden', !named);
  el('loginPass2').classList.toggle('hidden', loginStep!=='up');
  el('loginBack') .classList.toggle('hidden', !named);
  if(named) el('loginWho').innerHTML = (loginStep==='up'
    ? 'Making a new account for <b></b>. Choose a password.'
    : 'Signing in as <b></b>.');
  if(named) el('loginWho').querySelector('b').textContent=loginUsername;
  el('loginGo').textContent = loginStep==='name' ? 'Continue'
                            : loginStep==='up'   ? 'Create account' : 'Sign in';
  /* Nothing can be submitted before the Supabase client has loaded, or the
     flow half-runs against a client that is not there. */
  const off=loginBusy||!sbLoaded;
  for(const id of ['loginName','loginPass','loginPass2','loginGo']) el(id).disabled=off;
  el('loginPass').setAttribute('autocomplete', loginStep==='up'?'new-password':'current-password');
}
function loginReset(){
  loginStep='name'; loginBusy=false;
  document.getElementById('loginPass').value='';
  document.getElementById('loginPass2').value='';
  document.getElementById('loginErr').textContent='';
  syncLogin();
}
function loginFail(e){
  loginBusy=false;
  document.getElementById('loginErr').textContent=e.message||String(e);
  syncLogin();
}

function doLogin(){
  if(loginBusy||!sbLoaded) return;
  const el=id=>document.getElementById(id);
  el('loginErr').textContent='';
  loginBusy=true; syncLogin();

  if(loginStep==='name'){
    let name;
    try{ name=cleanName(el('loginName').value); }catch(e){ return loginFail(e); }
    userExists(name)
      .then(found=>{
        loginUsername=name; loginStep=found?'in':'up'; loginBusy=false;
        syncLogin(); el('loginPass').focus();
      })
      .catch(loginFail);
    return;
  }

  const pass=el('loginPass').value;
  let go;
  try{
    if(loginStep==='up'){
      checkPass(pass);
      if(pass!==el('loginPass2').value) throw new Error('The two passwords do not match.');
      go=signUpUser(loginUsername, pass);
    }else{
      if(!pass) throw new Error('Password, please.');
      go=signInUser(loginUsername, pass);
    }
  }catch(e){ return loginFail(e); }

  go.then(()=>{ loginReset(); goScreen('gallery'); }).catch(loginFail);
}

document.getElementById('loginGo').addEventListener('click',doLogin);
document.getElementById('loginBack').addEventListener('click',()=>{
  loginReset(); document.getElementById('loginName').focus();
});
for(const id of ['loginName','loginPass','loginPass2'])
  document.getElementById(id).addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); doLogin(); }
  });

document.getElementById('btnLogout').addEventListener('click',()=>{
  guardUnsaved(()=>{ signOutUser().then(()=>{ loginReset(); goScreen('login'); }); });
});
document.getElementById('btnGallery').addEventListener('click',()=>{
  if(!session){ goScreen('login'); return; }
  guardUnsaved(()=>goScreen('gallery'));
});

/* ------------------------------------------------- the unsaved-work guard
   Leaving the editor with work that is not in the gallery loses it: there is
   no draft anywhere, only the row. So anything that walks away from the
   drawing asks first, and the answer is one of save it, throw it away, or stay.
   An empty drawing has nothing to lose, so it never asks. */
function hasArt(){
  return viewNames.some(n=>(views[n]||[]).some(f=>f && f.length));
}
function unsaved(){ return dirty && hasArt(); }
function guardUnsaved(go){
  /* An object being edited in place is a whole document sitting on a stack; the
     way out of it is Done or Cancel, not the gallery. */
  if(editStack.length){
    openModal({
      title:'Finish with this object first',
      body:'You are editing '+editWhoText()+'. Use Done or Cancel on the banner before leaving.',
      buttons:[{label:'OK', primary:true}]
    });
    return;
  }
  if(!unsaved()){ go(); return; }
  openModal({
    title:'Save this drawing first?',
    body:'It has changes that are not in the gallery. Leaving without saving throws them away.',
    buttons:[
      {label:'Save', primary:true, onClick:()=>saveThen(go)},
      {label:'Throw it away', danger:true, onClick:()=>{ dirty=false; go(); }},
      {label:'Cancel'}
    ]
  });
}
/* Save, then carry on - the name prompt sits in the middle of it for a drawing
   that has never been saved, and cancelling that leaves you where you were. */
function saveThen(after){
  if(!session){ goScreen('login'); return; }
  if(!currentDrawingTitle) askNameThenSave(after);
  else doSave(after);
}
/* The browser's own prompt is the only thing that can catch a reload, a Back or
   a closed tab - it cannot be a modal of ours. */
window.addEventListener('beforeunload',e=>{
  if(!unsaved()) return;
  e.preventDefault(); e.returnValue='';
});

function doSave(after){
  const btn=document.getElementById('btnSave');
  btn.disabled=true;
  saveDrawing()
    .then(()=>{ dirty=false; syncChrome(); syncMeta();
                btn.classList.add('ok'); setTimeout(()=>btn.classList.remove('ok'),1200);
                if(after) after(); })
    .catch(err=>alert('Save failed: '+(err.message||err)))
    .then(()=>{ btn.disabled=false; });
}
/* Tags are freeform and defined at first use, so there is nothing to validate -
   only to normalise. Lower-case, comma or space separated, deduped. */
function parseTags(s){
  const out=[];
  for(const t of String(s||'').toLowerCase().replace(/,/g,' ').split(' ')){
    const v=t.trim();
    if(v && out.indexOf(v)<0) out.push(v);
  }
  return out;
}
/* Autosuggest is every tag anyone has ever used, most used first. One cheap
   query, cached for the session - a tag list does not have to be live. */
let tagPool=null;
async function loadTagPool(){
  if(tagPool) return tagPool;
  const c=await db();
  let q=c.from('cs_drawings').select('tags').is('deleted_at',null);
  if(session && !session.is_admin) q=q.or('published.eq.true,user_id.eq.'+session.id);
  const {data,error}=await q.limit(500);
  if(error) throw error;
  const n=new Map();
  for(const r of data||[]) for(const t of r.tags||[]){
    const v=String(t).toLowerCase(); n.set(v,(n.get(v)||0)+1);
  }
  tagPool=[...n.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  return tagPool;
}
function fillTagList(){
  loadTagPool().then(pool=>{
    const dl=document.getElementById('tagList');
    dl.textContent='';
    for(const t of pool){ const o=document.createElement('option'); o.value=t; dl.appendChild(o); }
  }).catch(()=>{});
}

/* A drawing with no name yet is named before it is saved. Cancel saves nothing,
   and neither does an empty name - the modal just goes away. Tags are optional
   here and can be edited afterwards from the top bar; the name cannot. */
function askNameThenSave(after){
  fillTagList();
  openModal({
    title:'Name this drawing',
    input:{placeholder:'Untitled'},
    input2:{placeholder:'tags, space or comma separated', value:(currentDrawingTags||[]).join(' ')},
    buttons:[
      {label:'Save', primary:true, onClick:(v,v2)=>{
        v=(v||'').trim();
        if(!v) return;
        currentDrawingTitle=v;
        currentDrawingTags=parseTags(v2);
        doSave(after);
      }},
      {label:'Cancel'}
    ]
  });
}
/* Superseded by the metadata box at the bottom of the sidebar, which is where
   tags are edited now. Kept because it is the one modal that only asks for tags. */
function askTags(){
  fillTagList();
  openModal({
    title:'Tags',
    body:'Freeform and lower-case. They are what the Library searches on.',
    input2:{placeholder:'tags, space or comma separated', value:(currentDrawingTags||[]).join(' ')},
    buttons:[
      {label:'Save', primary:true, onClick:(v,v2)=>{
        currentDrawingTags=parseTags(v2);
        if(currentDrawingId) doSave();
      }},
      {label:'Cancel'}
    ]
  });
}
document.getElementById('btnSave').addEventListener('click',()=>{
  if(!session){ goScreen('login'); return; }
  if(!currentDrawingTitle) askNameThenSave();
  else doSave();
});

/* ==================================================== objects in this drawing
   Three things live here, and they are one story: a selection can be promoted
   into a drawing of its own (Make Object), a drawing of your own that has been
   imported can be edited without leaving the one it sits in (the edit stack),
   and either one's name, tags and published flag are edited in the metadata box
   at the bottom of the sidebar. */

/* ------------------------------------------------------------- the chrome
   The bits that are neither the palette nor the frames: the save button's
   unsaved dot, the publish light and the edit banner.

   It runs off render() rather than off the edits, because pushUndo - the one
   place every edit lands - fires BEFORE the edit is made, so the very first
   stroke in an empty drawing sets dirty at a moment when hasArt() is still
   false and the dot would never appear. Memoised on a key of everything it
   shows, so sixty calls a second cost one string compare. */
let chromeKey='';
function syncChrome(){
  const key=[unsaved(), currentDrawingPublished, editStack.length,
             editStack.length?editWhoText():''].join('|');
  if(key===chromeKey) return;
  chromeKey=key;
  const save=document.getElementById('btnSave');
  save.classList.toggle('dirty', unsaved());
  document.getElementById('saveTip').textContent =
    unsaved() ? 'Save to the gallery - unsaved changes' : 'Save to the gallery';

  const pub=document.getElementById('btnPublish');
  pub.classList.toggle('on', !!currentDrawingPublished);
  document.getElementById('pubTip').textContent = currentDrawingPublished
    ? 'Published - other users can use it. Click to make it private again.'
    : 'Publish so other users can use it';

  const bar=document.getElementById('editbar');
  bar.classList.toggle('hidden', !editStack.length);
  if(editStack.length) document.getElementById('editWho').innerHTML=editWhoHTML();
}
function editWhoText(){
  const k=(DOC_KINDS[docKind]||{label:docKind}).label;
  return k+' "'+(currentDrawingTitle||'Untitled')+'"';
}
function editWhoHTML(){
  const k=(DOC_KINDS[docKind]||{label:docKind}).label;
  const t=(currentDrawingTitle||'Untitled').replace(/[<&]/g,c=>c==='<'?'&lt;':'&amp;');
  return 'Editing '+k+' <b>'+t+'</b>';
}

/* -------------------------------------------------------------- publishing
   A drawing is private until this is on. The gallery is your own work either
   way; it is the Library - what other people can build with - that this gates. */
async function togglePublish(){
  if(!session){ goScreen('login'); return; }
  if(!currentDrawingId){                       // nothing to publish until there is a row
    saveThen(()=>togglePublish());
    return;
  }
  const want=!currentDrawingPublished;
  const btn=document.getElementById('btnPublish');
  btn.disabled=true;
  try{
    const c=await db();
    const {error}=await c.from('cs_drawings').update({published:want}).eq('id',currentDrawingId);
    if(error) throw error;
    currentDrawingPublished=want;
    /* The update bumped rev, and a stale rev here would have this drawing's own
       Save write the old one back into anything that imports it. */
    const got=await c.from('cs_drawings').select('rev').eq('id',currentDrawingId).single();
    if(!got.error && got.data) currentDrawingRev=got.data.rev;
    syncChrome(); syncMeta();
  }catch(err){
    alert('Could not change that: '+(err.message||err));
  }
  btn.disabled=false;
}
document.getElementById('btnPublish').addEventListener('click',togglePublish);

/* --------------------------------------------------------- the metadata box
   It shows the drawing you are in, unless exactly one imported drawing is
   selected - then it shows that one, and edits go to ITS row. Editing another
   user's object is refused: the fields go inert rather than away, so the facts
   still read. */
function metaTarget(){
  const grp=selGroup();
  const s = grp.length===1 && grp[0].ref ? grp[0] : null;
  const e = s && refLib.get(s.ref.key);
  return e ? {ref:true, shape:s, entry:e} : {ref:false};
}
function syncMeta(){
  const t=metaTarget();
  const title=document.getElementById('metaTitle');
  const tags =document.getElementById('metaTags');
  const pub  =document.getElementById('metaPub');
  const facts=document.getElementById('metaFacts');
  const head =document.getElementById('metaHead');

  if(t.ref){
    const e=t.entry, mine=canEditRef(t.shape);
    head.textContent='Object';
    title.value=e.title||'';
    tags.value=(e.tags||[]).join(' ');
    pub.checked=!!e.published;
    title.disabled=tags.disabled=pub.disabled=!mine;
    facts.textContent=
      (DOC_KINDS[e.kind]||{label:e.kind}).label+' - rev '+(e.rev||1)+
      (e.author?' - by '+e.author:'')+
      ' - '+(e.frameCount||1)+(e.frameCount===1?' frame':' frames')+
      (mine?'':' - not yours to edit');
  }else{
    head.textContent='Drawing';
    title.value=currentDrawingTitle||'';
    tags.value=(currentDrawingTags||[]).join(' ');
    pub.checked=!!currentDrawingPublished;
    title.disabled=tags.disabled=false;
    pub.disabled=!currentDrawingId;
    facts.textContent=
      (DOC_KINDS[docKind]||{label:docKind}).label+
      (currentDrawingId?' - rev '+currentDrawingRev:' - not saved yet')+
      ' - '+viewNames.length+(viewNames.length===1?' view':' views')+
      ' - '+frameCount()+(frameCount()===1?' frame':' frames');
  }
}
/* Committed on change/blur rather than on every keystroke - each commit is a row
   write. Enter commits too, which is what a one-line field should do. */
function commitMeta(){
  const t=metaTarget();
  const nt=document.getElementById('metaTitle').value.trim();
  const ng=parseTags(document.getElementById('metaTags').value);
  const np=document.getElementById('metaPub').checked;

  if(t.ref){
    if(!canEditRef(t.shape)){ syncMeta(); return; }
    const e=t.entry;
    if(nt===(e.title||'') && ng.join(' ')===(e.tags||[]).join(' ') && np===!!e.published) return;
    metaWriteRef(t.shape, e, nt||e.title||'Untitled', ng, np);
    return;
  }
  const changed = nt!==(currentDrawingTitle||'') ||
                  ng.join(' ')!==(currentDrawingTags||[]).join(' ') ||
                  np!==!!currentDrawingPublished;
  if(!changed) return;
  // A blank name is not a rename - a drawing that has one keeps it.
  if(nt) currentDrawingTitle=nt;
  currentDrawingTags=ng;
  currentDrawingPublished=np;
  syncChrome();
  if(currentDrawingId) doSave(); else syncMeta();
}
/* The title of a reference lives in two places - the refLib entry, and a copy in
   every shape that points at it, which is what the sidebar and the Library fold
   read. Both move under ONE pushUndo, so it is one undo step. */
async function metaWriteRef(shape, entry, title, tags, published){
  try{
    const c=await db();
    const {error}=await c.from('cs_drawings')
      .update({title:title, tags:tags, published:published}).eq('id',entry.drawingId);
    if(error) throw error;
    pushUndo();
    entry.title=title; entry.tags=tags; entry.published=published;
    for(const n of viewNames) for(const fr of views[n]||[]) for(const s of fr)
      if(s.ref && s.ref.key===shape.ref.key) s.ref.title=title;
    syncPalette(); render();
  }catch(err){
    alert('Could not change that: '+(err.message||err));
    syncMeta();
  }
}
['metaTitle','metaTags'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('change',commitMeta);
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
});
document.getElementById('metaPub').addEventListener('change',commitMeta);

/* --------------------------------------------------------------- Make Object
   Draw the eyes inside the face, then promote them: the shapes come out of this
   drawing, go into a new one of the kind you picked, and a reference to it lands
   exactly where they were. That is the whole point - no round trip through the
   gallery and the Library to make a thing you have already drawn. */
/* Built on top of sceneToJSON rather than beside it: the canvas size, the whole
   render block and the editor block are the same for the child as for the parent
   - it is authored on this stage, under this light - and writing them out twice
   would let the two drift. Only what makes it a document of its own is replaced. */
function objectSceneFrom(shapes, kind){
  const def=DOC_KINDS[kind]||DOC_KINDS.item;
  const names=def.views.map(v=>v[0]);
  const nF = def.frameNames ? def.frameNames.length : 1;

  const v={};
  for(const n of names){ v[n]=[]; for(let i=0;i<nF;i++) v[n].push([]); }
  /* Frame 0 of the first view: the resting pose. The coordinates stay the
     PARENT's - buildRefEntry recentres on the union bbox anyway, and keeping
     them is what makes the reference land on top of what it replaced. */
  v[names[0]][0]=JSON.parse(JSON.stringify(shapes));

  const refs={};
  for(const k of usedRefKeys(v)) if(refLib.has(k)) refs[k]=refLib.get(k);

  const o=sceneToJSON();
  o.kind=kind;
  o.viewOrder=names;
  o.frameNames=(def.frameNames||null);
  o.frameCount=nF;
  o.views=v;
  o.refs=refs;
  o.editor.activeView=names[0];
  o.editor.activeFrame=0;
  return o;
}
function closeMkObjMenu(){
  document.getElementById('mkObjMenu').classList.add('hidden');
}
async function makeObject(kind){
  closeMkObjMenu();
  if(!session){ goScreen('login'); return; }
  const grp=selGroup();
  if(!grp.length || !canImport()) return;

  const btn=document.getElementById('mkObjBtn');
  btn.disabled=true;
  try{
    const def=DOC_KINDS[kind]||DOC_KINDS.item;
    const title=(currentDrawingTitle||'Untitled')+' '+def.label.toLowerCase();
    const scene=objectSceneFrom(grp,kind);
    const thumbnail=renderViewToDataURL(view,{maxDim:320, shapes:grp});

    const c=await db();
    const {data,error}=await c.from('cs_drawings')
      .insert({user_id:session.id, scene:scene, thumbnail:thumbnail, title:title,
               kind:kind, tags:[], published:false, format_version:SCENE_VERSION})
      .select('id,rev').single();
    if(error) throw error;

    /* buildRefEntry takes a plain row, so the one just written does not have to
       be read back to be imported. */
    const built=buildRefEntry({ id:data.id, rev:data.rev, title:title, kind:kind,
                                tags:[], scene:scene, user_id:session.id,
                                cs_users:{username:session.username} });
    if(refCycles(built.entry, currentDrawingId))
      throw new Error('That would put this drawing inside itself.');
    built.entry.published=false;
    refLib.set(built.key, built.entry);
    absorbNestedRefs(built.entry);

    /* Nothing above this line touched the document, so a failure anywhere in it
       leaves the drawing exactly as it was. */
    pushUndo();
    const gb=bbox(grp.flatMap(worldPts));
    const list=cur(), keep=new Set(grp);
    for(let i=list.length-1;i>=0;i--) if(keep.has(list[i])) list.splice(i,1);

    /* Scale 1 and the group's own centre: the child kept the parent's
       coordinates, so its union bbox IS this box and the reference lands on top
       of what it replaced, to the pixel. */
    const s={ id:uid++, pts:boxPts(built.bw,built.bh),
              x:(built.entry.cx!=null?built.entry.cx:gb.cx),
              y:(built.entry.cy!=null?built.entry.cy:gb.cy),
              rot:0, sx:1, sy:1,
              lw:0, closed:true, colors:{outline:NONE, fill:NONE, shadow:NONE},
              ref:{ key:built.key, drawingId:data.id, rev:data.rev,
                    kind:kind, title:title, frame:0, follow:false } };
    list.push(s);
    selected=s; extra=[];
    syncPalette(); render();
  }catch(err){
    alert('Could not make that object: '+(err.message||err));
  }
  btn.disabled=false;
}
document.getElementById('mkObjBtn').addEventListener('click',e=>{
  e.stopPropagation();
  document.getElementById('mkObjMenu').classList.toggle('hidden');
});
document.getElementById('mkObjMenu').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b && b.dataset.mkobj) makeObject(b.dataset.mkobj);
});
window.addEventListener('pointerdown',e=>{
  if(!e.target.closest('#mkObjWrap')) closeMkObjMenu();
});

/* ------------------------------------------------- editing an object in place
   A reference is normally inert - editable() refuses everything but move and
   resize. This is the way in: the object's own document is pushed on top of this
   one, so the view switch and the animation bar become ITS (an eye sheet's six
   named expressions, locked), and the drawing it came out of stays on screen
   behind it as context. Done saves it and repoints every instance at the new
   revision, which is exactly what the Library's Update already does. */
const canEditRef = s => {
  if(!session || !s || !s.ref) return false;
  const e=refLib.get(s.ref.key);
  if(!e) return false;
  // ownerId is new; a scene saved before it existed still carries the username
  return e.ownerId ? e.ownerId===session.id : (!!e.author && e.author===session.username);
};

let editStack=[];   // one entry per level of nesting

/* The parent, drawn ghosted in the object's own coordinates. The reference maps
   object space to parent space as p = R(rot).S(sx,sy).(o - c) + (x,y), so this
   is that inverted. A scene saved before entries carried a centre has nothing to
   align against, so it simply gets no backdrop. */
function drawEditBackdrop(){
  if(!editStack.length) return;
  const c=editStack[editStack.length-1];
  const p=c.place;
  if(!p || p.cx==null || !p.sx || !p.sy) return;
  const list=((c.scene.views||{})[c.view]||[])[c.frame]||[];
  if(!list.length) return;
  ctx.save();
  ctx.translate(p.cx,p.cy);
  ctx.scale(1/p.sx, 1/p.sy);
  ctx.rotate(-p.rot);
  ctx.translate(-p.x,-p.y);
  for(const s of list) if(s.id!==c.shapeId) drawShape(s,{ghost:true, pframe:c.frame});
  ctx.restore();
}

async function enterObjectEdit(shape){
  if(!canEditRef(shape)) return;
  if(editStack.length>=REF_MAX_DEPTH) return;
  const entry=refLib.get(shape.ref.key);
  const btn=document.getElementById('editRefBtn');
  btn.disabled=true;
  try{
    pauseAnim();
    const c=await db();
    const {data,error}=await c.from('cs_drawings')
      .select('id,scene,title,kind,rev,tags,published').eq('id',shape.ref.drawingId).single();
    if(error) throw error;

    editStack.push({
      scene:sceneToJSON(), view:view, frame:frame, dirty:dirty,
      id:currentDrawingId, title:currentDrawingTitle, rev:currentDrawingRev,
      tags:(currentDrawingTags||[]).slice(), published:currentDrawingPublished,
      shapeId:shape.id, refKey:shape.ref.key,
      place:{ x:shape.x, y:shape.y, rot:shape.rot, sx:shape.sx, sy:shape.sy,
              cx:entry.cx, cy:entry.cy }
    });

    /* sceneFromJSON runs setViewNames, so the view switch and the animation bar
       become the object's with nothing extra to do - which is the whole ask. */
    sceneFromJSON(data.scene);
    currentDrawingId=data.id;
    currentDrawingRev=data.rev||1;
    currentDrawingTitle=data.title||null;
    currentDrawingTags=(data.tags||[]).slice();
    currentDrawingPublished=!!data.published;
    syncChrome(); syncPalette(); render();
  }catch(err){
    editStack.pop();
    alert('Could not open that object: '+(err.message||err));
  }
  btn.disabled=false;
}

function popEditContext(){
  const c=editStack.pop();
  sceneFromJSON(c.scene);
  currentDrawingId=c.id; currentDrawingTitle=c.title; currentDrawingRev=c.rev;
  currentDrawingTags=c.tags; currentDrawingPublished=c.published;
  setView(c.view);
  frame=Math.max(0,Math.min(frameCount()-1,c.frame));
  syncFrames();
  dirty=c.dirty;
  const back=cur().find(s=>s.id===c.shapeId);
  if(back){ selected=back; extra=[]; }
  return c;
}
async function exitObjectEdit(save){
  if(!editStack.length) return;
  if(!save && unsaved()){
    openModal({
      title:'Throw away these changes?',
      body:'The object has changes that are not saved. Leaving now loses them.',
      buttons:[
        {label:'Save', primary:true, onClick:()=>exitObjectEdit(true)},
        {label:'Throw it away', danger:true, onClick:()=>{ dirty=false; exitObjectEdit(false); }},
        {label:'Cancel'}
      ]
    });
    return;
  }
  const done=document.getElementById('btnEditDone');
  const cancel=document.getElementById('btnEditCancel');
  done.disabled=cancel.disabled=true;
  try{
    if(save){
      if(!currentDrawingTitle) currentDrawingTitle='Untitled';
      await saveDrawing();                    // the trigger bumps rev
      dirty=false;
      const c=popEditContext();
      /* updateRef re-fetches, keys the new revision on its own and repoints
         every instance holding position, rotation and on-screen width - and
         because it is the SHAPES that move, the parent's undo covers it. */
      await updateRef(c.refKey);
    }else{
      popEditContext();
    }
    syncChrome(); syncPalette(); render();
  }catch(err){
    alert('Could not finish with that object: '+(err.message||err));
  }
  done.disabled=cancel.disabled=false;
}
document.getElementById('editRefBtn').addEventListener('click',()=>{
  const grp=selGroup();
  if(grp.length===1 && grp[0].ref) enterObjectEdit(grp[0]);
});
document.getElementById('btnEditDone')  .addEventListener('click',()=>exitObjectEdit(true));
document.getElementById('btnEditCancel').addEventListener('click',()=>exitObjectEdit(false));

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(modalOpen){
    if(e.key==='Escape'){ closeModal(); e.preventDefault(); return; }
    if(e.target===document.getElementById('modalInput') ||
       e.target===document.getElementById('modalInput2')) return;  // let the fields be typed
    e.preventDefault(); return;
  }
  // the login and gallery overlays own the keyboard while they are up
  if(uiScreen!=='draw'){
    if(e.key==='Escape' && uiScreen==='gallery') goScreen('draw');
    return;
  }
  if(e.ctrlKey||e.metaKey){                 // shortcuts first, so "c" is not a tool key
    // ...but a text field keeps its own clipboard, or Ctrl+V in the library
    // search box pastes a shape onto the canvas instead of text into the box.
    if(e.target.tagName==='INPUT' && (k==='c'||k==='v'||k==='x'||k==='a')) return;
    if(k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
    else if(k==='y'){ e.preventDefault(); redo(); }
    else if(k==='c'){ e.preventDefault(); copySelected(); }
    else if(k==='v'){ e.preventDefault(); pasteClipboard(); }
    else if(k==='d'){ e.preventDefault(); duplicateSelected(); }
    return;
  }
  if(e.target.tagName==='INPUT') return;    // let the sliders and the search box keep their keys
  /* Q and E walk the animation, Tab turns the drawing round, space plays it.
     Q used to be the front/back switch; it is the frames that you step through
     constantly now, so they get the pair of keys under your left hand. */
  if(k==='q'){ pauseAnim(); stepFrame(-1); render(); }
  else if(k==='e'){ pauseAnim(); stepFrame( 1); render(); }
  else if(e.key==='Tab'){ e.preventDefault(); toggleView(); render(); }
  else if(e.key===' '){ e.preventDefault(); togglePlay(); }
  else if(e.key==='1') setTool('brush');
  else if(e.key==='2') setTool('smear');
  else if(e.key==='3') setTool('eraser');
  else if(e.key==='4') setTool('hand');
  else if(k==='h') setShading(shading==='hatch'?'gradient':'hatch');
  else if(e.key==='Delete'||e.key==='Backspace') deleteSelected();
  else if(e.key==='ArrowUp'){   e.preventDefault(); reorderSel( 1); }   // up/down are depth,
  else if(e.key==='ArrowDown'){ e.preventDefault(); reorderSel(-1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); pauseAnim(); stepFrame(-1); render(); }
  else if(e.key==='ArrowRight'){e.preventDefault(); pauseAnim(); stepFrame( 1); render(); }
});

/* ================================================================== boot */
resize();
setViewNames('character');    // builds the view switch; the markup only seeds it
setView(viewNames[0]);
syncFrames();
setTool('brush');
syncHistory();
syncPalette();
startRenderLoop();

/* Restoring a session is asynchronous now - supabase-js reads and refreshes the
   token itself - so the login screen goes up first with its fields disabled,
   and the check either signs us straight through or hands the card over. */
/* Anyone who used the username-only build still has its session object sitting
   in localStorage under 'cs.session'. Nothing reads it any more, but leaving it
   there invites a future debugging session to believe the old login is still in
   play. supabase-js keeps its own token under 'sb-<ref>-auth-token'. */
try{ localStorage.removeItem('cs.session'); }catch(e){}

const bootHash=location.hash||'';           // read it BEFORE goScreen overwrites it
goScreen('login');
(async()=>{
  try{
    const c=await db();
    const {data:{session:tok}}=await c.auth.getSession();
    if(!tok){ syncLogin(); return; }        // sbLoaded is true by here: enables the form
    await loadMe();
    if(bootHash==='#draw') showScreen('draw');
    else goScreen('gallery');
  }catch(e){
    console.warn('Could not restore the session:',e);
    session=null;
  }
  syncLogin();
})();
</script>
